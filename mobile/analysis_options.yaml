# [Sprint 59 F3] The analyzer, strict: types are checked where Dart would let them pass (casts, inference, raw types),
# futures are awaited or marked, the context is not used after a gap, subscriptions are cancelled, and dynamic calls
# are refused. `flutter analyze` must be clean; the code is formatted at 140 columns (dart format, checked by CI).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 140

linter:
  rules:
    unawaited_futures: true
    use_build_context_synchronously: true
    prefer_const_constructors: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
