name: glm
description: "Game Legend Manager — المدرب الأسطورة"
publish_to: 'none'

version: 2.4.0+15

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.4
  share_plus: ^13.3.1
  app_links: ^7.2.2
  wakelock_plus: ^1.8.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.2.4
  record: ^7.2.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  model_viewer_plus: ^1.10.0
  dart_pusher_channels: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    # [2026-11-06] The game's own sounds (tool/sounds/make_sounds.py).
    - assets/sounds/
    # [Sprint 46] The opening's squad, rendered in Unity (unity/build.ps1 splash).
    - assets/splash/
    # [Sprint 50 M23] The 3D models, made from code (tools/models/make_models.py).
    - assets/models/
  # [Sprint 15 F1] The game's fonts, bundled (the web serves the same, X100): Tajawal for the words, Barlow Condensed for
  # the numbers. Both SIL Open Font License.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-700.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-800.ttf
          weight: 800


# [Sprint 15 F1] The launcher icon (the logo; Android's adaptive icon: the crest on the night navy) and the native
# launch screen before Flutter starts: `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/brand/app-icon.png
  adaptive_icon_background: "#0B1A2C"
  adaptive_icon_foreground: tool/brand/icon-foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1A2C"
  image: tool/brand/splash.png
  android_12:
    color: "#0B1A2C"
    image: tool/brand/icon-foreground.png
