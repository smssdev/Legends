<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الحالة</title>
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",

          "react/jsx-runtime": "/vendor/jsx-runtime.js"
        }

    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.card { background: white; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 10px rgb(67 56 202 / 0.1); max-width: 460px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.big { font-size: 2rem; font-weight: 700; color: #4338ca; margin: 0 0 8px; }
label { display: block; font-weight: 600; margin-top: 8px; }
input { font: inherit; padding: 6px 10px; border: 2px solid #c7d2fe; border-radius: 10px; width: 100%; }
ul { list-style: none; padding: 0; margin: 8px 0; }
li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eef2ff; }
li span { flex: 1; }
.muted { color: #5b5873; }
.ok { color: #047857; font-weight: 700; }
pre { background: #1e1b2e; color: #e0e7ff; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; white-space: pre-wrap; }
    </style>
