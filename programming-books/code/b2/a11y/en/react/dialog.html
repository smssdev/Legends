<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessibility</title>
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react/jsx-runtime": "/vendor/jsx-runtime.js",
          "react-router": "/vendor/react-router.js",
          "@tanstack/react-query": "/vendor/react-query.js",
          "react-hook-form": "/vendor/react-hook-form.js",
          "zod": "/vendor/zod.js",
          "@hookform/resolvers/zod": "/vendor/hookform-zod.js",
          "zustand": "/vendor/zustand.js",
          "zustand/middleware": "/vendor/zustand-middleware.js"
        }
      }
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.card { background: white; border-radius: 12px; padding: 12px 14px; }
dialog { border: 0; border-radius: 16px; padding: 18px 20px; max-width: 380px; box-shadow: 0 10px 40px rgb(0 0 0 / 0.3); }
dialog::backdrop { background: rgb(30 27 46 / 0.55); }
dialog h2 { margin-top: 0; }
.row { display: flex; gap: 8px; justify-content: flex-end; }
.danger { background: #b91c1c; }
.menu-wrap { position: relative; display: inline-block; }
[role="menu"] { position: absolute; inset-inline-start: 0; top: calc(100% + 6px); min-width: 220px; background: white; border-radius: 12px; padding: 6px; margin: 0; list-style: none; box-shadow: 0 8px 24px rgb(30 27 46 / 0.2); }
[role="menuitem"] { display: block; width: 100%; text-align: start; background: none; color: #1e1b2e; border-radius: 8px; padding: 8px 10px; }
[role="menuitem"]:focus { background: #eef2ff; outline: none; }
[role="menuitem"].danger-text { color: #b91c1c; }
body { min-height: 330px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dialog.js"></script>
  </body>
</html>
