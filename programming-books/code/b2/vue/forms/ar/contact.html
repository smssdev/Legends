<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>النماذج</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue.js",
          "vue-router": "/vendor/vue-router.js",
          "pinia": "/vendor/pinia.js",
          "@tanstack/vue-query": "/vendor/vue-query.js",
          "vee-validate": "/vendor/vee-validate.js",
          "@vueuse/core": "/vendor/vueuse.js",
          "zod": "/vendor/zod.js"
        }
      }
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
form, .card { background: white; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 10px rgb(67 56 202 / 0.1); max-width: 440px; }
.field { margin-bottom: 10px; }
label { display: block; font-weight: 600; margin-bottom: 3px; }
input, textarea, select { font: inherit; width: 100%; padding: 7px 10px; border: 2px solid #c7d2fe; border-radius: 10px; background: white; }
input[aria-invalid="true"], textarea[aria-invalid="true"], select[aria-invalid="true"] { border-color: #b91c1c; }
.error { color: #b91c1c; font-size: 0.9rem; margin: 3px 0 0; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.check input { width: auto; }
.done { color: #047857; font-weight: 700; }
.steps { display: flex; gap: 6px; margin-bottom: 12px; list-style: none; padding: 0; }
.steps li { flex: 1; text-align: center; padding: 4px; border-radius: 999px; background: #eef2ff; color: #5b5873; font-size: 0.9rem; }
.steps li[aria-current="step"] { background: #4338ca; color: white; font-weight: 700; }
.row { display: flex; gap: 8px; justify-content: space-between; }
dt { font-weight: 700; } dd { margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./contact.js"></script>
  </body>
</html>
