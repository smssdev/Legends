<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bit's shop</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue.js",
          "vue-router": "/vendor/vue-router.js",
          "pinia": "/vendor/pinia.js",
          "@tanstack/vue-query": "/vendor/vue-query.js",
          "vee-validate": "/vendor/vee-validate.js",
          "@vueuse/core": "/vendor/vueuse.js",
          "zod": "/vendor/zod.js"
        }
      }
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.tabs { max-width: 460px; background: white; border-radius: 14px; box-shadow: 0 2px 10px rgb(67 56 202 / 0.1); overflow: hidden; }
[role="tablist"] { display: flex; border-bottom: 2px solid #e0e7ff; }
[role="tab"] { flex: 1; border-radius: 0; background: none; color: #5b5873; padding: 10px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
[role="tab"][aria-selected="true"] { color: #4338ca; font-weight: 700; border-bottom-color: #4338ca; }
[role="tabpanel"] { padding: 14px 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./tabs.js"></script>
  </body>
</html>
