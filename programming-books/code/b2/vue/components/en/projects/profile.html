<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bit's shop</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue.js",
          "vue-router": "/vendor/vue-router.js",
          "pinia": "/vendor/pinia.js",
          "@tanstack/vue-query": "/vendor/vue-query.js",
          "vee-validate": "/vendor/vee-validate.js",
          "@vueuse/core": "/vendor/vueuse.js",
          "zod": "/vendor/zod.js"
        }
      }
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.profile { max-width: 340px; background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 18px rgb(67 56 202 / 0.15); }
.cover { height: 70px; background: linear-gradient(135deg, #4338ca, #db2777); }
.body { padding: 0 18px 18px; }
.avatar { width: 72px; height: 72px; border-radius: 50%; border: 4px solid white; margin-top: -36px; background: #fbbf24; display: grid; place-items: center; font-size: 1.8rem; font-weight: 700; color: #1e1b2e; }
.body h2 { margin: 6px 0 0; color: #1e1b2e; }
.meta { color: #5b5873; margin: 0 0 8px; }
.stats { display: flex; gap: 18px; margin: 10px 0 14px; }
.stats b { display: block; font-size: 1.1rem; color: #4338ca; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./profile.js"></script>
  </body>
</html>
