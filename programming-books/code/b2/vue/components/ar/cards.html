<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>متجر بِت</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor-vue/vue.js",
          "vue-router": "/vendor-vue/vue-router.js",
          "pinia": "/vendor-vue/pinia.js",
          "@tanstack/vue-query": "/vendor-vue/vue-query.js",
          "@vueuse/core": "/vendor-vue/vueuse.js",
          "zod": "/vendor-vue/zod.js"
        }
      }
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: white; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgb(67 56 202 / 0.1); display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-size: 1rem; margin: 0; color: #1e1b2e; }
.price { font-weight: 700; color: #4338ca; margin: 0; }
.badge { align-self: flex-start; font-size: 0.75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; }
.card button:disabled { background: #e5e7eb; color: #6b7280; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./cards.js"></script>
  </body>
</html>
