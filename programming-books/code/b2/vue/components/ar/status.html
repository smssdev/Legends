<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>متجر بِت</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue.js",
          "vue-router": "/vendor/vue-router.js",
          "pinia": "/vendor/pinia.js",
          "@tanstack/vue-query": "/vendor/vue-query.js",
          "vee-validate": "/vendor/vee-validate.js",
          "@vueuse/core": "/vendor/vueuse.js",
          "zod": "/vendor/zod.js"
        }
      }

    <style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #1e1b2e; background: #f5f5fb; line-height: 1.5; }
h1, h2, h3 { color: #4338ca; margin: 0 0 8px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 16px; background: #4338ca; color: white; }
button.secondary { background: #e0e7ff; color: #312e81; }
:focus-visible { outline: 3px solid #db2777; outline-offset: 2px; }
.panel { background: white; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 10px rgb(67 56 202 / 0.1); }
.panel p { margin: 0; }
.muted { color: #5b5873; }
.error { color: #b91c1c; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 3px solid #c7d2fe; border-top-color: #4338ca; border-radius: 50%; margin-inline-end: 8px; vertical-align: -2px; }
ul { margin: 0; padding-inline-start: 20px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./status.js"></script>
  </body>
