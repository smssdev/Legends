<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lists</title>
  </head>
  <body>
    <h1>Making tea</h1>

    <h2>You need</h2>
    <ul>
      <li>Water</li>
      <li>Tea leaves</li>
      <li>A cup</li>
      <li>Sugar (optional)</li>
    </ul>

    <h2>Steps</h2>
    <ol>
      <li>Boil the water.</li>
      <li>Put the tea in the cup.</li>
      <li>Pour the water and wait three minutes.</li>
      <li>Add sugar if you like.</li>
    </ol>
  </body>
</html>
