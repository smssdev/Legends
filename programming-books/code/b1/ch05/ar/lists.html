    <title>القوائم</title>

  <body>
    <h1>إعداد الشاي</h1>

    <h2>تحتاج إلى</h2>
    <ul>
      <li>ماء</li>
      <li>شاي</li>
      <li>كوب</li>
      <li>سكر (اختياري)</li>
    </ul>

    <h2>الخطوات</h2>
    <ol>
      <li>اغلِ الماء.</li>
      <li>ضع الشاي في الكوب.</li>
      <li>صبّ الماء وانتظر ثلاث دقائق.</li>
      <li>أضف السكر إن أحببت.</li>
    </ol>
