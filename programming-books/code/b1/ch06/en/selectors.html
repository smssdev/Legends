<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selectors</title>
    <style>
      h1 {
        color: #4338ca;
      }
      .intro {
        font-style: italic;
      }
      #featured {
        background-color: #fef3c7;
      }
      li .badge {
        color: white;
        background-color: #db2777;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Bit’s reading list</h1>
    <p class="intro">Books that every new developer should read.</p>
    <ul>
        <li id="featured">Code from Zero <span class="badge">New</span></li>
        <li>Senior Frontend Engineering</li>
        <li>Senior Backend Engineering</li>
    </ul>
    <p>This list is updated every month.</p>
  </body>
</html>
