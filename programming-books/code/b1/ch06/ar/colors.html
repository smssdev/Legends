<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الألوان</title>
    <style>
      p {
        padding: 8px;
        color: white;
      }
      .named { background-color: tomato; }
      .hex { background-color: #4338ca; }
      .rgb { background-color: rgb(15, 118, 110); }
      .alpha { background-color: rgba(67, 56, 202, 0.4); color: black; }
    </style>
  </head>
  <body>
    <h1>الألوان</h1>
    <p class="named">اسم: tomato</p>
    <p class="hex">سداسي: #4338ca</p>
    <p class="rgb">RGB: rgb(15, 118, 110)</p>
    <p class="alpha">مع شفافية</p>
  </body>
</html>
