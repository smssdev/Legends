<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>معرض بالشبكة</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .gallery div {
        padding: 28px 8px;
        text-align: center;
        border-radius: 12px;
        color: white;
        background-color: #7c3aed;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <div>HTML</div>
      <div>CSS</div>
      <div>JavaScript</div>
      <div>Git</div>
      <div>Node.js</div>
      <div>DevTools</div>
    </div>
  </body>
</html>
