<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centring</title>
    <style>
      body {
        margin: 0;
        min-height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #eef2ff;
        font-family: system-ui, sans-serif;
      }
      .card {
        padding: 24px 32px;
        border-radius: 16px;
        color: white;
        background-color: #db2777;
        font-size: 1.4rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">Perfectly centred!</div>
  </body>
</html>
