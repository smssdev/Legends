<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>كنوز نور</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --c-bg:#241b4b;
  --c-bg-2:#3b2d7c;
  --c-overlay:rgba(28,20,64,.58);
  --c-overlay-strong:rgba(28,20,64,.9);
  --c-panel:#fff7e6;
  --c-panel-2:#ffe9bd;
  --c-edge:#efb54a;
  --c-ink:#45301b;
  --c-ink-soft:#7b5f42;
  --c-accent:#ff8a2b;
  --c-accent-shadow:#c45a10;
  --c-accent-ink:#ffffff;
  --c-good:#36b36a;
  --c-good-shadow:#1f7d45;
  --c-sky:#4aa9ec;
  --c-sky-shadow:#2b73b0;
  --c-gold:#ffc928;
  --c-gold-dark:#d99a00;
  --c-star-off:#e3d6bd;
  --c-lock:#9d93c2;
  --c-focus:#33d1ff;
  --c-white:#ffffff;
  --c-touch:rgba(255,255,255,.26);
  --c-touch-on:rgba(255,255,255,.62);
  --c-touch-edge:rgba(255,255,255,.75);
  --font:"Baloo Bhaijaan 2","Noto Sans Arabic",Tahoma,sans-serif;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--c-bg);}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
#app{position:relative;height:100%;width:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;
  background:radial-gradient(ellipse at 50% -10%, var(--c-bg-2), var(--c-bg) 70%);}
#stageWrap{position:relative;width:100%;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
#app.portrait #stageWrap{flex:0 0 auto;}
#stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
#cv{display:block;width:100%;height:100%;touch-action:none;}
#pcv{display:block;flex:0 0 auto}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;}
button{font-family:inherit}
.hbtn{width:max(38px, calc(var(--s,1) * 54px));height:max(38px, calc(var(--s,1) * 54px));border-radius:50%;border:3px solid var(--c-white);background:rgba(36,27,75,.55);color:var(--c-white);display:grid;place-items:center;padding:0;cursor:pointer;}
.hbtn svg{width:58%;height:58%}
.hbtn:focus-visible,.btn:focus-visible,.lvl:focus-visible,.chip:focus-visible{outline:4px solid var(--c-focus);outline-offset:3px}
#hudBtns{position:absolute;top:calc(var(--s,1) * 12px);left:calc(var(--s,1) * 12px);display:flex;gap:6px;direction:ltr;z-index:3}
#touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px;pointer-events:none;direction:ltr;z-index:4}
#touch .pad{display:flex;gap:14px;pointer-events:auto;touch-action:none}
.tbtn{width:76px;height:76px;border-radius:50%;background:var(--c-touch);border:3px solid var(--c-touch-edge);display:grid;place-items:center;touch-action:none;padding:0;color:var(--c-white);-webkit-user-select:none;user-select:none}
.tbtn svg{width:46%;height:46%;pointer-events:none}
.tbtn.big{width:92px;height:92px}
.tbtn.on{background:var(--c-touch-on);transform:scale(.94)}
#padBar{flex:0 0 auto;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px}
#app.portrait #touch{position:static;width:100%;padding:4px 0}
#app.portrait .tbtn{width:84px;height:84px}
#app.portrait .tbtn.big{width:100px;height:100px}
#rotateHint{display:flex;align-items:center;gap:8px;color:var(--c-white);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}
#rotateHint svg{width:26px;height:26px;flex:none}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px max(16px, env(safe-area-inset-left, 0px));overflow-y:auto;overflow-x:hidden;background:var(--c-overlay);}
.screen.title{background:linear-gradient(180deg, rgba(36,27,75,.55), rgba(36,27,75,.88));}
.card{background:var(--c-panel);border:4px solid var(--c-edge);border-radius:28px;box-shadow:0 7px 0 rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.3);padding:clamp(14px,3vmin,28px);text-align:center;max-width:min(560px,100%);width:100%;margin:auto;}
.card h2{margin:0;font-size:clamp(26px,5vmin,44px);line-height:1.3;color:var(--c-ink)}
.card p{margin:.3em 0 .6em;font-size:clamp(17px,3.2vmin,26px);line-height:1.5;color:var(--c-ink-soft);font-weight:700}
.btn{font-weight:800;font-size:clamp(19px,3.4vmin,28px);color:var(--c-accent-ink);background:var(--c-accent);border:0;border-radius:999px;padding:.3em 1.2em .42em;min-height:52px;min-width:52px;box-shadow:0 5px 0 var(--c-accent-shadow);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;transition:transform .08s;line-height:1.3}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c-accent-shadow)}
.btn.green{background:var(--c-good);box-shadow:0 5px 0 var(--c-good-shadow)}
.btn.blue{background:var(--c-sky);box-shadow:0 5px 0 var(--c-sky-shadow)}
.btn.small{font-size:clamp(16px,2.8vmin,21px);min-height:46px;padding:.2em .9em .3em}
.btn svg{width:1em;height:1em}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
/* title */
.title-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(10px,3vw,36px);align-items:center;width:min(1040px,100%);margin:auto}
.title-main{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vmin,16px)}
#logo{width:100%;max-width:440px;height:auto;max-height:36vh;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.title-main .btn{font-size:clamp(24px,5vmin,40px);padding:.25em 1.6em .38em}
.side{background:var(--c-panel);border:4px solid var(--c-edge);border-radius:26px;padding:clamp(10px,2.2vmin,20px);box-shadow:0 7px 0 rgba(0,0,0,.18)}
.side h2{margin:0 0 6px;font-size:clamp(18px,3.4vmin,26px);text-align:center}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.6vmin,12px)}
.lvl{position:relative;border:3px solid var(--c-edge);background:var(--c-panel-2);border-radius:18px;padding:5px 5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--c-ink);font-weight:800;font-size:clamp(13px,2.4vmin,18px);line-height:1.25;min-height:48px}
.lvl canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block;background:var(--c-bg-2)}
.lvl .stars{display:flex;gap:2px;direction:ltr}
.lvl .stars svg{width:clamp(14px,2.6vmin,20px);height:clamp(14px,2.6vmin,20px)}
.lvl[disabled]{cursor:not-allowed;filter:grayscale(.75);opacity:.8}
.lvl .lock{position:absolute;top:18%;left:50%;transform:translateX(-50%);width:clamp(28px,6vmin,44px);height:clamp(28px,6vmin,44px);background:var(--c-lock);border-radius:50%;display:grid;place-items:center;border:3px solid var(--c-white)}
.lvl .lock svg{width:55%;height:55%}
.settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(6px,1.6vmin,12px)}
.chip{font-weight:800;font-size:clamp(14px,2.6vmin,18px);border:3px solid var(--c-edge);background:var(--c-white);color:var(--c-ink);border-radius:999px;padding:4px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip svg{width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--c-gold);}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:clamp(6px,1.6vmin,12px)}
.howto div{background:var(--c-panel-2);border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:clamp(11.5px,2.1vmin,15px);font-weight:700;line-height:1.3;text-align:center;color:var(--c-ink-soft)}
.howto svg{width:clamp(30px,6vmin,46px);height:clamp(30px,6vmin,46px)}
@media (max-aspect-ratio: 1/1){
  .screen.title{background:linear-gradient(180deg, var(--c-bg-2), var(--c-bg))}
  .title-grid{grid-template-columns:minmax(0,1fr)}
  #logo{max-height:24vh}
}
.bigstars{display:flex;justify-content:center;gap:8px;direction:ltr;margin:4px 0 8px}
.bigstars svg{width:clamp(48px,11vmin,84px);height:clamp(48px,11vmin,84px)}
.bigstars svg.on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg:nth-child(2).on{animation-delay:.25s}
.bigstars svg:nth-child(3).on{animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.badge{display:inline-block;background:var(--c-accent);color:var(--c-white);border-radius:999px;padding:0 14px;font-weight:800;font-size:clamp(15px,2.8vmin,20px)}
.coinline{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:clamp(17px,3vmin,24px);color:var(--c-ink)}
.coinline svg{width:26px;height:26px}
#treasure{width:min(260px,60%);height:auto}
@media (prefers-reduced-motion: reduce){
  .bigstars svg.on{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>

<div id="app" dir="rtl">
  <canvas id="pcv" hidden aria-hidden="true"></canvas>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="cv" dir="rtl" role="img" aria-label="لعبة كنوز نور"></canvas>
      <div id="hudBtns" hidden>
        <button id="btnPause" class="hbtn" type="button" aria-label="إِيقَافٌ مُؤَقَّت">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg>
        </button>
        <button id="btnMuteHud" class="hbtn" type="button" aria-label="الصَّوْت"></button>
      </div>
      <div id="touch" hidden>
        <div class="pad" id="padMove">
          <button class="tbtn" type="button" tabindex="-1" data-key="left" aria-label="يَسَار"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3.5 6 12l9.5 8.5c1 .9 2.5.2 2.5-1.1V4.6c0-1.3-1.5-2-2.5-1.1z"/></svg></button>
          <button class="tbtn" type="button" tabindex="-1" data-key="right" aria-label="يَمِين"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3.5 18 12l-9.5 8.5C7.5 21.4 6 20.7 6 19.4V4.6c0-1.3 1.5-2 2.5-1.1z"/></svg></button>
        </div>
        <div class="pad" id="padJump">
          <button class="tbtn big" type="button" tabindex="-1" data-key="jump" aria-label="اِقْفِزْ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 15.5 12 6l8.5 9.5c.9 1 .2 2.5-1.1 2.5H4.6c-1.3 0-2-1.5-1.1-2.5z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <div id="padBar" hidden>
    <div id="rotateHint"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="14" height="24" rx="3"/><path d="M27 18a11 11 0 0 1-9 10"/><path d="M15 27l3 1-1 3"/></svg><span>أَدِرِ الْهَاتِفَ لِلَعِبٍ أَجْمَلَ</span></div>
  </div>

  <section id="scrTitle" class="screen title" aria-label="الشاشة الرئيسية">
    <div class="title-grid">
      <div class="title-main">
        <svg id="logo" viewBox="0 0 440 200" role="img" aria-label="كنوز نور">
          <defs>
            <radialGradient id="lgGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd84a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient>
            <linearGradient id="lgChest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c77a3a"/><stop offset="1" stop-color="#8d4e22"/></linearGradient>
            <linearGradient id="lgText" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset=".55" stop-color="#ffcb2f"/><stop offset="1" stop-color="#ff9c1a"/></linearGradient>
          </defs>
          <circle cx="220" cy="52" r="58" fill="url(#lgGlow)"/>
          <g stroke="#ffe680" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M220 40V12"/><path d="M196 46 180 24"/><path d="M244 46l16-22"/><path d="M182 60l-24-8"/><path d="M258 60l24-8"/></g>
          <path d="M184 58c0-14 16-24 36-24s36 10 36 24z" fill="#a8602b" stroke="#5a2f12" stroke-width="4" stroke-linejoin="round" transform="rotate(-14 184 58)"/>
          <rect x="182" y="58" width="76" height="46" rx="10" fill="url(#lgChest)" stroke="#5a2f12" stroke-width="4"/>
          <rect x="182" y="70" width="76" height="9" fill="#ffc928" stroke="#5a2f12" stroke-width="3"/>
          <rect x="212" y="64" width="16" height="22" rx="4" fill="#ffc928" stroke="#5a2f12" stroke-width="3"/>
          <circle cx="198" cy="56" r="7" fill="#7ef0ff" stroke="#5a2f12" stroke-width="2.5"/>
          <circle cx="242" cy="54" r="6" fill="#ff7fd0" stroke="#5a2f12" stroke-width="2.5"/>
          <circle cx="220" cy="50" r="7" fill="#ffe14d" stroke="#5a2f12" stroke-width="2.5"/>
          <path d="M300 34c18-14 40-6 46 10" fill="none" stroke="#fff6b0" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
          <circle cx="352" cy="50" r="16" fill="url(#lgGlow)"/>
          <ellipse cx="346" cy="45" rx="7" ry="5" fill="#ffffff" opacity=".8" transform="rotate(-30 346 45)"/>
          <ellipse cx="356" cy="45" rx="7" ry="5" fill="#ffffff" opacity=".8" transform="rotate(30 356 45)"/>
          <circle cx="352" cy="52" r="6" fill="#ffe14d" stroke="#6a4a00" stroke-width="2"/>
          <text x="220" y="168" text-anchor="middle" direction="rtl" font-family="Baloo Bhaijaan 2, Noto Sans Arabic, Tahoma, sans-serif" font-weight="800" font-size="80" fill="url(#lgText)" stroke="#5b2a8c" stroke-width="12" stroke-linejoin="round" paint-order="stroke">كُنُوزُ نُور</text>
        </svg>
        <button id="btnPlay" class="btn" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 4.5v15c0 1-1.1 1.6-2 1.1L3.7 13.1a1.3 1.3 0 0 1 0-2.2L15 3.4c.9-.5 2 .1 2 1.1z"/></svg><span>اِلْعَبْ</span></button>
      </div>
      <div class="side">
        <h2>اِخْتَرِ الْمَرْحَلَةَ</h2>
        <div id="levelList" class="levels"></div>
        <div class="settings">
          <button id="btnSound" class="chip" type="button" aria-pressed="true"></button>
          <button id="btnDigits" class="chip" type="button" aria-pressed="true"></button>
          <button id="btnFull" class="chip" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>مِلْءُ الشَّاشَةِ</span></button>
        </div>
        <div class="howto" aria-label="طريقة اللعب">
          <div><svg viewBox="0 0 48 48"><rect x="3" y="18" width="14" height="14" rx="4" fill="#4aa9ec"/><rect x="31" y="18" width="14" height="14" rx="4" fill="#4aa9ec"/><path d="M12 21l-5 4 5 4zM36 21l5 4-5 4z" fill="#fff"/><path d="M24 6l-6 7h12z" fill="#ff8a2b"/><rect x="21" y="12" width="6" height="12" rx="3" fill="#ff8a2b"/></svg><span>تَحَرَّكْ وَاقْفِزْ</span></div>
          <div><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#fff" stroke="#8fd3ff" stroke-width="4"/><text x="24" y="31" text-anchor="middle" font-size="22" font-weight="800" fill="#4b2d8c" font-family="Baloo Bhaijaan 2, Tahoma, sans-serif">ب</text><circle cx="16" cy="15" r="4" fill="#fff" opacity=".9"/></svg><span>اِجْمَعِ الصَّحِيحَ</span></div>
          <div><svg viewBox="0 0 48 48"><path d="M12 44V18a12 12 0 0 1 24 0v26z" fill="#c97b3e" stroke="#7a4219" stroke-width="3"/><path d="M24 8v36" stroke="#7a4219" stroke-width="2"/><circle cx="30" cy="30" r="2.5" fill="#ffc928"/><path d="M38 10l4-4M40 18h5M6 18H1M10 10 6 6" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/></svg><span>يُفْتَحُ الْبَابُ</span></div>
          <div><svg viewBox="0 0 48 48"><circle cx="26" cy="26" r="16" fill="#ffe680" opacity=".45"/><ellipse cx="20" cy="20" rx="8" ry="5" fill="#fff" opacity=".85" transform="rotate(-30 20 20)"/><ellipse cx="32" cy="20" rx="8" ry="5" fill="#fff" opacity=".85" transform="rotate(30 32 20)"/><circle cx="26" cy="28" r="8" fill="#ffd93b" stroke="#8a6400" stroke-width="2"/><circle cx="23" cy="27" r="1.6" fill="#333"/><circle cx="29" cy="27" r="1.6" fill="#333"/></svg><span>وَمِيضٌ يُسَاعِدُكَ</span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="scrIntro" class="screen" hidden aria-label="بداية المرحلة">
    <div class="card">
      <span class="badge" id="introBadge"></span>
      <h2 id="introName"></h2>
      <p id="introGoal"></p>
      <button id="btnStart" class="btn green" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 4.5v15c0 1-1.1 1.6-2 1.1L3.7 13.1a1.3 1.3 0 0 1 0-2.2L15 3.4c.9-.5 2 .1 2 1.1z"/></svg><span>اِبْدَأْ</span></button>
    </div>
  </section>

  <section id="scrPause" class="screen" hidden aria-label="استراحة">
    <div class="card">
      <h2>اِسْتِرَاحَةٌ</h2>
      <p>خُذْ نَفَسًا، ثُمَّ نُكْمِلُ!</p>
      <div class="row">
        <button id="btnResume" class="btn green" type="button"><span>أَكْمِلْ</span></button>
        <button id="btnRestart" class="btn blue small" type="button"><span>أَعِدِ الْمَرْحَلَةَ</span></button>
        <button id="btnHome1" class="btn small" type="button"><span>الْقَائِمَةُ</span></button>
      </div>
    </div>
  </section>

  <section id="scrDone" class="screen" hidden aria-label="انتهت المرحلة">
    <div class="card">
      <h2 id="doneTitle">أَحْسَنْتَ يَا بَطَلُ!</h2>
      <div class="bigstars" id="doneStars"></div>
      <div class="coinline" id="doneCoins"></div>
      <p id="doneMsg"></p>
      <div class="row">
        <button id="btnNext" class="btn green" type="button"><span>الْمَرْحَلَةُ التَّالِيَةُ</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3.5 6 12l9.5 8.5c1 .9 2.5.2 2.5-1.1V4.6c0-1.3-1.5-2-2.5-1.1z"/></svg></button>
        <button id="btnReplay" class="btn blue small" type="button"><span>أَعِدْ</span></button>
        <button id="btnHome2" class="btn small" type="button"><span>الْقَائِمَةُ</span></button>
      </div>
    </div>
  </section>

  <section id="scrFinal" class="screen" hidden aria-label="الاحتفال">
    <div class="card">
      <svg id="treasure" viewBox="0 0 260 170" aria-hidden="true">
        <defs><radialGradient id="trG" cx="50%" cy="60%" r="55%"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#fff7b0" stop-opacity="0"/></radialGradient></defs>
        <circle cx="130" cy="92" r="92" fill="url(#trG)"/>

  resume() { try { if (this.ctx && this.ctx.state === 'suspended') { const p = this.ctx.resume(); if (p && p.catch) p.catch(() => {}); } } catch (e) {} },
  setOn(v) { this.on = v; try { if (this.out) this.out.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.03); } catch (e) {} },
  tone(f, d, o = {}) {

  noise(d, o = {}) {

function drawBackground(ctx, th, cam, t, name) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]); g.addColorStop(0.6, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  const rep = (spacing, f, draw) => { const off = cam * f; const k0 = Math.floor((off - 200) / spacing), k1 = Math.ceil((off + VW + 200) / spacing); for (let k = k0; k <= k1; k++) draw(k * spacing - off, k); };
  if (name === 'forest') {
    // sun
    ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff7c2'; ctx.beginPath(); ctx.arc(800, 95, 75 + Math.sin(t * 1.5) * 4, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#ffe36a'; ctx.beginPath(); ctx.arc(800, 95, 46, 0, 7); ctx.fill();
    // clouds
    rep(420, 0.08, (x, k) => { const y = 70 + hash(k) * 90; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 12, 32, 0, 7); ctx.arc(x + 64, y, 24, 0, 7); ctx.rect(x, y, 64, 24); ctx.fill(); });
    // far hills
    rep(360, 0.2, (x, k) => { ctx.fillStyle = th.far; ctx.beginPath(); ctx.ellipse(x, 470, 240 + hash(k + 3) * 80, 160 + hash(k) * 60, 0, Math.PI, 0); ctx.fill(); });
    // mid trees
    rep(210, 0.45, (x, k) => { const h = hash(k + 9); const bx = x + h * 60; ctx.fillStyle = th.trunk; ctx.fillRect(bx - 8, 330 - h * 40, 16, 140); ctx.fillStyle = h > 0.5 ? th.mid : th.midDark; ctx.beginPath(); ctx.arc(bx, 320 - h * 40, 46 + h * 14, 0, 7); ctx.arc(bx - 34, 345 - h * 40, 34, 0, 7); ctx.arc(bx + 34, 345 - h * 40, 34, 0, 7); ctx.fill(); });
    rep(150, 0.7, (x, k) => { ctx.fillStyle = '#3f9e45'; ctx.beginPath(); ctx.arc(x, 455, 30 + hash(k) * 16, Math.PI, 0); ctx.arc(x + 40, 455, 24, Math.PI, 0); ctx.fill(); });
  } else if (name === 'cave') {
    rep(300, 0.15, (x, k) => { ctx.fillStyle = th.far; const h = 120 + hash(k) * 160; ctx.beginPath(); ctx.moveTo(x - 60, VH); ctx.lineTo(x, VH - h); ctx.lineTo(x + 50, VH); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 90, 0); ctx.lineTo(x + 120, 60 + hash(k + 1) * 90); ctx.lineTo(x + 150, 0); ctx.fill(); });
    rep(260, 0.4, (x, k) => {
      const c = th.glow[k % 3 < 0 ? 0 : Math.abs(k) % 3]; const bx = x + hash(k) * 80, by = 380 + hash(k + 4) * 60; const pulse = 0.5 + 0.5 * Math.sin(t * 2 + k);
      const gg = ctx.createRadialGradient(bx, by, 4, bx, by, 70); gg.addColorStop(0, c); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.25 + pulse * 0.2; ctx.fillStyle = gg; ctx.fillRect(bx - 70, by - 70, 140, 140); ctx.globalAlpha = 1;
      ctx.fillStyle = c; for (let i = 0; i < 3; i++) { const cx = bx - 18 + i * 18, ch = 30 + hash(k * 3 + i) * 40; ctx.beginPath(); ctx.moveTo(cx - 8, by + 20); ctx.lineTo(cx, by + 20 - ch); ctx.lineTo(cx + 8, by + 20); ctx.fill(); }
    });
    rep(180, 0.6, (x, k) => { ctx.fillStyle = th.midDark; const h = 40 + hash(k + 7) * 70; ctx.beginPath(); ctx.moveTo(x - 20, 0); ctx.lineTo(x, h); ctx.lineTo(x + 20, 0); ctx.fill(); });
    for (let i = 0; i < 24; i++) { const x = ((hash(i) * 1400 - cam * 0.3 + t * 12 * (1 + hash(i + 2))) % 1100 + 1100) % 1100 - 70; const y = 80 + hash(i + 5) * 340 + Math.sin(t + i) * 10; ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 3 + i); ctx.fillStyle = th.glow[i % 3]; ctx.beginPath(); ctx.arc(x, y, 2 + hash(i + 8) * 2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  } else {
    for (let i = 0; i < 40; i++) { const x = ((hash(i) * 2000 - cam * 0.05) % 1000 + 1000) % 1000 - 20, y = hash(i + 50) * 230; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 2 + i * 1.7); ctx.fillStyle = '#fff6c8'; starPath(ctx, x, y, 3.5, 1.5); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,248,214,.35)'; ctx.beginPath(); ctx.arc(170, 100, 58, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(170, 100, 40, 0, 7); ctx.fill();
    rep(520, 0.18, (x, k) => { ctx.fillStyle = th.far; const h = hash(k); const bx = x + h * 100; ctx.fillRect(bx, 260, 150, 300); for (let i = 0; i < 4; i++) ctx.fillRect(bx + i * 40, 245, 22, 20); ctx.fillRect(bx - 30, 200 - h * 40, 46, 360); ctx.beginPath(); ctx.moveTo(bx - 38, 202 - h * 40); ctx.lineTo(bx - 7, 150 - h * 40); ctx.lineTo(bx + 24, 202 - h * 40); ctx.fill(); ctx.fillStyle = '#ffd56b'; ctx.fillRect(bx - 14, 240 - h * 40, 12, 18); ctx.fillStyle = th.far; });
    rep(260, 0.42, (x, k) => { ctx.fillStyle = th.mid; ctx.beginPath(); ctx.ellipse(x, 480, 200, 110 + hash(k) * 40, 0, Math.PI, 0); ctx.fill(); });
  }
}

function solidChar(ch) { return ch === '#' || ch === 'W'; }
function drawGroundTile(ctx, th, x, y, c, r, top, lft, rgt) {
  ctx.fillStyle = th.dirt; ctx.fillRect(x, y, T + 0.6, T + 0.6);
  const h = hash(c * 7.3 + r * 13.1);
  ctx.fillStyle = th.dirtDark;
  ctx.beginPath(); ctx.arc(x + 9 + h * 24, y + 16 + h * 16, 3 + h * 2.5, 0, 7); ctx.arc(x + 30 - h * 12, y + 34 - h * 8, 2.4, 0, 7); ctx.fill();
  if (top) {
    ctx.fillStyle = th.top; rr(ctx, x - (lft ? 3 : 0), y - 5, T + (lft ? 3 : 0) + (rgt ? 3 : 0), 17, lft || rgt ? 8 : 0); ctx.fill();
    ctx.beginPath(); for (let i = 0; i < 3; i++) ctx.arc(x + 8 + i * 15, y + 11, 7, 0, Math.PI); ctx.fill();
    ctx.fillStyle = th.topLight; rr(ctx, x + 4, y - 3, T - 8, 5, 3); ctx.fill();

}
function drawPlatformTile(ctx, th, x, y, c, lEnd, rEnd, name) {
  const top = y + 2, h = 16;
  ctx.fillStyle = th.platDark; rr(ctx, x - (lEnd ? 2 : 0), top + 3, T + (lEnd ? 2 : 0) + (rEnd ? 2 : 0), h, lEnd || rEnd ? 8 : 0); ctx.fill();
  ctx.fillStyle = th.plat; rr(ctx, x - (lEnd ? 2 : 0), top, T + (lEnd ? 2 : 0) + (rEnd ? 2 : 0), h - 2, lEnd || rEnd ? 8 : 0); ctx.fill();
  ctx.strokeStyle = th.platDark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 6, top + 6); ctx.lineTo(x + T - 10, top + 6); ctx.stroke();
  if (name === 'forest' && (lEnd || rEnd)) { const ex = lEnd ? x + 4 : x + T - 4; ctx.fillStyle = '#e2b07a'; ctx.beginPath(); ctx.ellipse(ex, top + 7, 5, 7, 0, 0, 7); ctx.fill(); ctx.strokeStyle = th.platDark; ctx.beginPath(); ctx.ellipse(ex, top + 7, 2.5, 3.5, 0, 0, 7); ctx.stroke(); }

}
function drawWallTile(ctx, th, x, y, c, r, name) {
  if (name === 'forest') {
    ctx.fillStyle = th.wall; ctx.fillRect(x - 6, y, T + 12, T + 1);
    ctx.strokeStyle = th.wallDark; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 6, y + 4); ctx.lineTo(x + 8, y + 30); ctx.moveTo(x + 24, y + 12); ctx.lineTo(x + 22, y + 42); ctx.moveTo(x + 38, y + 2); ctx.lineTo(x + 40, y + 22); ctx.stroke();
    if (hash(r + c) > 0.7) { ctx.fillStyle = '#5ccc58'; ctx.beginPath(); ctx.ellipse(x + T + 6, y + 20, 10, 6, -0.5, 0, 7); ctx.fill(); }
  } else if (name === 'cave') {
    ctx.fillStyle = th.wall; ctx.fillRect(x - 4, y, T + 8, T + 1);
    ctx.fillStyle = th.wallDark; ctx.fillRect(x - 4, y, 8, T + 1);
    const col = th.glow[(c + r) % 3]; ctx.fillStyle = col; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(x + 14, y + 36); ctx.lineTo(x + 22, y + 8); ctx.lineTo(x + 30, y + 36); ctx.fill(); ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = th.wall; ctx.fillRect(x - 6, y, T + 12, T + 1);
    ctx.strokeStyle = th.wallDark; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { const yy = y + i * 15; ctx.beginPath(); ctx.moveTo(x - 6, yy); ctx.lineTo(x + T + 6, yy); ctx.stroke(); const off = (i + r) % 2 ? 0 : 18; ctx.beginPath(); ctx.moveTo(x + off + 6, yy); ctx.lineTo(x + off + 6, yy + 15); ctx.moveTo(x + off + 30, yy); ctx.lineTo(x + off + 30, yy + 15); ctx.stroke(); }
  }
}
function drawSpike(ctx, th, x, y, t, c) {
  const by = y + T;
  ctx.fillStyle = th.spikeDark; ctx.strokeStyle = th.spikeDark; ctx.lineJoin = 'round'; ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) { const sx = x + 8 + i * 14.5, h = i === 1 ? 26 : 20; ctx.beginPath(); ctx.moveTo(sx - 7, by); ctx.lineTo(sx, by - h - Math.sin(t * 3 + i + c) * 1.5); ctx.lineTo(sx + 7, by); ctx.closePath(); ctx.stroke(); ctx.fill(); }
  ctx.fillStyle = th.spike;
  for (let i = 0; i < 3; i++) { const sx = x + 8 + i * 14.5, h = i === 1 ? 22 : 16; ctx.beginPath(); ctx.moveTo(sx - 4, by - 2); ctx.lineTo(sx, by - h); ctx.lineTo(sx + 4, by - 2); ctx.fill(); }

function drawWater(ctx, th, x, y, t, surface, c) {

const PIC = {
  door(ctx, s) {
    const w = s * 0.62, h = s * 0.86;
    ctx.fillStyle = '#7a4219'; archPath(ctx, -w / 2 - s * 0.06, -h / 2 - s * 0.06, w + s * 0.12, h + s * 0.06); ctx.fill();
    ctx.fillStyle = '#c97b3e'; archPath(ctx, -w / 2, -h / 2, w, h); ctx.fill();

  moon(ctx, s) {

  },
  fish(ctx, s) {
    ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.moveTo(s * 0.22, 0); ctx.lineTo(s * 0.46, -s * 0.22); ctx.lineTo(s * 0.46, s * 0.22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.ellipse(-s * 0.04, 0, s * 0.32, s * 0.22, 0, 0, 7); ctx.fill();

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.05, s * 0.07, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-s * 0.21, -s * 0.05, s * 0.035, 0, 7); ctx.fill();
    ctx.fillStyle = '#e46d1a'; ctx.beginPath(); ctx.moveTo(-s * 0.02, -s * 0.2); ctx.quadraticCurveTo(s * 0.05, -s * 0.36, s * 0.14, -s * 0.18); ctx.fill();
  },
  apple(ctx, s) {
    ctx.fillStyle = '#e8383d'; ctx.beginPath(); ctx.arc(-s * 0.13, s * 0.04, s * 0.27, 0, 7); ctx.arc(s * 0.13, s * 0.04, s * 0.27, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6b6f'; ctx.beginPath(); ctx.ellipse(-s * 0.18, -s * 0.06, s * 0.07, s * 0.1, -0.4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6b3b1a'; ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -s * 0.18); ctx.lineTo(s * 0.04, -s * 0.36); ctx.stroke();
    ctx.fillStyle = '#4cbf4a'; ctx.beginPath(); ctx.ellipse(s * 0.15, -s * 0.3, s * 0.12, s * 0.06, -0.5, 0, 7); ctx.fill();
  },
  banana(ctx, s) {
    ctx.fillStyle = '#ffd93b'; ctx.strokeStyle = '#c9a100'; ctx.lineWidth = Math.max(1.5, s * 0.035);
    ctx.beginPath(); ctx.moveTo(-s * 0.38, -s * 0.2); ctx.quadraticCurveTo(-s * 0.2, s * 0.42, s * 0.4, s * 0.12); ctx.quadraticCurveTo(-s * 0.05, s * 0.2, -s * 0.26, -s * 0.28); ctx.closePath(); ctx.fill(); ctx.stroke();

const confetti = {
  bits: [], on: false,
  start(n) { this.bits = []; for (let i = 0; i < n; i++) this.bits.push({ x: Math.random(), y: -Math.random() * 0.6, vx: (Math.random() - 0.5) * 0.15, vy: 0.15 + Math.random() * 0.25, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, c: ['#ffc928', '#ff7fbf', '#7ef0ff', '#8be36e', '#ff8a2b', '#c9b5ff'][i % 6], s: 6 + Math.random() * 6, star: Math.random() < 0.3 }); this.on = true; },
  stop() { this.on = false; this.bits = []; fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, fxc.width, fxc.height); },
  step(dt) {
    if (!this.on) return;
    const W = fxc.width, H = fxc.height; fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const b of this.bits) {
      b.x += b.vx * dt * (REDUCED ? 0.4 : 1); b.y += b.vy * dt * (REDUCED ? 0.4 : 1); b.r += b.vr * dt; if (b.y < 1.1) alive++;

    }
    if (!alive) { for (const b of this.bits) { b.y = -0.1 - Math.random() * 0.3; b.x = Math.random(); } }
  }
};

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const fast = G.fast || 1; acc += dt * fast; let n = 0;
  while (acc >= STEP && n < 6 * fast) { update(STEP); acc -= STEP; n++; }
  if (n >= 6 * fast) acc = 0;
  try { render(); } catch (e) { console.error(e); }
  confetti.step(dt);
  requestAnimationFrame(frame);
}

      firefly: { x: G.ff.x, y: G.ff.y, hint: G.ff.hint ? { x: G.ff.hint.x, y: G.ff.hint.y } : null },
      stars: Save.data.stars.slice(), unlocked: Save.data.unlocked, digits: Save.data.digits
    };
  }
};

async function boot() {
  Save.load(); refreshSettings(); resize();
  try {
    const wait = new Promise((r) => setTimeout(r, 2500));
    const fonts = document.fonts ? Promise.all([document.fonts.load(`800 30px "Baloo Bhaijaan 2"`, 'كنوز'), document.fonts.load(`700 20px "Baloo Bhaijaan 2"`, 'نور'), document.fonts.ready]) : Promise.resolve();
    await Promise.race([fonts.catch(() => {}), wait]);
  } catch (e) {}
  showScreen('title');
  resize();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
}
boot();
})();
</script>
</body>
