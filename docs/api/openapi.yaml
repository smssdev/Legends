  /leagues/{league}/market:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The market, the pool or the bot clubs, and my players with what the pool pays
      description: |
        Sprint 24. Open from the league's creation until its last quarter (`closed` says why when it is shut). The pool,
        about 300 players from outside the league's clubs renewed in each window, sells at 100% of the value; a bot club
        sells at a fixed 125% and keeps 18 players and 2 keepers; the pool buys back at 70% of the value without training.
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [list, pool, bots], default: list }, description: '[UP11] list is the transfer list of one line: players[] with seller {kind world|bot|coach, club, coach, logo}, price, and star (a star from a parallel league, in the pool from mid-season, listed first); [Sprint 23] special (offer|in_form|legend, an event''s player, listed first of all), was_price (the price before a discount), renews_at (sooner in a transfer madness) and events (TimedEventNow[])' }
        - { name: line, in: query, schema: { type: string, enum: [gk, def, mid, att] } }
        - { name: q, in: query, schema: { type: string }, description: Part of a name }
        - { name: club, in: query, schema: { type: integer }, description: One bot club }
        - { name: max_price, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The market
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Market' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/market/buy:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Buy a player from the pool or a bot club
      description: The same idempotency_key again changes nothing. Two coaches at the same player at once, one gets him.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, idempotency_key], properties: { player_id: { type: integer }, idempotency_key: { type: string, maxLength: 64 }, compensate: { type: boolean, description: '[UP11] Short of cash (half the price at least): all the cash and coins for the rest' } } }
      responses:
        '200':
          description: Bought
          content:
            application/json:
              schema: { type: object, required: [balance], properties: { balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/market/sell:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Sell one of my players now (never below 16 players or 2 keepers)
      description: The instant sale pays his full value (training counted) for 5 coins from the coach's wallet; in a fair league for 10% of his value from the club. To sell without a fee, list him (/transfers/listings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, idempotency_key], properties: { player_id: { type: integer }, idempotency_key: { type: string, maxLength: 64 } } }
      responses:
        '200':
          description: Sold
          content:
            application/json:
              schema: { type: object, required: [balance], properties: { balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
