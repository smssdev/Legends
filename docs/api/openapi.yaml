                max_overall: { type: integer, minimum: 40, maximum: 99 }
                max_age: { type: integer }
                max_value: { type: integer, description: 'The highest price (the player value) [X15]' }
                nationality: { type: string }
                league: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The scout after asking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoutView' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
