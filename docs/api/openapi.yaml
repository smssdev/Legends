                reply: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200': { description: Answered, content: { application/json: { schema: { type: object, required: [suggestion], properties: { suggestion: { $ref: '#/components/schemas/Suggestion' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
