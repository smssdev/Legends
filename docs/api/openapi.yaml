                section: { type: string, enum: [seats, pitch, training] }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The stadium after starting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StadiumView' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/ads/reward:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [team]
      summary: '[Sprint 21 E9] A rewarded video the provider verified cuts 30 minutes off a training slot or the stadium part (5 videos a task)'
      description: |
        The provider is the game's own (Sprint 20 S4): the token is a watch from POST /ads/start, accepted once its seconds
        have passed. 503 while game.ads.enabled is false, 422 for a token not yet watched to its end (or any token with the
        driver none). The provider's reward id is kept unique, so the same token sent twice cuts once.
        A task is never moved before now: cut past its end, it is due and the scheduler finishes it within the minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, token]
              properties:
