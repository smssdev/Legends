      responses:
        '200': { description: The conference after it, content: { application/json: { schema: { type: object, required: [press], properties: { press: { type: object, additionalProperties: true } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/predictions:
    parameters: [{ $ref: '#/components/parameters/League' }]
