        '422': { $ref: '#/components/responses/ValidationError' }
  /matches/{match}/actions:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [matches]
      summary: An order from a side's coach while the match is played
      description: |
        A substitution, tactics, or a formation (the 24 or one of the coach's own, `custom:N`). It goes into the next minute
        not yet made (`target_tick`); one that arrives while a minute is being made goes in the one after. The engine checks
        it there, and a rejected order comes back in that minute's `rejected` for its own coach only. The same
        `idempotency_key` again changes nothing (200, `duplicate`). While the coach's screen is away, his assistant manages.
        [X42] Only in a window: before kick-off, at half-time, in extra time's breaks, or the break after minutes 15, 30, 60
        and 75 (`timing.windows`, `window_seconds`; the minute that opens one carries `window: true`). Between them, 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, idempotency_key]
              properties:
                type: { type: string, enum: [sub, tactics, formation] }
                out: { type: integer, description: The player going off (sub) }
                in: { type: integer, description: The player coming on (sub) }
                tactics: { type: object, additionalProperties: true, description: The tactics that change (the engine's keys) }
                formation: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchOrderResult' }
        '200':
          description: This key was given already
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchOrderResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /matches/{match}/replay:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: A finished match again
      description: Every minute with its frames, from the seed, the starting state and the orders, while the engine is the same version (`replayable`); a match from an older engine gives its stored events instead. Tactics only for your own side.
      responses:
        '200':
          description: The minutes, or the events
          content:
            application/json:
              schema:
                type: object
                required: [replayable, ticks, events]
                properties:
                  replayable: { type: boolean }
                  ticks: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
                  events: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
