  /leagues/{league}/market/quote:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: How long the outside buyer takes for one of my players at a price
      parameters:
        - { name: player_id, in: query, required: true, schema: { type: integer } }
