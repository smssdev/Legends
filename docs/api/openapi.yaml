          type: array
          description: '[Sprint 25] The rating''s tiers in order, with the points each starts at'
          items: { type: object, required: [key, rank, min], properties: { key: { $ref: '#/components/schemas/RatingTierKey' }, rank: { type: integer }, min: { type: integer } } }
        announcements: { type: array, items: { $ref: '#/components/schemas/Message' } }
        slots_open: { type: integer, description: '[Sprint 24 B3] The slots open for the account''s age' }
        next_slot_at: { type: [string, 'null'], format: date-time, description: When the next slot opens (null when all are open) }
        slots:
          type: array
          description: game.league.max_active_teams of them (8), or more for a coach who held more teams before Sprint 24
          items:
            type: object
            required: [slot, state, league, pending, club, position, teams, next_match, opens_at, progress_bp, unlock_coins]
            properties:
              slot: { type: integer }
              pending: { type: integer, description: '[Sprint 20 B2] What waits for the coach in this club (as the club board counts it)' }
              state: { type: string, enum: [club, waiting, free, locked], description: 'A club, a join request waiting for its answer, free, or locked until the account is old enough [Sprint 24 B3]' }
              opens_at: { type: [string, 'null'], format: date-time, description: When a locked slot opens (for the countdown) }
              progress_bp: { type: [integer, 'null'], description: 'A locked slot''s wait so far, from the account''s first day, out of 10000' }
              unlock_coins: { type: [integer, 'null'], description: 'The first locked slot''s price to open it now (with any locked before it); null on the others' }
              league: { type: object, nullable: true, required: [id, name, status], properties: { id: { type: integer }, name: { type: string }, status: { type: string } } }
              club: { type: object, nullable: true, required: [id, name, crest_url, cash], properties: { id: { type: integer }, name: { type: string }, crest_url: { type: string }, cash: { type: integer, description: 'The club''s money [UP7]' } } }
              position: { type: integer, nullable: true }
              teams: { type: integer, nullable: true }
              next_match: { type: object, nullable: true, required: [opponent, venue, live, scheduled_at], properties: { opponent: { type: string, nullable: true }, venue: { type: string, enum: [home, away] }, live: { type: boolean }, scheduled_at: { type: string, format: date-time } } }
    CoachProfile:
      type: object
      required: [coach, record, titles, objectives]
      properties:
        coach: { type: object, required: [id, name], properties: { id: { type: integer }, account_no: { type: integer }, name: { type: string }, official: { type: boolean, description: 'A developer account [X11]' }, verified: { type: boolean, description: '[Sprint 21 E2.5] A verified account' } } }
        record:
          type: object
          required: [seasons, played, won, drawn, lost]
          properties:
            seasons: { type: integer }
            played: { type: integer }
            won: { type: integer }
            drawn: { type: integer }
            lost: { type: integer }
        titles:
          type: array
          items:
            type: object
            required: [league, season, competition, position, club]
            properties:
              league: { type: string }
              season: { type: integer }
              competition: { type: string, enum: [league, cup, alliance] }
              position: { type: integer }
              club: { type: string }
        objectives:
          type: object
          required: [met, total, list]
          properties:
            met: { type: integer }
            total: { type: integer }
            list:
              type: array
              items:
                type: object
                required: [league, season, club, competition, target, kind, result, achieved]
                properties:
                  league: { type: string }
                  season: { type: integer }
                  club: { type: string }
                  competition: { type: string, enum: [league, cup, alliance] }
                  target: { type: string }
                  kind: { type: string }
                  result: { type: string, nullable: true }
                  achieved: { type: boolean }
    LeagueClub:
      type: object
      required: [id, name, code, colors, crest_url, strength_cp, bot, balance, squad_value, players_count]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        colors: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        crest_url: { type: string }
        strength_cp: { type: integer, description: At the league's making, in hundredths }
        coach: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string }, official: { type: boolean }, verified: { type: boolean } } }
        bot: { type: boolean, description: No coach; a bot runs it and it can be taken }
        balance: { type: integer, description: Club money }
        squad_value: { type: integer }
        players_count: { type: integer }
        objectives:
          type: object
          nullable: true
          description: This season's objectives (Sprint 33), shown when a coach picks a team
          required: [league, cup]
          properties:
            league:
              type: object
              required: [target, kind]
              properties:
                target: { type: integer, description: The place to finish in or above }
                kind: { type: string, enum: [title, top, mid, survive] }
            cup:
              type: object
              required: [target]
              properties:
                target: { type: string, enum: [r16, qf, sf, final], description: The stage to reach }
    LeaguePlayer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        nationality: { type: string, nullable: true }
        overall: { type: integer }
        potential: { type: integer }
        value: { type: integer }
        fitness: { type: integer }
        injured_matches: { type: integer }
        suspended_matches: { type: integer }
    DataClub:
      type: object
      required: [id, name, code, league, strength_cp, colors, crest_url]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string, description: Three letters }
        league: { type: string }
        strength_cp: { type: integer, description: The average of the best 18, in hundredths }
        colors: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        crest_url: { type: string }
        logo: { type: string, nullable: true, description: '[UP3] The real logo (/logos/...), null for a club the pack has not; crest_url sends it too' }
    DataPlayer:
      type: object
      required: [id, name, position, line, age, overall, potential, value, attributes]
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string, example: CM }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        nationality: { type: string, nullable: true }
        foot: { type: string, nullable: true }
        overall: { type: integer }
        potential: { type: integer, description: The most training can raise his rating }
        value: { type: integer, description: Club money }
        attributes:
          type: object
          description: pac, sho, pas, dri, def, phy for outfield players; diving, handling, kicking, positioning, reflexes for keepers
          additionalProperties: { type: integer, nullable: true }
    AdminUser:
      type: object
      required: [id, account_no, name, username, email, role, official, verified, suspended, joined, last_day, matches_watched]
      properties:
        id: { type: integer }
        account_no: { type: integer, nullable: true }
        name: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        role: { type: string }
        official: { type: boolean }
        verified: { type: boolean }
        suspended: { type: object, nullable: true, required: [at, reason], properties: { at: { type: string, format: date-time }, reason: { type: string, nullable: true } } }
        joined: { type: string, format: date-time }
        last_day: { type: string, nullable: true }
        matches_watched: { type: integer }
    SupportMessage:
      type: object
      required: [id, body, from_team, sender, read, at]
      properties:
        id: { type: integer }
        body: { type: string }
        from_team: { type: boolean, description: Written by a developer }
        sender: { type: object, nullable: true, required: [name, username, official], properties: { name: { type: string }, username: { type: string }, official: { type: boolean } } }
        read: { type: boolean }
        at: { type: string, format: date-time }
    AdminThread:
      type: object
      required: [user, messages]
      properties:
        user: { type: object, required: [id, name, username, account_no], properties: { id: { type: integer }, name: { type: string }, username: { type: string }, account_no: { type: integer, nullable: true } } }
        messages: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }
    Account:
      type: object
      required: [id, account_no, name, username, official, avatar_url, email, email_verified, verification, referral, role, has_password, google, vacation, inactivity_days, viewing]
      properties:
        id: { type: integer }
        account_no: { type: integer, description: '[Sprint 21 E2.1] The account''s own five-digit number, shown and searched' }
        suspended: { type: object, nullable: true, required: [reason], description: '[Sprint 21 E7.3] Suspended by the developers', properties: { reason: { type: string, nullable: true } } }
        name: { type: string }
        username: { type: string, description: 'English letters only, lower case' }
        official: { type: boolean, description: 'A developer account (Owner-Sizar, Owner-Sliman), shown with the official badge [X11]' }
        avatar_url: { type: string, nullable: true, description: 'The picture (GET /users/{id}/avatar, or Google''s [UP5]), null without one' }
        email: { type: string, format: email, nullable: true, description: 'Null for an account made without one [UP5]' }
        email_verified: { type: boolean }
        verification:
          type: object
          required: [verified, welcome_coins, code_minutes]
          description: '[UP6, Sprint 21 E2.4] Verified by a code sent to the email; until then the welcome coins wait'
          properties:
            verified: { type: boolean }
            welcome_coins: { type: integer }
            code_minutes: { type: integer, description: How long a code lasts }
        referral:
          type: object
          required: [link, coins, paid, max, waiting]
          description: '[Sprint 21 E2.3] The invite link: coins for each friend who signs up from it and verifies, up to max'
          properties:
            link: { type: string }
            coins: { type: integer }
            paid: { type: integer, description: Gifts so far }
            max: { type: integer }
            waiting: { type: integer, description: Friends signed up and not verified yet }
        role: { type: string, enum: [user, admin] }
        has_password: { type: boolean, description: False for an account made with Google only }
        google: { type: boolean, description: Linked to a Google account }
        created_at: { type: string, format: date-time }
        locale: { type: string, enum: [ar, en], nullable: true, description: 'The coach''s language [UP2]; null until chosen' }
        vacation:
          type: object
          required: [on, until, next_from, max_days, auto_days, pending]
          description: The account's holiday (every league)
          properties:
            on: { type: boolean }
            until: { type: string, format: date-time, nullable: true }
            next_from: { type: string, format: date-time, nullable: true, description: When a new one may start }
            max_days: { type: integer }
            auto_days: { type: integer, description: '[UP13] Up to this many days start at once' }
            pending: { type: integer, nullable: true, description: '[UP13] The days of a long holiday waiting for the developers' }
        inactivity_days: { type: integer, description: '[UP13] An account unused this many days in a row (no holiday) is deleted' }
        viewing:
          type: object
          required: [commentator, match_view, unity_ready, coach_look]
          description: How the coach watches his matches, the same on every device [X9, X10]
          properties:
            commentator: { type: string, enum: [base, voice-1, voice-2, voice-3, voice-4, voice-5, voice-6, voice-7], description: 'The Arabic voice; voice-6 is the default, voice-7 the real Chawali (X41)' }
            match_view: { type: string, enum: [cartoon, unity], description: 'The simulator: the cartoon one (2D) or the advanced one (Unity)' }
            unity_ready: { type: boolean, description: 'The Unity web build is deployed; until then the cartoon one plays' }
            coach_look: { type: string, enum: [C1, C2, C3], description: '[Sprint 26] The coach on the touchline: C1 in a suit, C2 in a tracksuit, C3 in a hijab' }
    Error:
      type: object
      required: [message, code]
      description: Every API error has this shape (app/Http/Errors/ApiErrors.php).
      properties:
        message: { type: string, description: In Arabic, ready to show, example: غير موجود. }
        code:
          type: string
          description: For the code to act on, never shown
          enum: [bad_request, unauthenticated, forbidden, not_found, method_not_allowed, conflict, gone, too_large, session_expired, validation, update_required, too_many_requests, server_error, unavailable]
        errors:
          type: object
          description: Only when code is validation; each field's messages in Arabic
          additionalProperties: { type: array, items: { type: string } }
    Room:
      type: object
      properties:
        id: { type: string }
        host: { type: object, properties: { name: { type: string }, club: { type: object } } }
        guest: { type: object, nullable: true, properties: { name: { type: string }, club: { type: object } } }
        match_id: { type: string, nullable: true, description: Set once the friend joins; the host manages home, the guest away }
        seat: { type: string, description: 'Only in the answer to POST /sim/rooms (the home seat) and to /join (the away seat): keep it on the device and send it as X-Seat' }
    Reaction:
      type: object
      properties:
        id: { type: integer }
        side: { type: string, enum: [home, away] }
        key: { type: string }
        at: { type: integer, description: Server clock in ms }
    ClubSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        league_name: { type: string }
        strength_cp: { type: integer, description: Average of the best 18 in hundredths }
        color_primary: { type: string }
        color_secondary: { type: string }
    Tactics:
      type: object
      properties:
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        tackling: { type: integer, minimum: 0, maximum: 3 }
        pressing: { type: integer, minimum: 0, maximum: 100 }
        style: { type: integer, minimum: 0, maximum: 100 }
        tempo: { type: integer, minimum: 0, maximum: 100 }
        att: { type: string, enum: [back, support, only] }
        mid: { type: string, enum: [def, stay, push] }
        def: { type: string, enum: [stay, fullbacks, mid] }
        trap: { type: integer, enum: [0, 1] }
        marking: { type: string, enum: [zone, man] }
    BroadcastReaction:
      type: object
      required: [id, side, key, target, who, at]
      properties:
        id: { type: integer }
        side: { type: string, nullable: true, enum: [home, away, null], description: The coach's side, or null for a league member who watches }
        key: { type: string }
        target: { type: string, nullable: true, enum: [home, away, null] }
        who: { type: string }
        at: { type: integer }
    BroadcastChat:
      type: object
      required: [id, side, who, body, user_id, at]
      properties:
        id: { type: integer }
        side: { type: string, nullable: true, enum: [home, away, null] }
        who: { type: string }
        body: { type: string }
        user_id: { type: integer }
        at: { type: integer }
    AllianceSide:
      type: object
      required: [captain, clubs]
      properties:
        captain: { type: string, nullable: true }
        clubs: { type: array, items: { type: object, additionalProperties: true } }
    Scenario:
      type: object
      description: 'A pre-match scenario [X23]: carried out once by the server at its moment, watching or not. Never sent to the rival.'
      required: [kind]
      properties:
        kind: { type: string, enum: [trailing, red_card, leading] }
        minute: { type: integer, nullable: true, description: 'From this minute (trailing 46..85, leading 60..88); none for red_card' }
        tactics:
          type: object
          properties: { pressing: { type: integer }, tempo: { type: integer }, style: { type: integer } }
        sub:
          type: object
          nullable: true
          required: [out, in]
          properties: { out: { type: integer }, in: { type: integer } }
    TeamSetup:
      type: object
      properties:
        formation: { type: string, enum: ['4-2-3-1', '4-3-3', '4-4-2', '4-1-4-1', '3-5-2', '5-3-2'] }
        tactics: { $ref: '#/components/schemas/Tactics' }
    MatchView:
      type: object
      properties:
        id: { type: string }
        seed: { type: integer }
        competition: { type: string }
        referee: { type: integer }
        venue: { type: string }
        control: { type: object }
        mode: { type: string, enum: [solo, live] }
        you: { type: [string, 'null'], enum: [home, away, null], description: 'Live: the side the request''s seat manages; null for a viewer. In a live match the other side''s tactics are null' }
        seats: { type: object, description: 'Only in the answer to a live POST /sim/matches: {home, away} seats; the maker keeps home and sends away to the friend' }
        started: { type: boolean, description: Always true for solo matches }
        tick: { type: integer }
        finished: { type: boolean }
        score: { type: object }
        formations: { type: array, items: { type: string } }
        timing: { type: object }
        clubs: { type: object }
        coaches: { type: object, description: "The coaches' names in a match between friends: {home, away}" }
        coach_looks: { type: object, description: "[Sprint 26] Each human coach's look on the touchline (C1 to C3): {home?, away?}" }
        teams: { type: object }
        slots: { type: object }
    LiveSync:
      type: object
      properties:
        started: { type: boolean }
        finished: { type: boolean }
        tick: { type: integer, description: The minute playing now (minutes made ahead of time do not count yet) }
        server_now: { type: integer, description: Server clock in ms }
        next_at: { type: [integer, 'null'], description: When the next minute is due (ms), null before the start or after the end }
        gap: { type: boolean, description: Some minutes after `since` are no longer kept; jump to the latest }
        ticks: { type: array, items: { type: object }, description: 'Each minute carries at: when it starts on the server clock (ms). It is made game.match.live_lead_ms early, so both screens play it at that instant' }
        reactions: { type: array, items: { $ref: '#/components/schemas/Reaction' }, description: The last few seconds of reactions }
