    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: player, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [market]
      summary: Take my player off the list
      responses:
        '200': { description: The market between coaches, content: { application/json: { schema: { $ref: '#/components/schemas/Transfers' } } } }
  /leagues/{league}/transfers/offers:
