        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /matches/{match}/report:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: Why you won or lost, for a coach of either side
      description: |
        Built when the match ends, from the public events and your own side only: it never reads the other side's hidden
        tactics. The top reasons with their numbers, one thing to improve, the assistant's verdict, the man of the match,
        the ratings, the stats, the thirds and the momentum, the timeline, and the readings he gave you during the match.
