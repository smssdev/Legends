      responses:
        '201':
          description: The offer
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/accept:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: 'Accept (the other coach): everything moves now, or nothing'
      responses:
        '200':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
