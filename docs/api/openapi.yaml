                  side: { type: string, enum: [home, away] }
                  shots:
                    type: array
                    description: '[X62 E10] The shot map: each shot on a 100 x 100 half pitch, x towards the goal'
                    items: { type: object, required: [team, minute, result, quality, x, y], properties: { team: { type: string, enum: [home, away] }, minute: { type: integer }, result: { type: string, enum: [goal, saved, blocked, missed] }, quality: { type: string }, shooter: { type: integer, nullable: true }, x: { type: integer }, y: { type: integer } } }
                  result: { type: string, enum: [win, draw, loss] }
                  score: { type: object, additionalProperties: { type: integer } }
                  shootout: { type: object, nullable: true, additionalProperties: { type: integer } }
                  reasons: { type: array, items: { type: object, additionalProperties: true } }
                  improve: { type: object, nullable: true, additionalProperties: true }
                  verdict: { type: array, items: { type: object, additionalProperties: true } }
                  man_of_the_match: { type: object, nullable: true, additionalProperties: true }
                  ratings: { type: object, additionalProperties: true }
                  stats: { type: object, additionalProperties: true }
                  thirds: { type: array, items: { type: integer } }
                  momentum: { type: array, items: { type: integer } }
                  timeline: { type: array, items: { type: object, additionalProperties: true } }
                  readings: { type: array, items: { $ref: '#/components/schemas/MatchReading' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
