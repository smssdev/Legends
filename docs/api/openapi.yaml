        '404': { $ref: '#/components/responses/Error' }
  /matches/{match}/live:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: The minutes made after `since`, with their frames
      description: |
        The server keeps the clock (each minute carries `at`, its start in server ms); minutes are announced on the private
        channel `match.{id}` (event `minute`) and fetched here. No hidden tactics of either side, except your own. Every
        event carries its Arabic commentary line in `text` (the same for everyone). After a gap (the last 20 minutes are
        kept whole), `missed` gives the events of the minutes in between, at most `game.live.missed_max_minutes` of
        them (the latest), and `summary` the whole gap: one path for a hidden tab, a lost connection and joining late,
        which jump to now [Sprint 21 E8.5, E8.6]. Each live minute (here and on the channel, L1 [E8.3]) carries
        `match_time`, its start on the match's own clock in ms ((tick - 1) × 60000, so it only grows), and `server_ts`,
        when the server made it. `readings` is the assistant's notes to you, the coach (also sent on `club.{id}`,
        event `reading`); other members get none. Members only (404 for anyone else), rate limited. Under load the
        server gives up, in order, the summary, the voice, then the pace (`poll_ms`) [E8.7].
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Like the simulator's live sync, with the missed minutes and your readings
          content:
            application/json:
              schema:
                type: object
                required: [started, finished, tick, server_now, next_at, gap, missed, ticks, readings]
                properties:
                  started: { type: boolean }
                  finished: { type: boolean }
                  tick: { type: integer }
                  server_now: { type: integer }
                  next_at: { type: integer, nullable: true }
                  gap: { type: boolean }
                  missed:
                    type: array
                    items:
                      type: object
                      required: [tick, minute, events]
                      properties:
                        tick: { type: integer }
                        minute: { type: integer, description: The minute as shown (45+2 is 47) }
                        events: { type: array, items: { type: object, additionalProperties: true } }
                  summary:
                    type: object
                    nullable: true
                    description: '[E8.5] After a gap: the minutes missed and their goals and red cards (null without a gap)'
                    required: [from_tick, to_tick, minutes, goals, reds]
                    properties:
                      from_tick: { type: integer }
                      to_tick: { type: integer }
                      minutes: { type: integer }
                      goals:
                        type: array
                        items: { type: object, required: [minute, team, scorer], properties: { minute: { type: integer }, team: { type: string, enum: [home, away] }, scorer: { type: integer, nullable: true } } }
                      reds:
                        type: array
                        items: { type: object, required: [minute, team, player], properties: { minute: { type: integer }, team: { type: string, enum: [home, away] }, player: { type: integer, nullable: true } } }
                  ticks: { type: array, items: { type: object, additionalProperties: true }, description: 'Each with at, match_time and server_ts [E8.3]' }
                  poll_ms: { type: integer, nullable: true, description: '[E8.7] Under load (degradation level 3): poll no more often than this (ms). Null otherwise' }
                  readings: { type: array, items: { $ref: '#/components/schemas/MatchReading' } }
                  reactions: { type: array, items: { $ref: '#/components/schemas/BroadcastReaction' }, description: 'The latest reactions [X24]' }
                  pause:
                    type: object
                    nullable: true
                    description: '[UP17] The break under way: its end (ms), the coaches ready, whether it is a window, and each side''s injured player waiting for his replacement'
                    properties:
                      until: { type: integer }
