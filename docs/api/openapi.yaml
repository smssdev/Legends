                            form: { type: array, items: { type: string, enum: [W, D, L] }, description: '[Sprint 20 S1] The last five results, newest first' },
                            formation: { type: string, description: '[Sprint 20 S1] My formation now (the locked one after the lock)' } }
                      opponent:
                        type: object
                        required: [id, name, code, strength_cp, crest_url]
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          code: { type: string }
                          strength_cp: { type: integer }
                          crest_url: { type: string }
                          coach: { type: string, nullable: true }
                          form: { type: array, items: { type: string, enum: [W, D, L] }, description: '[Sprint 20 S1] The last five results, newest first (public)' }
                          sheet:
                            type: object
                            nullable: true
