              schema: { $ref: '#/components/schemas/NotificationSettings' }
    put:
      tags: [notifications]
      summary: Turn kinds on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kinds]
              properties:
                kinds: { type: object, additionalProperties: { type: boolean }, description: 'referee, match_soon, offers, done, absence, news' }
      responses:
        '200':
          description: The settings after
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '422': { $ref: '#/components/responses/Error' }
  /notifications/subscriptions:
    post:
      tags: [notifications]
      summary: This browser gets the notifications (its PushSubscription)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }
      responses:
        '200':
          description: The settings after
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
    delete:
      tags: [notifications]
      summary: This browser stops getting them
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } }
      responses:
        '200':
          description: The settings after
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
  /wallet:
    get:
      tags: [wallet]
      summary: The coins wallet, today's reward, the spending per league against the cap, the movements and the shop
      description: Sprint 34 (docs/features/premium.md). Coins are earned in the game only and never become club money.
      responses:
        '200':
          description: The wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletView' }
  /wallet/daily:
    post:
      tags: [wallet]
      summary: Take today's reward (once a Cairo day)
      responses:
        '200':
          description: The wallet after
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletView' }
  /leagues/{league}/training/{line}/finish:
    parameters:
      - { name: league, in: path, required: true, schema: { type: integer } }
      - { name: line, in: path, required: true, schema: { type: string, enum: [gk, def, mid, att] } }
    post:
      tags: [team]
      summary: Finish the slot's next training session now, for coins
      description: Sprint 34 (docs/features/premium.md). Coins from the wallet, not in a fair league, within the season cap.
      responses:
        '200': { description: Done }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/scout/finish:
    parameters:
      - { name: league, in: path, required: true, schema: { type: integer } }
    post:
      tags: [team]
      summary: Finish the scout's search now, for coins
      description: Sprint 34 (docs/features/premium.md). Coins from the wallet, not in a fair league, within the season cap.
      responses:
        '200': { description: Done }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/stadium/finish:
    parameters:
      - { name: league, in: path, required: true, schema: { type: integer } }
    post:
      tags: [team]
      summary: Finish the stadium part being built now, for coins
      description: Sprint 34 (docs/features/premium.md). Coins from the wallet, not in a fair league, within the season cap.
      responses:
        '200': { description: Done }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/awards:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: '[X61 E5] The running season''s awards: best player, best young player, player of the last round, top scorer and assister, longest winning run'
      responses:
        '200':
          description: The awards (null where nobody qualifies yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Awards' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/honours:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The hall of fame, every season with its league podium and cup final
      description: Sprint 33 (PLAN 2.11). For the league's members. Kept across seasons.
      responses:
        '200':
          description: The hall of fame
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Honours' }
        '403': { $ref: '#/components/responses/Error' }
  /home:
    get:
      tags: [leagues]
      summary: The coach's home screen [X18]
      description: The profile card with the level, the eight club slots (locked ones with their countdown and price, Sprint 24), the trophies, the coaches met, and the latest announcements.
      responses:
        '200':
          description: The home screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeScreen' }
        '401': { $ref: '#/components/responses/Error' }
  /rankings/coaches:
    get:
      tags: [leagues]
      summary: The coaches' global ranking, top 50 and the coach's own place [X18]; by the rating's points [Sprint 25]
      parameters:
        - { name: by, in: query, required: false, schema: { type: string, enum: [trophies, level, rating] } }
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                type: object
                required: [by, coaches, me]
                properties:
                  by: { type: string, enum: [trophies, level, rating] }
                  coaches: { type: array, items: { $ref: '#/components/schemas/RankedCoach' } }
                  me: { allOf: [{ $ref: '#/components/schemas/RankedCoach' }], nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }
  /coaches/{user}:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [leagues]
      summary: A coach's profile, his titles, objectives met and record
      description: Sprint 33. From his memberships, the titles and the judged objectives, in every league.
      responses:
        '200':
          description: The coach
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachProfile' }
  /leagues/{league}/clubs:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: Every club of the league
      description: For the owner and approved coaches. Clubs with a coach show as taken (bot false).
      responses:
        '200':
          description: The clubs, strongest first
          content:
            application/json:
              schema:
                type: object
                required: [clubs]
                properties:
                  clubs: { type: array, items: { $ref: '#/components/schemas/LeagueClub' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/clubs/{club}:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/Club' }]
    get:
      tags: [leagues]
      summary: One club with its squad
      responses:
        '200':
          description: The club and its players
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LeagueClub'
                  - type: object
                    required: [players]
                    properties:
                      players: { type: array, items: { $ref: '#/components/schemas/LeaguePlayer' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/clubs/{club}/claim:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/Club' }]
    post:
      tags: [leagues]
      summary: Take a club no coach has
      description: |
        One conditional update: of many coaches at once exactly one gets it, the others get 409 "الفريق أُخذ" and
        go back to the list. Its money is brought between 500,000 and the starting budget.
      responses:
        '201':
          description: The club is mine
          content:
            application/json:
              schema:
                type: object
                properties:
                  club: { $ref: '#/components/schemas/LeagueClub' }
                  joined_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /messages:
    get:
      tags: [messages]
      summary: The account's messages, newest first
      description: |
        What the game tells the coach (Sprint 22): the referee before his match, the absence warning, leaving for absence,
        a kick and its reason, a join request (to the owner) and its answer, a match report ready. The words (title, body)
        and where it leads (link, a web path) are made on the server, so the app shows the same. A new message also
        arrives on the private channel `App.Models.User.{id}` (event `message`, with `unread`), and reads made on another
        screen on the same channel (event `messages-read`, with `ids` and `unread`).
      parameters:
        - { name: before, in: query, schema: { type: integer }, description: Messages older than this id (the next page) }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 50 } }
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, more, unread]
                properties:
                  messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  more: { type: boolean }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
  /messages/unread:
    get:
      tags: [messages]
      summary: How many messages are unread (the badge)
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema: { type: object, required: [unread], properties: { unread: { type: integer } } }
  /messages/{message}/read:
    parameters: [{ name: message, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [messages]
      summary: Mark one message read (on every screen of the account)
      responses:
        '200':
          description: Read
          content:
            application/json:
              schema: { type: object, required: [unread], properties: { unread: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
  /messages/read-all:
    post:
      tags: [messages]
      summary: Mark every message read
      responses:
        '200':
          description: Read
          content:
            application/json:
              schema: { type: object, required: [read, unread], properties: { read: { type: integer }, unread: { type: integer } } }
  /sim/leagues:
    get:
      tags: [simulator]
      summary: Leagues with club counts
      responses:
        '200':
          description: Leagues ordered by their strongest club
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    clubs: { type: integer }
                    top: { type: integer, description: Strongest club strength in hundredths }
  /sim/clubs:
    get:
      tags: [simulator]
      summary: Search clubs
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: league, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Up to 60 clubs, strongest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubSummary' }
  /sim/clubs/{club}:
    get:
      tags: [simulator]
      summary: A club's squad with the automatic best eleven
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Squad, formation, starters and bench
          content:
            application/json:
              schema:
                type: object
                properties:
                  club: { type: object }
                  formation: { type: string }
                  starters: { type: array, items: { type: integer } }
                  bench: { type: array, items: { type: integer } }
                  players: { type: array, items: { type: object } }
  /sim/matches:
    post:
      tags: [simulator]
      summary: Create a simulator match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [home_id, away_id]
              properties:
                home_id: { type: integer }
                away_id: { type: integer }
                seed: { type: integer, minimum: 1 }
                competition: { type: string, enum: [league, cup, alliance] }
                referee: { type: integer, enum: [0, 1, 2], description: 0 soft, 1 medium, 2 strict }
                venue: { type: string, enum: [home, neutral] }
                mode: { type: string, enum: [solo, live], description: 'solo: the client drives the clock. live: two devices, the server keeps the clock and both coaches are "me".' }
                control:
                  type: object
                  properties:
                    home: { type: string, enum: [me, cpu] }
                    away: { type: string, enum: [me, cpu] }
                home: { $ref: '#/components/schemas/TeamSetup' }
                away: { $ref: '#/components/schemas/TeamSetup' }
      responses:
        '201':
          description: The match as the screen needs it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchView' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/matches/{match}:
    get:
      tags: [simulator]
      summary: Current match view
      parameters: [{ $ref: '#/components/parameters/Match' }]
      responses:
        '200':
          description: Match view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchView' }
  /sim/matches/{match}/actions:
    post:
      tags: [simulator]
      summary: Queue a coach order for the next minute. In a live match only the seat of that team may order (403 otherwise)
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, team, idempotency_key]
              properties:
                type: { type: string, enum: [sub, tactics, formation] }
                team: { type: string, enum: [home, away] }
                out: { type: integer, description: Player leaving (sub) }
                in: { type: integer, description: Player coming on (sub) }
                tactics: { $ref: '#/components/schemas/Tactics' }
                formation: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_tick: { type: integer }
                  duplicate: { type: boolean }
        '200': { description: Same idempotency key seen before; nothing queued }
        '409': { description: 'The match has finished, or (live) it is playing between two of the coach''s windows [X42]' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/matches/{match}/ticks:
    post:
      tags: [simulator]
      summary: Simulate the next minute(s)
      parameters: [{ $ref: '#/components/parameters/Match' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 200, default: 1 }
      responses:
        '409': { description: Live match; the server keeps the clock }
        '200':
          description: One entry per simulated minute (docs/api/match-events.md)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticks: { type: array, items: { type: object } }
  /sim/matches/{match}/start:
    post:
      tags: [simulator]
      summary: Start a live match (kick-off 30 s later, game.match.kickoff_ms); either coach's seat, 403 without one
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      responses:
        '200':
          description: Same body as /live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSync' }
        '409': { description: Not a live match }
  /sim/matches/{match}/live:
    get:
      tags: [simulator]
      summary: Live match poll. Simulates the minutes due by the server clock, returns those after `since`
      parameters:
        - { $ref: '#/components/parameters/Match' }
        - { name: since, in: query, schema: { type: integer, minimum: 0 }, description: Last minute this screen has shown }
        - { $ref: '#/components/parameters/Seat' }
      responses:
        '200':
          description: New minutes with their frames (the last 20 are kept). The other side's tactics are null and its orders carry no tactics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSync' }
        '409': { description: Not a live match }
  /sim/matches/{match}/reactions:
    post:
      tags: [simulator]
      summary: A coach's reaction in a live match (an emoji or a short word); both screens get it on their next /live
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, enum: [fire, clap, wow, laugh, angry, pray, unlucky, coming, easy, focus] }
      responses:
        '201': { description: The reaction, content: { application/json: { schema: { $ref: '#/components/schemas/Reaction' } } } }
        '403': { description: No seat }
        '409': { description: Not a live match }
        '422': { description: Unknown key, or too soon after this coach's last one (game.match.reaction_gap_ms) }
  /sim/matches/{match}/report:
    get:
      tags: [simulator]
      summary: Post-match report from one side's view
      parameters:
        - { $ref: '#/components/parameters/Match' }
        - { name: side, in: query, schema: { type: string, enum: [home, away] } }
      responses:
        '200': { description: Reasons, verdict, man of the match, ratings, stats, thirds, momentum, timeline }
        '409': { description: The match has not finished }
  /sim/rooms:
    post:
      tags: [simulator]
      summary: Open a room for a match between two friends (the host picks a name and a club)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, club_id]
              properties:
                name: { type: string, minLength: 2, maxLength: 24 }
                club_id: { type: integer }
      responses:
        '201': { description: The room, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/rooms/{room}:
    get:
      tags: [simulator]
      summary: Room status; the host polls it until match_id appears
      parameters: [{ $ref: '#/components/parameters/Room' }]
      responses:
        '200': { description: The room, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
  /sim/rooms/{room}/join:
    post:
      tags: [simulator]
      summary: The friend joins with a name and another club; the live match is made and kicks off 30 s later (game.match.kickoff_ms)
      parameters: [{ $ref: '#/components/parameters/Room' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, club_id]
              properties:
                name: { type: string, minLength: 2, maxLength: 24 }
                club_id: { type: integer, description: Not the host's club }
      responses:
        '200': { description: The room with match_id (the guest manages away), content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '422': { description: Same club as the host, or someone already joined, content: { application/json: { schema: { type: object } } } }
  /tournaments:
    get:
      tags: [tournaments]
      summary: The tournaments on the game, those waiting for their draw first
      responses:
        '200':
          description: The tournaments
          content: { application/json: { schema: { type: object, required: [tournaments], properties: { tournaments: { type: array, items: { $ref: '#/components/schemas/Tournament' } } } } } }
    post:
      tags: [tournaments]
      summary: Make a tournament of clubs and national teams (2 to 32), its shape and optionally a live draw's time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, teams, format, starts_at]
              properties:
                name: { type: string, nullable: true }
                template: { type: string, enum: [world_cup, club_world_cup, afcon, euro, asian_cup, custom] }
                teams: { type: array, items: { type: integer }, description: Master club ids, clubs and national teams together }
                format: { type: string, enum: [league, groups, knockout] }
                group_count: { type: integer, nullable: true, enum: [1, 2, 4, 8, null] }
                advance_per_group: { type: integer, nullable: true, enum: [1, 2, null] }
                legs: { type: integer, nullable: true, enum: [1, 2, null] }
                rounds_per_day: { type: integer }
                round_times: { type: array, items: { type: string } }
                prep_days: { type: integer }
                starts_at: { type: string, format: date-time }
                draw_at: { type: string, format: date-time, nullable: true }
                starting_budget: { type: integer }
                club_id: { type: integer, nullable: true, description: The maker's own team (a master club id of the tournament), or none }
                timezone: { type: string, nullable: true }
                is_dev: { type: boolean }
      responses:
        '201':
          description: The tournament
          content: { application/json: { schema: { type: object, required: [tournament], properties: { tournament: { $ref: '#/components/schemas/Tournament' } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tournaments/catalog:
    get:
      tags: [tournaments]
      summary: What a tournament is made from - the templates with their suggested teams, the national teams, the countries not playable yet
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [templates, nations, missing, limits]
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      required: [key, pool, confederation, format, group_count, advance_per_group, legs, teams]
                      properties:
                        key: { type: string }
                        pool: { type: string, enum: [nations, clubs, any] }
                        confederation: { type: string, nullable: true }
                        format: { type: string }
                        group_count: { type: integer }
                        advance_per_group: { type: integer }
                        legs: { type: integer }
                        teams: { type: array, items: { type: integer } }
                  nations: { type: array, items: { $ref: '#/components/schemas/TeamCard' } }
                  missing: { type: array, items: { type: object, required: [name, players, keepers], properties: { name: { type: string }, players: { type: integer }, keepers: { type: integer } } } }
                  limits:
                    type: object
                    required: [min_teams, max_teams, group_counts, advance, coins_per_team]
                    properties:
                      min_teams: { type: integer }
                      max_teams: { type: integer }
                      group_counts: { type: array, items: { type: integer } }
                      advance: { type: array, items: { type: integer } }
                      coins_per_team: { type: integer, description: '[X65] The tournament''s price: this many coins for each team' }
  /tournaments/clubs:
    get:
      tags: [tournaments]
      summary: Clubs to add to a tournament, by name, by league or by ids
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: league, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated master club ids }
      responses:
        '200':
          description: The clubs
          content: { application/json: { schema: { type: object, required: [clubs], properties: { clubs: { type: array, items: { $ref: '#/components/schemas/TeamCard' } } } } } }
  /tournaments/{league}:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [tournaments]
      summary: The tournament's page - its teams, the groups' tables (after the draw), the league table and the bracket
      responses:
        '200':
          description: The tournament
          content:
            application/json:
              schema:
                type: object
                required: [tournament]
                properties:
                  tournament:
                    allOf:
                      - { $ref: '#/components/schemas/Tournament' }
                      - type: object
                        required: [teams, groups, table, bracket]
                        properties:
                          teams: { type: array, items: { type: object, additionalProperties: true } }
                          groups:
                            type: array
                            items: { type: object, required: [group, rows], properties: { group: { type: string }, rows: { type: array, items: { $ref: '#/components/schemas/TournamentRow' } } } }
                          table: { type: array, items: { $ref: '#/components/schemas/TournamentRow' } }
                          bracket:
                            type: array
                            items:
                              type: object
                              required: [stage, ties]
                              properties:
                                stage: { type: string }
                                ties:
                                  type: array
                                  items:
                                    type: object
                                    required: [slot, home, away, home_from, away_from, winner_id, score, at, fixture_id]
                                    properties:
                                      slot: { type: integer }
                                      home: { type: object, nullable: true, additionalProperties: true }
                                      away: { type: object, nullable: true, additionalProperties: true }
                                      home_from: { type: string, nullable: true }
                                      away_from: { type: string, nullable: true }
                                      winner_id: { type: integer, nullable: true }
                                      score: { type: array, nullable: true, items: { type: integer } }
                                      at: { type: string, format: date-time }
                                      fixture_id: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
  /tournaments/{league}/draw:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [tournaments]
      summary: 'The draw, for anyone signed in: its time and hash before; every ball in order after, replayed on the shared clock'
      description: One ball every `reveal_ms` from `drawn_at`, the same for every screen; a late viewer replays it from the first ball. The owner sets its time with PUT /leagues/{league}/draw.
      responses:
        '200':
          description: The draw
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Tournament' }
                  - type: object
                    required: [commit, seed, reveal_ms, server_now, is_owner, can_schedule, pots, stages, steps]
                    properties:
                      commit: { type: string, nullable: true }
                      seed: { type: integer, nullable: true }
                      reveal_ms: { type: integer }
                      server_now: { type: integer }
                      is_owner: { type: boolean }
                      can_schedule: { type: boolean }
                      pots: { type: integer }
                      stages: { type: array, items: { type: string } }
                      steps:
                        type: array
                        items:
                          type: object
                          required: [type, club]
                          properties:
                            type: { type: string, enum: [group, slot, tie] }
                            club: { type: object, nullable: true, additionalProperties: true }
                            pot: { type: integer }
                            group: { type: integer }
                            position: { type: integer }
                            slot: { type: integer }
                            stage: { type: string }
                            side: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /groups:
    get:
      tags: [groups]
      summary: The account's chat groups, the latest talk first, with the last message and the unread count
      responses:
        '200':
          description: The groups
          content: { application/json: { schema: { type: object, required: [groups], properties: { groups: { type: array, items: { $ref: '#/components/schemas/ChatGroupItem' } } } } } }
    post:
      tags: [groups]
      summary: Make a group and add coaches by username
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, usernames: { type: array, items: { type: string } } } }
      responses:
        '201': { $ref: '#/components/responses/ChatGroup' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /groups/join/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    post:
      tags: [groups]
      summary: Join a group by its link
      responses:
        '200': { $ref: '#/components/responses/ChatGroup' }
        '404': { $ref: '#/components/responses/Error' }
  /groups/league/{league}:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [groups]
      summary: A league's or tournament's own group, kept in step with its owner and coaches
      responses:
        '200': { $ref: '#/components/responses/ChatGroup' }
        '404': { $ref: '#/components/responses/Error' }
  /groups/{group}:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    get:
      tags: [groups]
      summary: The group, its members and its latest messages (reading them marks them read)
      responses:
        '200':
          description: The group
          content: { application/json: { schema: { type: object, required: [group, messages], properties: { group: { $ref: '#/components/schemas/ChatGroup' }, messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [groups]
      summary: An admin renames the group
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/ChatGroup' }
        '403': { $ref: '#/components/responses/Error' }
  /groups/{group}/messages:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    get:
      tags: [groups]
      summary: A page of messages before a message id, oldest first
      parameters: [{ name: before, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: The messages
          content: { application/json: { schema: { type: object, required: [messages], properties: { messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } } } }
    post:
      tags: [groups]
      summary: Send a message (sent at once on the group's channel chat.{group}, event "chat")
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string }, reply_to: { type: integer, nullable: true } } } } }
      responses:
        '201':
          description: The message
          content: { application/json: { schema: { type: object, required: [message], properties: { message: { $ref: '#/components/schemas/ChatMessage' } } } } }
        '429': { $ref: '#/components/responses/Error' }
  /groups/{group}/media:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    post:
      tags: [groups]
      summary: '[X65] Send a picture (kept as a JPEG of at most 1280 pixels) or a voice note (webm, ogg, mp4 or mpeg, up to two minutes), with an optional caption'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [image, audio] }
                file: { type: string, format: binary }
                caption: { type: string, nullable: true }
                seconds: { type: integer, nullable: true }
                reply_to: { type: integer, nullable: true }
      responses:
        '201':
          description: The message
          content: { application/json: { schema: { type: object, required: [message], properties: { message: { $ref: '#/components/schemas/ChatMessage' } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /groups/{group}/media/{message}:
    parameters: [{ $ref: '#/components/parameters/Group' }, { name: message, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [groups]
      summary: A picture's or voice note's bytes, for the group's members only
      responses:
        '200': { description: The file, content: { image/jpeg: { schema: { type: string, format: binary } }, audio/webm: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /groups/{group}/messages/{message}:
    parameters: [{ $ref: '#/components/parameters/Group' }, { name: message, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [groups]
      summary: Delete a message (one's own; an admin any)
      responses:
        '200': { description: Done, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /groups/{group}/read:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    post:
      tags: [groups]
      summary: Mark read up to a message
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [last_id], properties: { last_id: { type: integer } } } } }
      responses:
        '200': { description: Done, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
  /groups/{group}/members:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    post:
      tags: [groups]
      summary: An admin adds coaches by username
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [usernames], properties: { usernames: { type: array, items: { type: string } } } } } }
      responses:
        '200':
          description: The group
          content: { application/json: { schema: { type: object, required: [added, group], properties: { added: { type: integer }, group: { $ref: '#/components/schemas/ChatGroup' } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /groups/{group}/members/{user}:
    parameters: [{ $ref: '#/components/parameters/Group' }, { name: user, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [groups]
      summary: An admin removes a member
      responses:
        '200': { $ref: '#/components/responses/ChatGroup' }
        '403': { $ref: '#/components/responses/Error' }
  /groups/{group}/members/{user}/admin:
    parameters: [{ $ref: '#/components/parameters/Group' }, { name: user, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [groups]
      summary: An admin makes a member an admin, or not
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [admin], properties: { admin: { type: boolean } } } } }
      responses:
        '200': { $ref: '#/components/responses/ChatGroup' }
        '403': { $ref: '#/components/responses/Error' }
  /groups/{group}/leave:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    post:
      tags: [groups]
      summary: Leave the group (not a league's)
      responses:
        '200': { description: Done, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/chat:
    get:
      tags: [admin]
      summary: '[X65] The chat groups'' settings - the retention in days (0 keeps everything), whether media may be sent - and their size'
      responses:
        '200': { $ref: '#/components/responses/AdminChat' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      summary: Set the retention (messages older than it are deleted every hour) and whether media may be sent
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [retention_days, media], properties: { retention_days: { type: integer, minimum: 0, maximum: 365 }, media: { type: boolean } } } } }
      responses:
        '200': { $ref: '#/components/responses/AdminChat' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/chat/prune:
    post:
      tags: [admin]
      summary: Apply the retention now
      responses:
        '200': { $ref: '#/components/responses/AdminChat' }
components:
  parameters:
    Group: { name: group, in: path, required: true, schema: { type: integer } }
    League:
      name: league
      in: path
      required: true
      schema: { type: integer }
    JoinRequest:
      name: request
      in: path
      required: true
      schema: { type: integer }
    Club:
      name: club
      in: path
      required: true
      schema: { type: integer }
    Match:
      name: match
      in: path
      required: true
      schema: { type: string, description: ULID }
    Room:
      name: room
      in: path
      required: true
      schema: { type: string, description: ULID }
    Seat:
      name: X-Seat
      in: header
      schema: { type: string }
      description: A live match's secret seat (from POST /sim/rooms, /join, or the seats of a live POST /sim/matches). It names the side this device manages.
  securitySchemes:
    session: { type: apiKey, in: cookie, name: legends-session, description: 'The web: Sanctum session cookie, with X-XSRF-TOKEN' }
    token: { type: http, scheme: bearer, description: 'The app: a token from /auth/token or /auth/google/token' }
  responses:
    AdminChat:
      description: The chat settings
      content:
        application/json:
          schema:
            type: object
            required: [retention_days, media, groups, messages, media_count, media_kb, oldest]
            properties:
              retention_days: { type: integer }
              media: { type: boolean }
              groups: { type: integer }
              messages: { type: integer }
              media_count: { type: integer }
              media_kb: { type: integer }
              oldest: { type: string, format: date-time, nullable: true }
              deleted: { type: integer, description: Messages the prune just deleted }
    ChatGroup:
      description: The group
      content: { application/json: { schema: { type: object, required: [group], properties: { group: { $ref: '#/components/schemas/ChatGroup' } } } } }
    Tactics:
      description: My tactics, the tips, and the next referee once drawn
      content:
        application/json:
          schema:
            type: object
            required: [tactics, tips, help, scenarios, scenario_kinds, book]
            properties:
              tactics: { $ref: '#/components/schemas/TacticsSet' }
              book:
                type: object
                description: 'The tactics book [Sprint 21 E5.4]: each plan against each defensive shape (high, mid, low), from the engine''s own table'
                required: [plans, shapes, mine]
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      required: [plan, edge, beats, loses_to]
                      properties:
                        plan: { type: string, enum: [counter, long, passing, wings, shots] }
                        edge:
                          type: object
                          description: Edge against each shape, in basis points (of 10000) on getting through and making the chance
                          required: [high, mid, low]
                          properties: { high: { type: integer }, mid: { type: integer }, low: { type: integer } }
                        beats: { type: array, items: { type: string, enum: [high, mid, low] } }
                        loses_to: { type: array, items: { type: string, enum: [high, mid, low] } }
                  shapes:
                    type: array
                    items:
                      type: object
                      required: [shape, beaten_by, stops]
                      properties:
                        shape: { type: string, enum: [high, mid, low] }
                        beaten_by: { type: array, description: Best first, items: { type: string, enum: [counter, long, passing, wings, shots] } }
                        stops: { type: array, description: Most stopped first, items: { type: string, enum: [counter, long, passing, wings, shots] } }
                  mine: { type: string, nullable: true, enum: [high, mid, low, null], description: The shape my saved tactics make }
              tips: { type: array, items: { type: string } }
              referee: { type: string, nullable: true, enum: [lenient, medium, strict, null] }
              help:
                type: object
                description: 'What each part does, for its "?": plan, pressing, style, tempo, tackling, lines, trap, marking, tips'
                additionalProperties: { type: string }
              scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } }
              scenario_kinds:
                type: array
                items:
                  type: object
                  required: [kind, minute]
                  properties:
                    kind: { type: string, enum: [trailing, red_card, leading] }
                    minute:
                      type: object
                      nullable: true
                      required: [default, min, max]
                      properties: { default: { type: integer }, min: { type: integer }, max: { type: integer } }
    Integrity:
      description: The integrity system for my club
      content:
        application/json:
          schema:
            type: object
            required: [on, fixture, bribe, security, double_agent, spies_on_me, proofs, banned_until, headlines]
            properties:
              on: { type: boolean }
              verdict: { type: object, additionalProperties: true, description: 'After an accusation: the club, the fine, the points, the ban''s hours' }
              fixture: { type: object, nullable: true, required: [id, opponent], properties: { id: { type: integer }, opponent: { type: string } } }
              bribe:
                type: object
                required: [paid, money, extra, var_percent]
                properties:
                  paid: { type: boolean }
                  money: { type: integer }
                  extra: { type: object, required: [currency, amount], properties: { currency: { type: string, enum: [coins, money] }, amount: { type: integer } } }
                  var_percent: { type: integer }
              security: { type: object, required: [sees, cost], properties: { sees: { type: boolean }, cost: { type: object, required: [currency, amount], properties: { currency: { type: string, enum: [coins, money] }, amount: { type: integer } } } } }
              double_agent: { type: object, required: [currency, amount], properties: { currency: { type: string, enum: [coins, money] }, amount: { type: integer } } }
              spies_on_me:
                type: array
                items: { type: object, required: [id, club, turned], properties: { id: { type: integer }, club: { type: string }, turned: { type: boolean } } }
              proofs:
                type: array
                items: { type: object, required: [spy_report_id, club, filed], properties: { spy_report_id: { type: integer }, club: { type: string }, filed: { type: boolean } } }
              banned_until: { type: string, format: date-time, nullable: true }
              headlines: { type: array, items: { type: object, required: [text, points], properties: { text: { type: string }, points: { type: integer } } } }
    Alliance:
      description: The alliance tournament
      content:
        application/json:
          schema:
            type: object
            required: [can_create, sizes, default_size, coaches, tournament]
            properties:
              can_create: { type: boolean }
              sizes: { type: array, items: { type: integer } }
              default_size: { type: integer }
              coaches: { type: array, items: { type: object, required: [username, name], properties: { username: { type: string, nullable: true }, name: { type: string } } } }
              tournament:
                type: object
                nullable: true
                required: [id, name, status, size, winner, first_round_at, review_note, captain_of, alliances, ties]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  status: { type: string, enum: [pending, rejected, running, finished] }
                  size: { type: integer }
                  winner: { type: string, nullable: true, enum: [a, b, null] }
                  first_round_at: { type: string, format: date-time }
                  review_note: { type: string, nullable: true }
                  captain_of: { type: string, nullable: true, enum: [a, b, null], description: The alliance I captain }
                  alliances:
                    type: object
                    required: [a, b]
                    properties:
                      a: { $ref: '#/components/schemas/AllianceSide' }
                      b: { $ref: '#/components/schemas/AllianceSide' }
                  ties:
                    type: array
                    items:
                      type: object
                      required: [id, round, kind, home, away, alliance, scheduled_at, winner_id, status, score, match_id]
                      properties:
                        id: { type: integer }
                        round: { type: integer }
                        kind: { type: string, enum: [match, bye, captain, walkover] }
                        home: { type: object, nullable: true, additionalProperties: true }
                        away: { type: object, nullable: true, additionalProperties: true }
                        alliance: { type: string, nullable: true, enum: [a, b, null], description: The home club's alliance }
                        scheduled_at: { type: string, format: date-time }
                        winner_id: { type: integer, nullable: true }
                        status: { type: string, nullable: true }
                        score: { type: object, nullable: true, required: [home, away], properties: { home: { type: integer }, away: { type: integer } } }
                        match_id: { type: integer, nullable: true }
    AdminAlliances:
      description: The alliance tournaments for review
      content:
        application/json:
          schema:
            type: object
            required: [tournaments]
            properties:
              tournaments:
                type: array
                items:
                  type: object
                  required: [id, league_id, league, name, status, size, captains, first_round_at, review_note]
                  properties:
                    id: { type: integer }
                    league_id: { type: integer }
                    league: { type: string }
                    name: { type: string }
                    status: { type: string }
                    size: { type: integer }
                    captains: { type: array, items: { type: string, nullable: true } }
                    first_round_at: { type: string, format: date-time }
                    review_note: { type: string, nullable: true }
    Tickets:
      description: The coming matches of the other clubs, with my ticket
      content:
        application/json:
          schema:
            type: object
            required: [price, boost, balance, fixtures]
            properties:
              price: { type: integer }
              boost: { type: integer, description: The morale a ticket adds to the side it cheers }
              balance: { type: integer }
              fixtures:
                type: array
                items:
                  type: object
                  required: [id, competition, round, scheduled_at, home, away, cheering, mine]
                  properties:
                    id: { type: integer }
                    competition: { type: string }
                    round: { type: integer }
                    scheduled_at: { type: string, format: date-time }
                    home: { type: object, required: [id, name, code, crest_url], properties: { id: { type: integer }, name: { type: string }, code: { type: string }, crest_url: { type: string } } }
                    away: { type: object, required: [id, name, code, crest_url], properties: { id: { type: integer }, name: { type: string }, code: { type: string }, crest_url: { type: string } } }
                    cheering: { type: object, required: [home, away], properties: { home: { type: integer }, away: { type: integer } } }
                    mine: { type: string, nullable: true, enum: [home, away, null] }
    Team:
      description: My club and its team sheet
      content:
        application/json:
          schema:
            type: object
            required: [club, squad_value, lines, players, lineup, takers, custom_formations, morale]
            properties:
              morale:
                type: object
                description: 'The squad''s morale, 0..100, and its run of matches without a win [X25]'
                required: [value, winless_run]
                properties: { value: { type: integer }, winless_run: { type: integer } }
              lines:
                type: object
                description: 'The team strength by line [X29]: the starters'' average rating in each (or the line''s best)'
                required: [att, mid, def, gk]
                properties: { att: { type: integer }, mid: { type: integer }, def: { type: integer }, gk: { type: integer } }
              club:
                type: object
                required: [id, name, code, strength_cp, balance, crest_url]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  code: { type: string }
                  strength_cp: { type: integer }
                  balance: { type: integer }
                  crest_url: { type: string }
              squad_value: { type: integer }
              players: { type: array, items: { $ref: '#/components/schemas/SquadPlayer' } }
              lineup: { $ref: '#/components/schemas/Lineup' }
              takers:
                type: object
                description: captain, penalty, free_kick, corner
                additionalProperties:
                  type: object
                  required: [auto]
                  properties:
                    player_id: { type: integer, nullable: true, description: Who takes it in the next match }
                    auto: { type: boolean }
                    chosen_id: { type: integer, nullable: true, description: '[Sprint 27 W5] The coach''s choice, playing or not' }
                    candidates:
                      type: array
                      description: '[Sprint 27 W5] The squad ranked by the role''s skill (no goalkeeper but for captain)'
                      items: { type: object, required: [id, skill, on], properties: { id: { type: integer }, skill: { type: integer }, on: { type: boolean, description: In the eleven } } }
              custom_formations:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Formation'
                    - type: object
                      required: [number, cells]
                      properties:
                        number: { type: integer }
                        cells: { type: array, items: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } } }
    Draw:
      description: The live draw
      content:
        application/json:
          schema:
            type: object
            required: [draw_at, commit, drawn_at, seed, reveal_ms, server_now, committee, is_owner, can_schedule, starts_at, slots, league_round, cup_round]
            properties:
              draw_at: { type: string, format: date-time, nullable: true }
              commit: { type: string, nullable: true, description: 'sha256 of "legends-draw:{league}:{seed}", shown before the draw' }
              drawn_at: { type: string, format: date-time, nullable: true }
              seed: { type: integer, nullable: true, description: Shown once drawn }
              reveal_ms: { type: integer }
              server_now: { type: integer }
              committee: { type: object, required: [owner], properties: { owner: { type: string, nullable: true } } }
              is_owner: { type: boolean }
              can_schedule: { type: boolean }
              starts_at: { type: string, format: date-time }
              slots:
                type: array
                items: { type: object, required: [slot, club], properties: { slot: { type: integer }, club: { type: object, additionalProperties: true } } }
              league_round:
                type: array
                items: { type: object, required: [home, away], properties: { home: { type: object, nullable: true, additionalProperties: true }, away: { type: object, nullable: true, additionalProperties: true } } }
              cup_round:
                type: array
                items: { type: object, required: [home, away], properties: { home: { type: object, nullable: true, additionalProperties: true }, away: { type: object, nullable: true, additionalProperties: true } } }
    League:
      description: The league
      content:
        application/json:
          schema:
            type: object
            required: [league]
            properties:
              league: { $ref: '#/components/schemas/League' }
    JoinRequest:
      description: The join request
      content:
        application/json:
          schema:
            type: object
            required: [request]
            properties:
              request: { $ref: '#/components/schemas/JoinRequest' }
              league: { $ref: '#/components/schemas/League' }
    Account:
      description: The account
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/Account' }
    AccountToken:
      description: The account, and for the app its token
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: '#/components/schemas/Account' }
              token: { type: string, description: Only when device_name was sent (the app) }
              expires_at: { type: string, format: date-time }
              verification_sent: { type: boolean, description: 'Register only: the confirmation email left the server. False when it could not be sent (the app offers to send it again)' }
    Error:
      description: Any error, in one shape with an Arabic message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed (messages in Arabic)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Tournament:
      type: object
      required: [id, name, code, template, format, group_count, advance_per_group, legs, team_count, status, owner, starts_at, draw_at, drawn_at, coaches]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        template: { type: string, nullable: true }
        format: { type: string, nullable: true }
        group_count: { type: integer, nullable: true }
        advance_per_group: { type: integer, nullable: true }
        legs: { type: integer, nullable: true }
        team_count: { type: integer }
        status: { type: string }
        owner: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        starts_at: { type: string, format: date-time }
        draw_at: { type: string, format: date-time, nullable: true }
        drawn_at: { type: string, format: date-time, nullable: true }
        coaches: { type: integer }
    TeamCard:
      type: object
      required: [id, name, code, league, strength_cp, colors, crest_url, logo, nation, confederation]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        league: { type: string }
        strength_cp: { type: integer }
        colors: { type: array, items: { type: string } }
        crest_url: { type: string }
        logo: { type: string, nullable: true }
        nation: { type: boolean }
        confederation: { type: string, nullable: true }
    TournamentRow:
      type: object
      required: [club, played, won, drawn, lost, goals_for, goals_against, points]
      properties:
        club: { type: object, nullable: true, additionalProperties: true }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        goals_for: { type: integer }
        goals_against: { type: integer }
        points: { type: integer }
    ChatGroup:
      type: object
      required: [id, name, league_id, is_admin, invite_url, members_count]
      properties:
        id: { type: integer }
        name: { type: string }
        league_id: { type: integer, nullable: true }
        is_admin: { type: boolean }
        invite_url: { type: string, nullable: true, description: For the admins of a group that is not a league's }
        members_count: { type: integer }
        members:
          type: array
          items: { type: object, required: [id, name, username, is_admin, avatar_url], properties: { id: { type: integer }, name: { type: string }, username: { type: string }, is_admin: { type: boolean }, avatar_url: { type: string } } }
    ChatGroupItem:
      allOf:
        - { $ref: '#/components/schemas/ChatGroup' }
        - type: object
          required: [last, unread]
          properties:
            last: { allOf: [{ $ref: '#/components/schemas/ChatMessage' }], nullable: true }
            unread: { type: integer }
    ChatMessage:
      type: object
      required: [id, kind, deleted, body, user, reply_to, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [text, image, audio, note], description: 'A note is the group''s own, its body JSON: {what: created|added|joined|left|removed|renamed, by?, name?}. A picture or voice note has its caption as body [X65]' }
        deleted: { type: boolean }
        body: { type: string }
        user: { type: object, nullable: true, required: [id, name, username], properties: { id: { type: integer }, name: { type: string }, username: { type: string } } }
        reply_to: { type: object, nullable: true, required: [id, kind, body], properties: { id: { type: integer }, kind: { type: string }, body: { type: string } } }
        media_url: { type: string, nullable: true, description: 'A picture''s or voice note''s address, for the members only [X65]' }
        seconds: { type: integer, nullable: true, description: A voice note's length }
        created_at: { type: string, format: date-time }
    AssistantQuestion:
      type: object
      required: [question, topic]
      properties:
        question: { type: string }
        topic: { type: string, nullable: true, description: 'Sent back with the question: answered from the guide at once. Null: a question for the AI about the coach''s club' }
    AssistantStart:
      type: object
      required: [name, intro, questions, ai, remaining]
      properties:
        name: { type: string, description: 'المدرب المساعد, or Manager Bot in English' }
        intro: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/AssistantQuestion' } }
        ai: { type: boolean, description: Whether the AI is set up on the server }
        remaining: { type: integer, nullable: true, description: The smart answers left today (null without the AI) }
    AssistantAnswer:
      type: object
      required: [answer, source, go, related, remaining, notice]
      properties:
        answer: { type: string }
        source: { type: string, enum: [ai, guide] }
        go: { type: string, nullable: true, description: 'The section of the game its button opens (the web''s section name)' }
        related: { type: array, items: { $ref: '#/components/schemas/AssistantQuestion' } }
        remaining: { type: integer, nullable: true }
        notice: { type: string, nullable: true, enum: [off, limit, error, null], description: 'Why the guide answered instead of the AI: not set up, the coach''s day used up, or the AI unable now' }
    ScoutView:
      type: object
      required: [cost, hours, balance, options, requests]
      properties:
        cost: { type: integer }
        hours: { type: integer }
        balance: { type: integer }
        options:
          type: object
          required: [leagues, nationalities, positions]
          properties:
            leagues: { type: array, items: { type: string } }
            nationalities: { type: array, items: { type: string } }
            positions: { type: array, items: { type: string } }
        requests:
          type: array
          items:
            type: object
            required: [id, status, cost, criteria, finishes_at, players]
            properties:
              id: { type: integer }
              status: { type: string, enum: [searching, done, empty] }
              cost: { type: integer }
              criteria: { type: object, additionalProperties: true }
              finishes_at: { type: string, format: date-time }
              players:
                type: array
                items:
                  type: object
                  required: [id, name, position, line, age, overall, potential, value, price, state]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    position: { type: string }
                    line: { type: string }
                    age: { type: integer }
                    nationality: { type: string, nullable: true }
                    overall: { type: integer }
                    potential: { type: integer }
                    value: { type: integer }
                    price: { type: integer, nullable: true }
                    state: { type: string, enum: [available, mine, gone] }
    OfferTerms:
      type: object
      required: [in, idempotency_key]
      properties:
        money: { type: integer, minimum: 0, description: From the offering club to the other }
        in: { type: array, items: { type: integer }, minItems: 1, maxItems: 5, description: The other club's players wanted }
        out: { type: array, items: { type: integer }, maxItems: 5, description: The offering club's players given }
        idempotency_key: { type: string, maxLength: 64 }
        sell_on_bp: { type: integer, minimum: 0, description: '[X62] The share of the next sale of the players taken promised to the other club (basis points, up to economy.sell_on_max_bp)' }
    TradePlayer:
      type: object
      required: [id, name, position, line, age, overall, value]
      properties: { id: { type: integer }, name: { type: string }, position: { type: string }, line: { type: string }, age: { type: integer }, overall: { type: integer }, value: { type: integer } }
    TransferOffer:
      type: object
      required: [id, status, money, from, to, incoming, counter_of, in, out, expires_at]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, accepted, rejected, countered, cancelled, expired] }
        money: { type: integer }
        sell_on_bp: { type: integer, description: '[X62] The sell-on share promised with it' }
        from: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        to: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        incoming: { type: boolean, description: True when it is mine to answer }
        counter_of: { type: integer, nullable: true }
        in: { type: array, items: { $ref: '#/components/schemas/TradePlayer' } }
        out: { type: array, items: { $ref: '#/components/schemas/TradePlayer' } }
        expires_at: { type: string, format: date-time }
    Transfers:
      type: object
      required: [closed, fair, pair_cap, listings, offers, clubs]
      properties:
        closed: { type: string, nullable: true }
        fair: { type: object, required: [min_bp, max_bp], properties: { min_bp: { type: integer }, max_bp: { type: integer } } }
        pair_cap: { type: integer }
        listings:
          type: array
          items:
            type: object
            required: [player, price, club, mine]
            properties:
              player: { $ref: '#/components/schemas/TradePlayer' }
              price: { type: integer }
              club: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
              mine: { type: boolean }
        offers: { type: array, items: { $ref: '#/components/schemas/TransferOffer' } }
        clubs: { type: array, items: { type: object, required: [id, name, code], properties: { id: { type: integer }, name: { type: string }, code: { type: string } } } }
    Market:
      type: object
      required: [closed, open_until_round, counts, balance, bots, players, mine]
      properties:
        closed: { type: string, nullable: true }
        open_until_round: { type: integer }
        counts: { type: object, required: [pool, bots], properties: { pool: { type: integer }, bots: { type: integer } } }
        balance: { type: integer }
        bots: { type: array, items: { type: object, required: [id, name, code, players], properties: { id: { type: integer }, name: { type: string }, code: { type: string }, players: { type: integer } } } }
        players:
          type: array
          items:
            type: object
            required: [id, name, position, line, age, overall, potential, value, price, club]
            properties:
              id: { type: integer }
              name: { type: string }
              position: { type: string }
              line: { type: string }
              age: { type: integer }
              overall: { type: integer }
              potential: { type: integer }
              nationality: { type: string, nullable: true }
              value: { type: integer }
              price: { type: integer }
              club: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
              attributes: { type: object, additionalProperties: { type: integer, nullable: true }, description: 'The six attributes, or the keeper''s five, for the card [X29]' }
        mine:
          type: array
          items:
            type: object
            required: [id, name, position, line, overall, value, floor, cap, quick, wait_hours, listed]
            properties:
              id: { type: integer }
              name: { type: string }
              position: { type: string }
              line: { type: string }
              overall: { type: integer }
              value: { type: integer, description: His value now, training counted }
              cost: { type: integer, description: '[Sprint 23] His cost to the club (what it paid, or his value at the season''s start): the profit of selling him outside is counted from it' }
              floor: { type: integer, description: The least a listing asks }
              cap: { type: integer, description: 'The most a listing asks: 250% of his value, within the season''s profit room [Sprint 23]' }
              quick:
                type: object
                required: [pays, fee]
                description: The instant sale
                properties:
                  pays: { type: integer, description: 'His value, within the season''s profit room [Sprint 23]' }
                  fee: { type: object, required: [currency, amount], properties: { currency: { type: string, enum: [coins, money] }, amount: { type: integer } } }
              wait_hours: { type: object, required: [value, cap], properties: { value: { type: integer }, cap: { type: integer } }, description: 'About how long the outside buyer takes at his value and at his cap (his age and rating, and a transfer madness, counted) [Sprint 23]' }
              listed: { type: object, nullable: true, required: [price, sells_at], properties: { price: { type: integer }, sells_at: { type: string, format: date-time, nullable: true } } }
        selling:
          type: object
          description: '[Sprint 23] Listing: how many at once, how many now, and the season''s profit room selling outside the league'
          required: [max_listings, listed, room, allowance]
          properties:
            max_listings: { type: integer }
            listed: { type: integer }
            room: { type: integer, description: 'What is left of the season''s profit room, less what the listings ask over their cost' }
            allowance: { type: integer }
    ClubFinance:
      type: object
      required: [balance, can_spend, debt_rounds, debt_limit, wages_per_round, season_totals, season_income, season_expenses, rounds, transactions, stadium, tickets, sponsors]
      properties:
        balance: { type: integer }
        can_spend: { type: boolean }
        debt_rounds: { type: integer }
        debt_limit: { type: integer }
        wages_per_round: { type: integer }
        season_totals: { type: array, items: { type: object, required: [type, label, total], properties: { type: { type: string }, label: { type: string }, total: { type: integer } } } }
        season_income: { type: integer }
        season_expenses: { type: integer }
        rounds: { type: array, items: { type: object, required: [round, in, out], properties: { round: { type: integer }, in: { type: integer }, out: { type: integer } } } }
        transactions:
          type: array
          items:
            type: object
            required: [id, type, label, amount, balance_after, created_at, round, cup]
            properties:
              id: { type: integer }
              type: { type: string }
              label: { type: string }
              amount: { type: integer }
              balance_after: { type: integer }
              created_at: { type: string, format: date-time }
              round: { type: integer, nullable: true }
              cup: { type: boolean }
        stadium:
          type: object
          required: [capacity, attendance_bp, ticket_price, tickets_per_match]
          properties: { capacity: { type: integer }, attendance_bp: { type: integer }, ticket_price: { type: integer }, tickets_per_match: { type: integer } }
        tickets: { $ref: '#/components/schemas/TicketLevels' }
        sponsors:
          type: array
          items:
            type: object
            required: [sector, name, chosen, offers]
            properties:
              sector: { type: string }
              name: { type: string }
              chosen: { type: string, nullable: true }
              offers: { type: array, items: { type: object, required: [offer, name, per_match, per_win], properties: { offer: { type: string }, name: { type: string }, per_match: { type: integer }, per_win: { type: integer } } } }
    Message:
      type: object
      required: [id, type, read, created_at, title, body, link]
      properties:
        id: { type: integer }
        type: { type: string, description: 'One of App\\Messages\\MessageText::TYPES (referee, match_report, announcement...)' }
        league_id: { type: integer, nullable: true }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true, description: A web path to open (the app maps it to its own screen) }
        sender:
          type: object
          description: 'An announcement only: the developer who sent it, with the official badge [X11]'
          required: [name, username, official]
          properties:
            name: { type: string }
            username: { type: string }
            official: { type: boolean }
    MatchReading:
      type: object
      description: The assistant's live note to his coach [ENGINE 8.2], from the public events and his own side only
      required: [minute, kind, text]
      properties:
        id: { type: integer }
        tick: { type: integer }
        minute: { type: integer }
        kind: { type: string, description: 'goal_for, goal_against, red_for, red_against, tired, build_lost, press_won, finishing, danger, counters_for, counters_against, offside, cards, fitness, on_top' }
        text: { type: string }
    MatchOrderResult:
      type: object
      required: [target_tick, duplicate]
      properties:
        target_tick: { type: integer, description: Not before this minute }
        duplicate: { type: boolean }
    League:
      type: object
      required: [id, name, template, team_count, rounds_per_day, round_times, prep_days, season_end_mode, starts_at, starting_budget, fair_league, is_dev, status, locked, is_owner, coaches, members, departures]
      properties:
        id: { type: integer }
        name: { type: string }
        template: { type: string }
        kind: { type: string, enum: [league, tournament], description: '[Sprint 29] A tournament is a league of its own kind' }
        format: { type: string, nullable: true, enum: [league, groups, knockout, null] }
        tournament_template: { type: string, nullable: true }
        code: { type: string, nullable: true, description: For the owner and approved coaches only }
        team_count: { type: integer }
        rounds_per_day: { type: integer }
        round_times: { type: array, items: { type: string } }
        rest_days: { type: array, items: { type: integer }, description: '[Sprint 27 B1] Days off with no matches: ISO weekdays in Cairo' }
        prep_days: { type: integer }
        season_end_mode: { type: string, enum: [renew, end] }
        starts_at: { type: string, format: date-time }
        starting_budget: { type: integer }
        draw_at: { type: string, format: date-time, nullable: true, description: 'The live draw''s time [X26]' }
        drawn_at: { type: string, format: date-time, nullable: true }
        fair_league: { type: boolean }
        integrity: { type: boolean, description: 'The integrity system: bribes, spies and the FA [X28]' }
        press_conferences: { type: boolean, description: '[UP12] The press conference before each match' }
        custom_coins: { type: integer, description: '[UP9] The coins paid for a customized league (0: free)' }
        second_slot_minutes: { type: integer, nullable: true, description: 'Rounds in two slots [X31]' }
        headlines: { type: array, items: { type: object, required: [text, points], properties: { text: { type: string }, points: { type: integer } } }, description: 'The FA verdicts of the last day [X28]' }
        is_dev: { type: boolean }
        status: { type: string, enum: [waiting, running, finished] }
        locked: { type: boolean, description: Settings are locked once the league starts }
        owner: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        is_owner: { type: boolean }
        my_club_id: { type: integer, nullable: true }
        my_request: { type: string, nullable: true, enum: [pending, approved, rejected, null] }
        coaches: { type: integer, description: Clubs with a coach }
        free_clubs: { type: integer, description: Clubs a coach can still take }
        invite_url: { type: string, nullable: true, description: 'The invite link (/join/CODE) with its WhatsApp card; for the owner and approved coaches' }
        me:
          type: object
          nullable: true
          description: My place this season, when I coach here
          required: [membership_id, on_holiday, vacation_used, absence_warning]
          properties:
            membership_id: { type: integer }
            on_holiday: { type: boolean }
            vacation_until: { type: string, format: date-time, nullable: true }
            vacation_used: { type: boolean, description: The season's one holiday is taken }
            vacation_requested: { type: boolean, description: A holiday request waits for the owner }
            account_vacation: { type: boolean, description: "The account's holiday is on (every league)" }
            absence_warning: { type: boolean, description: 48 hours quiet; cleared by any visit }
            away_deadline: { type: string, format: date-time, nullable: true, description: When the club goes back to a bot if I stay away; null before the season and on holiday }
        members:
          type: array
          description: Coaches this season
          items:
            type: object
            required: [id, user, is_owner, on_holiday, joined_at]
            properties:
              id: { type: integer, description: Membership id (for the kick) }
              user: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string }, username: { type: string, nullable: true }, avatar_url: { type: string, nullable: true }, official: { type: boolean, description: 'A developer account (Owner-Sizar, Owner-Sliman) [X11]' }, verified: { type: boolean, description: '[Sprint 21 E2.5] A verified account' } } }
              club: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
              is_owner: { type: boolean }
              on_holiday: { type: boolean }
              vacation_request:
                type: object
                nullable: true
                description: A holiday request waiting for the owner; for the owner only
                properties:
                  days: { type: integer }
                  reason: { type: string }
                  at: { type: string, format: date-time }
              joined_at: { type: string, format: date-time }
              last_active_at: { type: string, format: date-time, nullable: true, description: For the owner only }
        departures:
          type: array
          description: Who left this season and why; a kick's reason is shown to every member
          items:
            type: object
            required: [user, reason, left_at]
            properties:
              user: { type: string }
              club: { type: string, nullable: true }
              reason: { type: string, enum: [resigned, absent, kicked, deleted] }
              kick_reason: { type: string, nullable: true }
              left_at: { type: string, format: date-time }
        pending_requests: { type: integer, nullable: true, description: Waiting join requests; for the owner only }
        season:
          type: object
          nullable: true
          properties:
            number: { type: integer }
            status: { type: string, enum: [upcoming, running, finished] }
            rounds: { type: integer }
            rounds_played: { type: integer }
            lock_from_round: { type: integer, description: No new coach from this round on (the last 25%) }
            join_open: { type: boolean }
    TacticsSet:
      type: object
      description: The engine's own keys (docs/ENGINE.md 5)
      properties:
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        tackling: { type: integer, minimum: 0, maximum: 3, description: 0 legal, 1 normal, 2 eager, 3 hard }
        pressing: { type: integer, minimum: 0, maximum: 100 }
        style: { type: integer, minimum: 0, maximum: 100, description: 0 defensive to 100 attacking }
        tempo: { type: integer, minimum: 0, maximum: 100 }
        att: { type: string, enum: [back, support, only] }
        mid: { type: string, enum: [def, stay, push] }
        def: { type: string, enum: [stay, fullbacks, mid] }
        trap: { type: integer, minimum: 0, maximum: 1 }
        marking: { type: string, enum: [zone, man] }
    PublicTactics:
      type: object
      description: The only tactics the opponent ever sees
      required: [tackling, marking, plan, trap]
      properties:
        tackling: { type: integer }
        marking: { type: string, enum: [zone, man] }
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        trap: { type: integer }
    Slot:
      type: object
      required: [role, line, x, y]
      properties:
        role: { type: string, example: CB }
