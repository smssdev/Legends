openapi: 3.1.0
info:
  title: Legends API
  version: 1.0.0
  description: |
    API for the Legends web app (and the Flutter app after v1.0). All routes are under /api/v1.
    Match events and frames are described in docs/api/match-events.md.
servers:
  - url: /api/v1
tags:
  - name: tournaments
    description: 'Tournaments of clubs and national teams, and their live draw (Sprint 29)'
  - name: groups
    description: 'Chat groups, as in WhatsApp, and every league''s own (Sprint 29)'
  - name: assistant
    description: The Assistant Coach, Manager Bot in English (Sprint 22)
  - name: admin
    description: The admin panel, for the admin after the two-step code, from the site only (Sprint 37)
  - name: notifications
    description: Push notifications (Sprint 36)
  - name: wallet
    description: The premium coins (Sprint 34)
  - name: market
    description: The market (Sprints 24 and 25)
  - name: messages
    description: The inbox (Sprint 22)
  - name: auth
    description: |
      Accounts (README.md 2.17). The web signs in with Sanctum's session cookie: GET /sanctum/csrf-cookie first,
      then send the X-XSRF-TOKEN header. The app uses POST /auth/token or /auth/google/token and sends
      "Authorization: Bearer <token>"; tokens expire after 30 days. Sign-in attempts: 5 a minute per email, 20 per address.
  - name: data
    description: The real clubs and players (README.md 2.6), read-only and public. 120 requests a minute.
  - name: leagues
    description: |
      Private leagues (README.md 2.1, 2.3). Make one, ask to join with its 8-letter code (10 tries a minute),
      the owner approves, then take a club no coach has. Up to 4 active clubs per account, one per league.
      Errors a screen shows as they are (409): the club was taken, the limit of 4, the last quarter of the
      rounds, the settings locked since the start.
  - name: team
    description: 'My club in a league (Sprint 16): squad, lineup, own formations, set-piece takers. 403 without a club there.'
  - name: matches
    description: 'League matches (Sprint 18): played live by the server, watched with the simulator''s viewer.'
  - name: system
    description: Health and the test broadcast
  - name: simulator
    description: Development simulator (docs/MATCH_VIEW.md 8). Returns 404 unless the simulator is enabled.
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: '[UP5] Three fields: the name, the username and the password (typed once, 4 characters or more). The email is optional (to get the password back), and a confirmation is sent to it. The web is signed in by session, kept until signing out; with device_name the app gets a token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
                username: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{2,19}$', description: 'English letters and digits from a letter, unique whatever the case, kept in lower case; the staff words are refused (GET /auth/username)' }
                email: { type: string, format: email, nullable: true, description: Optional }
                password: { type: string, minLength: 4, description: 'At least 4 characters, nothing else asked [UP5]' }
                device_name: { type: string, maxLength: 100, description: The device name }
                ref: { type: integer, nullable: true, minimum: 10000, maximum: 99999, description: '[Sprint 21 E2.3] The inviter''s account number, from the invite link' }
      responses:
        '201': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in on the web (session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, description: The email or the username }
                password: { type: string }
                remember: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out on the web
      responses:
        '200': { description: Done }
  /auth/token:
    post:
      tags: [auth]
      summary: Sign in from the app (a token that expires)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100, description: The device name }
      responses:
        '200': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: Sign out from the app (revokes this token)
      responses:
        '200': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
  /auth/google/token:
    post:
      tags: [auth]
      summary: Sign in from the app with Google Sign-In
      description: The app sends the id_token from Google. Linked to an existing account only when Google says the email is verified; an account whose email was never confirmed loses its password, tokens and sessions first. The web signs in with Google at GET /auth/google/redirect (outside /api/v1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device_name]
              properties:
                id_token: { type: string }
                device_name: { type: string, maxLength: 100, description: The device name }
      responses:
        '200': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Email a link to choose a new password
      description: The same answer whether or not the email has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Sent if the email has an account }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Choose a new password with the emailed token
      description: Signs the account out everywhere and confirms its email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: At least 8 characters with letters and numbers }
      responses:
        '200': { description: Done }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in account
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [auth]
      summary: Change the name, the username, the commentator or the simulator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
                username: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{2,19}$' }
                commentator: { type: string, enum: [base, voice-1, voice-2, voice-3, voice-4, voice-5, voice-6, voice-7] }
                match_view: { type: string, enum: [cartoon, unity] }
                locale: { type: string, enum: [ar, en], description: 'The language of the game [UP2]' }
                coach_look: { type: string, enum: [C1, C2, C3], description: '[Sprint 26] How the coach looks on the touchline' }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [auth]
      summary: Delete the account
      description: Asks twice [X12], the word احذف in phrase and the password, or for an account without one (Google only) its email in confirm. Its teams go back to the bots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                confirm: { type: string, description: The email of an account without a password }
                phrase: { type: string, enum: ['احذف'], description: 'The second confirmation [X12]: the word typed as it is' }
      responses:
        '200': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/password:
    put:
      tags: [auth]
      summary: Change the password, or set the first one for a Google-only account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                current_password: { type: string, description: Required when the account has a password }
                password: { type: string, minLength: 8, description: At least 8 characters with letters and numbers }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/avatar:
    post:
      tags: [auth]
      summary: Set the account's picture
      description: Any image up to 4 MB (JPEG, PNG, WebP or GIF), cut to its middle square and kept as a 256-pixel JPEG.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: Remove the picture
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/verify-account/send:
    post:
      tags: [auth]
      summary: '[Sprint 21 E2.4] Mail a one-time verification code'
      description: Six digits to the account's email (or the one sent here, required when the account has none; kept once verified). Valid 15 minutes, once, and 5 wrong tries end it. Three sends a quarter-hour.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string, format: email, maxLength: 190 } } }
      responses:
        '200':
          description: Sent (or tried; sent false when the server's mail failed)
          content:
            application/json:
              schema: { type: object, required: [sent, email, minutes], properties: { sent: { type: boolean }, email: { type: string, description: 'The address, masked (k••••@gmail.com)' }, minutes: { type: integer } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/verify-account:
    post:
      tags: [auth]
      summary: '[UP6, Sprint 21 E2.4] Verify the account with the code from the email (or a developer''s)'
      description: The welcome coins (1000) reach the wallet once, when the code is right and in time; the email is kept and confirmed, and the inviter gets their gift.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 12 } } }
      responses:
        '200':
          description: Verified, with the coins
          content:
            application/json:
              schema: { type: object, required: [user, coins], properties: { user: { $ref: '#/components/schemas/Account' }, coins: { type: integer } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/vacation:
    post:
      tags: [auth]
      summary: Start the account's holiday, or ask for a long one
      description: '[UP13] The days and the reason. Up to 5 days it starts at once, in every league (absence not counted, the account safe from deletion), twice a season with 3 days between; a longer one (up to 60) waits for the developers (vacation.status pending).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, reason]
              properties:
                days: { type: integer, minimum: 1, maximum: 60 }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: The account, and the holiday started (auto) or asked (pending)
          content:
            application/json:
              schema:
                type: object
                required: [user, vacation]
                properties:
                  user: { $ref: '#/components/schemas/Account' }
                  vacation: { type: object, required: [status, days], properties: { status: { type: string, enum: [auto, pending] }, days: { type: integer } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [auth]
      summary: End the account's holiday now
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{user}/avatar:
    get:
      tags: [auth]
      summary: An account's picture (public)
      security: []
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /auth/username:
    get:
      tags: [auth]
      summary: Is this username free? With three free ones near it when not (30 a minute) [X11]
      security: []
      parameters:
        - { name: u, in: query, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                type: object
                required: [available, reason, suggestions]
                properties:
                  available: { type: boolean }
                  reason: { type: string, nullable: true, description: Why not, in Arabic }
                  suggestions: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: Send the confirmation email again (3 a minute)
      responses:
        '202': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /data/glossary:
    get:
      tags: [data]
      summary: The game's terms explained in Arabic, for the "?" beside each [X19]
      security: []
      responses:
        '200':
          description: The terms
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms: { type: object, additionalProperties: { type: string } }
  /data/templates:
    get:
      tags: [data]
      summary: The leagues a new league can copy, strongest first
      security: []
      responses:
        '200':
          description: Templates of the latest data version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_version: { type: string }
                  templates:
                    type: array
                    items:
                      type: object
                      required: [name, clubs, top_strength_cp, avg_strength_cp]
                      properties:
                        name: { type: string }
                        clubs: { type: integer }
                        top_strength_cp: { type: integer, description: The strongest club, in hundredths (8480 = 84.8) }
                        avg_strength_cp: { type: integer }
  /data/clubs:
    get:
      tags: [data]
      summary: The clubs of one template, strongest first
      security: []
      parameters:
        - { name: league, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Clubs
          content:
            application/json:
              schema:
                type: object
                properties:
                  league: { type: string }
                  clubs: { type: array, items: { $ref: '#/components/schemas/DataClub' } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /data/clubs/{club}:
    get:
      tags: [data]
      summary: A club and its whole squad, with potential and value
      security: []
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The club
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/DataClub' }
                  - type: object
                    required: [squad_value, players]
                    properties:
                      squad_value: { type: integer, description: Club money }
                      players: { type: array, items: { $ref: '#/components/schemas/DataPlayer' } }
        '404': { $ref: '#/components/responses/Error' }
  /data/clubs/{club}/crest.svg:
    get:
      tags: [data]
      summary: The club's generated badge (SVG)
      description: No real logos; a shape, a pattern and the club's letters in its colours, the same everywhere. Cached for a week, with an ETag.
      security: []
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The badge
          content:
            image/svg+xml:
              schema: { type: string }
        '304': { description: Not changed }
        '404': { $ref: '#/components/responses/Error' }
  /data/formations:
    get:
      tags: [data]
      summary: The 24 formations
      security: []
      responses:
        '200':
          description: Every formation with its slots, and the limits of a custom one
          content:
            application/json:
              schema:
                type: object
                required: [formations, limits, bands, across, off_line_bp]
                properties:
                  formations: { type: array, items: { $ref: '#/components/schemas/Formation' } }
                  limits: { type: object, additionalProperties: { type: array, items: { type: integer } } }
                  grid: { type: object }
                  bands:
                    type: object
                    description: The depth (x) a player of each line may be dragged to, [from, to]
                    additionalProperties: { type: array, items: { type: integer } }
                  across: { type: array, items: { type: integer }, description: 'The width (y) a player may be dragged to, [from, to]' }
                  off_line_bp: { type: integer, description: '[Sprint 27 W4] What an outfield player gives out of his lines (bp of his ability), as the engine plays him' }
  /health:
    get:
      tags: [system]
      summary: The API's version, the oldest app it still serves, and the game time
      description: The app compares its own version with min_app_version and asks the player to update when it is older.
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version, min_app_version, engine_version, time, clock_offset, broadcast]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: 0.1.0 }
                  min_app_version: { type: string, example: 1.0.0 }
                  engine_version: { type: integer }
                  time: { type: string, format: date-time, description: The game time (GameClock) in UTC }
                  clock_offset: { type: integer, description: Seconds the game clock is ahead of real time (clock:travel, development only; 0 in production) }
                  broadcast:
                    type: object
                    description: Where the test event of POST /health/ping arrives
                    properties:
                      channel: { type: string, example: system }
                      event: { type: string, example: ping }
                  support:
                    type: object
                    description: 'The support buttons [X13]: a link per channel, null when not set'
                    required: [whatsapp, telegram]
                    properties:
                      whatsapp: { type: string, nullable: true, example: 'https://wa.me/201000000000?text=...' }
                      telegram: { type: string, nullable: true, example: 'https://t.me/legends_support' }
                  adsense:
                    type: object
                    nullable: true
                    description: '[X57] Google AdSense for the web: null until the owner''s account (ADSENSE_CLIENT) is set on the server'
                    required: [client, slot, rewarded, test]
                    properties:
                      client: { type: string, example: ca-pub-1234567890123456 }
                      slot: { type: string, nullable: true, description: The display unit's id, null for none }
                      rewarded: { type: boolean, description: 'Google''s rewarded video (H5 Games Ads) is tried before the game''s own ad' }
                      test: { type: boolean, description: Google's test ads, until H5 Games Ads approves the site }
  /health/ping:
    post:
      tags: [system]
      summary: Broadcast the test event
      description: Sends "ping" on the public "system" channel, so a screen can check live broadcasting end to end. 10 a minute.
      responses:
        '202':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  at: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/Error' }
  /leagues:
    get:
      tags: [leagues]
      summary: My leagues
      description: The leagues I made, coach in, or asked to join (and was not turned down).
      responses:
        '200':
          description: My leagues
          content:
            application/json:
              schema:
                type: object
                required: [leagues, active_teams, max_active_teams, slots_total, next_slot_at]
                properties:
                  leagues: { type: array, items: { $ref: '#/components/schemas/League' } }
                  active_teams: { type: integer }
                  max_active_teams: { type: integer, example: 2, description: '[Sprint 24 B3] The slots open now for the account''s age (2, then one more every 10 days)' }
                  slots_total: { type: integer, example: 8, description: All the slots (game.league.max_active_teams) }
                  next_slot_at: { type: [string, 'null'], format: date-time, description: When the next slot opens (null when all are open) }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [leagues]
      summary: Make a league
      description: |
        Copies the strongest team_count clubs of the template with their players, funds each with the starting
        budget, and gives the owner the club they chose. Every other club is a bot. 10 a minute.
        [UP9] Every setting may be left out for the free league: all the template's clubs, one round a day at 21:00 in
        the creator's time zone, two days to get ready, integrity and press conferences on, one season. Any setting
        that differs makes a customized league, paid once in coins (team_count × 20; 409 without them).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, starts_at, club_id]
              properties:
                name: { type: string, maxLength: 60, nullable: true, description: 'Empty: the template and the code, like "Premier League #K7F2QX9M"' }
                template: { type: string, description: A name from GET /data/templates }
                team_count: { type: integer, minimum: 4, maximum: 20, description: 'From half the template''s clubs to all of them [UP9]' }
                rounds_per_day: { type: integer, minimum: 1, maximum: 1, description: 'One round a day [UP17]' }
                round_times: { type: array, items: { type: string, example: '21:00' }, description: One HH:MM, Cairo time }
                rest_days: { type: array, maxItems: 3, items: { type: integer, minimum: 1, maximum: 7 }, description: '[Sprint 27 B1] Days off with no matches: ISO weekdays in Cairo (5 Friday). Free' }
                prep_days: { type: integer, enum: [2, 4, 6] }
                timezone: { type: string, nullable: true, description: 'The creator''s IANA zone: the free league plays at 21:00 there' }
                press_conferences: { type: boolean, default: true, description: '[UP12] The press conference before each match' }
                season_end_mode: { type: string, enum: [renew, end] }
                starts_at: { type: string, format: date-time, description: From now up to 7 days }
                starting_budget: { type: integer, minimum: 1000000, maximum: 10000000, default: 3000000 }
                fair_league: { type: boolean, default: false, description: Locks spending coins inside this league }
                integrity: { type: boolean, default: true, description: 'Bribes, spies and the FA [X28]' }
                second_slot_minutes: { type: integer, nullable: true, minimum: 60, maximum: 600, description: 'Each round in two slots: half its matches this long after the round time [X31]' }
                is_dev: { type: boolean, description: Development league; ignored in production }
                club_id: { type: integer, description: The owner's club, a master club id among the strongest team_count }
      responses:
        '201': { $ref: '#/components/responses/League' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /leagues/join:
    post:
      tags: [leagues]
      summary: Ask to join with a code
      description: Spaces, a "#" and lower case are forgiven. Asking again returns the same request (200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: K7F2QX9M }
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '201': { $ref: '#/components/responses/JoinRequest' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /leagues/{league}:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: One league
      description: For its owner, its coaches, and who asked to join. Anyone else gets 404.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [leagues]
      summary: Change the settings before the start
      description: The owner only, until the league starts (409 after). rounds_per_day and round_times go together. The team count, template and budget are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, nullable: true }
                rounds_per_day: { type: integer, minimum: 1, maximum: 1 }
                round_times: { type: array, items: { type: string } }
                rest_days: { type: array, maxItems: 3, items: { type: integer, minimum: 1, maximum: 7 }, description: '[Sprint 27 B1] The calendar is made again' }
                prep_days: { type: integer, enum: [2, 4, 6] }
                season_end_mode: { type: string, enum: [renew, end] }
                starts_at: { type: string, format: date-time }
                starting_budget: { type: integer }
                fair_league: { type: boolean }
                integrity: { type: boolean }
                press_conferences: { type: boolean }
                second_slot_minutes: { type: integer, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/draw:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: 'The live draw [X26]: the time and the hash before; the seed, the slots, the first league round and cup ties after'
      description: The screen reveals one slot every `reveal_ms` from `drawn_at` on the server clock, the same for every member.
      responses:
        '200': { $ref: '#/components/responses/Draw' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [leagues]
      summary: The owner sets or moves the draw's time (after now, before the start)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [draw_at], properties: { draw_at: { type: string, format: date-time } } }
      responses:
        '200': { $ref: '#/components/responses/Draw' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/start:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [leagues]
      summary: Start now (development only)
      description: The owner's "start now" button. 404 in production; there the scheduler starts each league at its time.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/request:
    parameters: [{ $ref: '#/components/parameters/League' }]
    delete:
      tags: [leagues]
      summary: Take back my waiting request
      responses:
        '200': { description: Cancelled }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/resign:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [leagues]
      summary: Resign from the league (the club goes back to a bot)
      description: |
        PLAN 2.2, Sprint 32. Not in the preparation (the summer window), not on the winter transfer day, not in the last
        25% of the league rounds; the league's owner does not resign. No coming back to this league this season.
      responses:
        '200':
          description: Resigned
          content:
            application/json:
              schema:
                type: object
                required: [left]
                properties:
                  left: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/vacation:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [leagues]
      summary: Ask for a holiday in this league alone
      description: 1 to 7 days, once a season, with a reason the owner approves (the owner's own starts at once). Absence is not counted meanwhile. The account's holiday (/auth/vacation) covers every league without asking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, reason]
              properties:
                days: { type: integer, minimum: 1, maximum: 7 }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [leagues]
      summary: Come back early
      description: The holiday ends now and still counts as this season's one.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/members/{membership}/vacation/approve:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: membership, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leagues]
      summary: Approve a coach's holiday request (owner); it starts now
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/members/{membership}/vacation/reject:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: membership, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leagues]
      summary: Refuse a coach's holiday request (owner); it can be asked again
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/members/{membership}/kick:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: membership, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leagues]
      summary: Send a coach away (owner)
      description: The reason shows to every member. The club goes back to a bot as it is; the coach cannot come back this season.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/requests:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: Join requests (owner)
      description: Waiting ones first. A request never expires; it waits for the owner.
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/requests/{request}/approve:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/JoinRequest' }]
    post:
      tags: [leagues]
      summary: Approve a request (owner)
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/requests/{request}/reject:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/JoinRequest' }]
    post:
      tags: [leagues]
      summary: Reject a request (owner)
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/fixtures:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The season's calendar
      description: Every league round (with the rest, is_bye, when the count is odd) and cup tie, by time. Times are UTC; screens show the device's time (README.md 2.4).
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema:
                type: object
                required: [season, fixtures]
                properties:
                  season: { $ref: '#/components/schemas/SeasonCalendar' }
                  fixtures: { type: array, items: { $ref: '#/components/schemas/Fixture' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/standings:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The league table
      responses:
        '200':
          description: The table, first place first
          content:
            application/json:
              schema:
                type: object
                required: [season, table]
                properties:
                  season: { $ref: '#/components/schemas/SeasonCalendar' }
                  next_round: { type: integer, nullable: true }
                  table:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FixtureClub'
                        - type: object
                          required: [position, played, won, drawn, lost, goals_for, goals_against, goal_difference, points, rests_next]
                          properties:
                            position: { type: integer }
                            played: { type: integer }
                            won: { type: integer }
                            drawn: { type: integer }
                            lost: { type: integer }
                            goals_for: { type: integer }
                            goals_against: { type: integer }
                            goal_difference: { type: integer }
                            points: { type: integer }
                            rests_next: { type: boolean, description: Rests in the next round (odd team count) }
                            deducted: { type: integer, description: 'Points the FA took off [X28]' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/stats:
    get:
      tags: [leagues]
      summary: The statistics centre [X17]
      description: The season's table in detail, scorers and assists, cards of players and clubs, each club's buying and selling, the squads' value, and the runs of results. Members only; nothing hidden (no tactic).
      parameters:
        - { name: league, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The season's statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeagueStats' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/cup:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The cup's bracket
      description: Stage by stage (preliminary, r16, qf, sf, final), each on its own day. Sides fill in as winners move on (README.md 2.5).
      responses:
        '200':
          description: The bracket
          content:
            application/json:
              schema:
                type: object
                required: [stages]
                properties:
                  stages:
                    type: array
                    items:
                      type: object
                      required: [stage, scheduled_at, ties]
                      properties:
                        stage: { type: string, enum: [preliminary, r16, qf, sf, final] }
                        scheduled_at: { type: string, format: date-time }
                        ties:
                          type: array
                          items:
                            type: object
                            required: [id, slot, status]
                            properties:
                              id: { type: integer }
                              slot: { type: integer }
                              home: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
                              away: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
                              winner_id: { type: integer, nullable: true }
                              status: { type: string }
                              home_goals: { type: integer, nullable: true }
                              away_goals: { type: integer, nullable: true }
                              next: { type: object, nullable: true, required: [slot, side], properties: { slot: { type: integer }, side: { type: string, enum: [home, away] } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: My club, its squad and its team sheet
      description: 403 without a club in this league.
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/suggestion:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: '"تحسين": the best lineup now (not saved)'
      responses:
        '200':
          description: The suggested lineup
          content:
            application/json:
              schema:
                type: object
                required: [lineup]
                properties:
                  lineup: { $ref: '#/components/schemas/Lineup' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/lineup:
    parameters: [{ $ref: '#/components/parameters/League' }]
    put:
      tags: [team]
      summary: Save my lineup
      description: A formation (a book name or custom:N), 11 player ids in its slot order (the goalkeeper first) and up to 7 on the bench. Every player stands in his own line (or one his other positions belong to), and may be dragged anywhere inside its band (positions); a moved slot takes the role its place gives. Every rule is checked here with an Arabic message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formation, starters, bench]
              properties:
                formation: { type: string, example: 4-3-3A }
                starters: { type: array, items: { type: integer }, minItems: 11, maxItems: 11 }
                bench: { type: array, items: { type: integer }, maxItems: 7 }
                positions:
                  type: array
                  nullable: true
                  minItems: 10
                  maxItems: 10
                  description: The ten outfield places [x, y] in slot order (the keeper apart), each inside its line's band; null for the formation's own
                  items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [team]
      summary: Back to the automatic lineup
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/formations/{number}:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    put:
      tags: [team]
      summary: Save one of my own formations (1 to 3)
      description: Ten outfield cells [row, column]; rows def, dm, am, att (the midfield has two rows), columns 1 (right) to 5 (left). Defence 3 to 6, midfield 2 to 6, attack 1 to 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cells]
              properties:
                name: { type: string, maxLength: 30 }
                cells:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items: { type: array, items: { oneOf: [{ type: string, enum: [def, dm, am, att] }, { type: integer, minimum: 1, maximum: 5 }] } }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/team/takers:
    parameters: [{ $ref: '#/components/parameters/League' }]
    put:
      tags: [team]
      summary: Choose the captain and set-piece takers
      description: 'Anyone in my squad [Sprint 27 W5]: out of the eleven, the automatic one takes the role until he is back. Null (or left out) keeps a role automatic. An empty body is "تحسين" for all four.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                captain: { type: integer, nullable: true }
                penalty: { type: integer, nullable: true }
                free_kick: { type: integer, nullable: true }
                corner: { type: integer, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/team/tactics:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: My tactics and tips
      description: Tips explain the engine's mechanisms in Arabic (docs/ENGINE.md 5); they never change a number.
      responses:
        '200': { $ref: '#/components/responses/Tactics' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [team]
      summary: Change my tactics
      description: Any of the keys; 409 from the lock (5 minutes before a match) until it ends.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TacticsSet' }
      responses:
        '200': { $ref: '#/components/responses/Tactics' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/team/scenarios:
    parameters: [{ $ref: '#/components/parameters/League' }]
    put:
      tags: [team]
      summary: Set my pre-match scenarios (up to one per kind) [X23]
      description: The whole list replaces the old one; 409 from the lock until the match ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarios]
              properties:
                scenarios: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Scenario' } }
      responses:
        '200': { $ref: '#/components/responses/Tactics' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/integrity:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: 'The integrity system for my club [X28]: my next match''s bribe, the spies on me, my proofs, a market ban'
      responses:
        '200': { $ref: '#/components/responses/Integrity' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/integrity/bribe:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [team]
      summary: Pay the referee of my next match (club money and coins), until its lock
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fixture_id], properties: { fixture_id: { type: integer } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Integrity' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/integrity/security:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [team]
      summary: A security check that shows the spies sent on me for this fixture
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fixture_id], properties: { fixture_id: { type: integer } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Integrity' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/integrity/spies/{spy}/turn:
    parameters:
      - { $ref: '#/components/parameters/League' }
      - { name: spy, in: path, required: true, schema: { type: integer } }
    post:
      tags: [team]
      summary: Turn a spy on me into a double agent (his report becomes a fake board)
      responses:
        '200': { $ref: '#/components/responses/Integrity' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/integrity/spies/{spy}/accuse:
    parameters:
      - { $ref: '#/components/parameters/League' }
      - { name: spy, in: path, required: true, schema: { type: integer } }
    post:
      tags: [team]
      summary: 'Take my spy''s proof of a bribe to the FA: a fine, a market ban, points off and a scandal'
      responses:
        '200': { $ref: '#/components/responses/Integrity' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/alliance:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: 'The league''s latest alliance tournament [X27]: its alliances, captains and rounds'
      responses:
        '200': { $ref: '#/components/responses/Alliance' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [leagues]
      summary: The owner asks for an alliance tournament; it waits for the developers' approval
      description: Two captains by username (coaches of the league), 2 to 7 coaches a side (5 by default), the first round at least an hour ahead. The others are shared out at random.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, captain_a, captain_b, size, first_round_at]
              properties:
                name: { type: string, minLength: 3, maxLength: 40 }
                captain_a: { type: string }
                captain_b: { type: string }
                size: { type: integer, minimum: 2, maximum: 7 }
                first_round_at: { type: string, format: date-time }
      responses:
        '201': { $ref: '#/components/responses/Alliance' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/alliance/ties/{tie}/decide:
    parameters:
      - { $ref: '#/components/parameters/League' }
      - { name: tie, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leagues]
      summary: A captain picks which of two of his coaches goes on (team-mates are not played)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [winner], properties: { winner: { type: integer, description: A club id of the tie } } }
      responses:
        '200': { $ref: '#/components/responses/Alliance' }
