        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/counter:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: 'Answer with my own terms: a new offer the other way'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferTerms' }
      responses:
        '201':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/scout:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The scout, its cost and time, and my searches with their players
      description: |
        Sprint 26 (docs/features/scout.md). A paid search for players from outside the league's clubs; the report comes
        after a day scaled by the season's length, as a message, coach online or not. Its three players are this club's
        alone to buy at the pool's price (POST /market/buy) until the pool is renewed. None found, the cost comes back.
      responses:
        '200':
