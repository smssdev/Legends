                      fixture_id: { type: integer }
                      match_id: { type: integer, nullable: true, description: 'Once it kicks off: watch it at GET /matches/{id}' }
                      competition: { type: string, enum: [league, cup, alliance] }
                      round: { type: integer }
                      venue: { type: string, enum: [home, away] }
                      scheduled_at: { type: string, format: date-time }
                      status: { type: string, enum: [scheduled, locked, live] }
                      referee_at: { type: string, format: date-time }
                      lock_at: { type: string, format: date-time }
                      referee: { type: string, nullable: true, enum: [lenient, medium, strict, null] }
                      morale: { type: integer, description: 'My morale for this match with my crowd and the tickets cheering me [X25]' }
                      slot: { type: integer, enum: [1, 2], description: 'The round''s first or second time slot [X31]' }
                      match_of_day: { type: boolean, description: 'The night''s big match of the round [X31]' }
                      move: { $ref: '#/components/schemas/MatchMoveView' }
                      club:
                        type: object
                        description: 'My club, for the VS card [X29]'
