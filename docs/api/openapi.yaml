                  short: { type: integer, description: The money the club lacks }
                  compensate: { type: object, nullable: true, required: [cash, coins], properties: { cash: { type: integer }, coins: { type: integer } }, description: 'With half the price in cash at least: all the cash, and coins for the rest' }
                  can: { type: boolean }
                  why: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
