  /leagues/{league}/transfers:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The transfer list, my offers in and out, and the coaches' clubs
      description: |
        Sprint 25. Trades between coaches: club money only, never the premium currency. Limits against collusion: what
        the buyer pays (money and his players' value) between 50% and 200% of what he gets; no player twice between the
        same two clubs in a season; and what one club gives the other beyond value in a season under `pair_cap`. Open
        offers die after 48 hours, or when one of their players leaves.
      responses:
        '200':
          description: The market between coaches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfers' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/listings:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: List one of my players at my price (50% of his value to his sale cap)
      description: '[Sprint 23] The cap is 250% of his value, and never more than his cost (what the club paid, or his value at the season''s start) plus the season''s profit room (sale_profit_bp_per_season of the money scale, less the profit made selling outside and what the club''s other listings ask over their cost). At most 4 listed at a time (422 beyond; a new price for one listed already is fine). Other coaches may buy him meanwhile; otherwise a buyer from outside the league takes him at that price after a wait (longer the nearer to the cap, shorter for the young and the good, and in a transfer madness), and the money comes to the club: the profit over his cost as its own line (sale_profit), as for the instant sale.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, price], properties: { player_id: { type: integer }, price: { type: integer } } }
      responses:
        '200': { description: The market between coaches, content: { application/json: { schema: { $ref: '#/components/schemas/Transfers' } } } }
