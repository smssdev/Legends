openapi: 3.1.0
info:
  title: Legends API
  version: 1.0.0
  description: |
    API for the Legends web app (and the Flutter app after v1.0). All routes are under /api/v1.
    Match events and frames are described in docs/api/match-events.md.
servers:
  - url: /api/v1
tags:
  - name: market
    description: The market (Sprints 24 and 25)
  - name: messages
    description: The inbox (Sprint 22)
  - name: auth
    description: |
      Accounts (docs/PLAN.md 2.17). The web signs in with Sanctum's session cookie: GET /sanctum/csrf-cookie first,
      then send the X-XSRF-TOKEN header. The app uses POST /auth/token or /auth/google/token and sends
      "Authorization: Bearer <token>"; tokens expire after 30 days. Sign-in attempts: 5 a minute per email, 20 per address.
  - name: data
    description: The real clubs and players (docs/PLAN.md 2.6), read-only and public. 120 requests a minute.
  - name: leagues
    description: |
      Private leagues (docs/PLAN.md 2.1, 2.3). Make one, ask to join with its 8-letter code (10 tries a minute),
      the owner approves, then take a club no coach has. Up to 4 active clubs per account, one per league.
      Errors a screen shows as they are (409): the club was taken, the limit of 4, the last quarter of the
      rounds, the settings locked since the start.
  - name: team
    description: 'My club in a league (Sprint 16): squad, lineup, own formations, set-piece takers. 403 without a club there.'
  - name: matches
    description: 'League matches (Sprint 18): played live by the server, watched with the simulator''s viewer.'
  - name: system
    description: Health and the test broadcast
  - name: simulator
    description: Development simulator (docs/MATCH_VIEW.md 8). Returns 404 unless the simulator is enabled.
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: Sends the confirmation email. The web is signed in by session; with device_name the app gets a token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, terms]
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: At least 8 characters with letters and numbers }
                terms: { type: boolean, description: Must be true }
                device_name: { type: string, maxLength: 100, description: The device name }
      responses:
        '201': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in on the web (session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                remember: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out on the web
      responses:
        '200': { description: Done }
  /auth/token:
    post:
      tags: [auth]
      summary: Sign in from the app (a token that expires)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100, description: The device name }
      responses:
        '200': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: Sign out from the app (revokes this token)
      responses:
        '200': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
  /auth/google/token:
    post:
      tags: [auth]
      summary: Sign in from the app with Google Sign-In
      description: The app sends the id_token from Google. Linked to an existing account only when Google says the email is verified; an account whose email was never confirmed loses its password, tokens and sessions first. The web signs in with Google at GET /auth/google/redirect (outside /api/v1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device_name]
              properties:
                id_token: { type: string }
                device_name: { type: string, maxLength: 100, description: The device name }
      responses:
        '200': { $ref: '#/components/responses/AccountToken' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Email a link to choose a new password
      description: The same answer whether or not the email has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Sent if the email has an account }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Choose a new password with the emailed token
      description: Signs the account out everywhere and confirms its email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: At least 8 characters with letters and numbers }
      responses:
        '200': { description: Done }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in account
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [auth]
      summary: Change the name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [auth]
      summary: Delete the account
      description: Asks for the password, or for an account without one (Google only) its email in confirm. Its teams go back to the bots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                confirm: { type: string, description: The email of an account without a password }
      responses:
        '200': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/password:
    put:
      tags: [auth]
      summary: Change the password, or set the first one for a Google-only account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                current_password: { type: string, description: Required when the account has a password }
                password: { type: string, minLength: 8, description: At least 8 characters with letters and numbers }
      responses:
        '200': { $ref: '#/components/responses/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: Send the confirmation email again (3 a minute)
      responses:
        '202': { description: Done }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /data/templates:
    get:
      tags: [data]
      summary: The leagues a new league can copy, strongest first
      security: []
      responses:
        '200':
          description: Templates of the latest data version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_version: { type: string }
                  templates:
                    type: array
                    items:
                      type: object
                      required: [name, clubs, top_strength_cp, avg_strength_cp]
                      properties:
                        name: { type: string }
                        clubs: { type: integer }
                        top_strength_cp: { type: integer, description: The strongest club, in hundredths (8480 = 84.8) }
                        avg_strength_cp: { type: integer }
  /data/clubs:
    get:
      tags: [data]
      summary: The clubs of one template, strongest first
      security: []
      parameters:
        - { name: league, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Clubs
          content:
            application/json:
              schema:
                type: object
                properties:
                  league: { type: string }
                  clubs: { type: array, items: { $ref: '#/components/schemas/DataClub' } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /data/clubs/{club}:
    get:
      tags: [data]
      summary: A club and its whole squad, with potential and value
      security: []
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The club
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/DataClub' }
                  - type: object
                    required: [squad_value, players]
                    properties:
                      squad_value: { type: integer, description: Club money }
                      players: { type: array, items: { $ref: '#/components/schemas/DataPlayer' } }
        '404': { $ref: '#/components/responses/Error' }
  /data/clubs/{club}/crest.svg:
    get:
      tags: [data]
      summary: The club's generated badge (SVG)
      description: No real logos; a shape, a pattern and the club's letters in its colours, the same everywhere. Cached for a week, with an ETag.
      security: []
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The badge
          content:
            image/svg+xml:
              schema: { type: string }
        '304': { description: Not changed }
        '404': { $ref: '#/components/responses/Error' }
  /data/formations:
    get:
      tags: [data]
      summary: The 24 formations
      security: []
      responses:
        '200':
          description: Every formation with its slots, and the limits of a custom one
          content:
            application/json:
              schema:
                type: object
                required: [formations, limits]
                properties:
                  formations: { type: array, items: { $ref: '#/components/schemas/Formation' } }
                  limits: { type: object, additionalProperties: { type: array, items: { type: integer } } }
                  grid: { type: object }
  /health:
    get:
      tags: [system]
      summary: The API's version, the oldest app it still serves, and the game time
      description: The app compares its own version with min_app_version and asks the player to update when it is older.
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version, min_app_version, engine_version, time, clock_offset, broadcast]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: 0.1.0 }
                  min_app_version: { type: string, example: 1.0.0 }
                  engine_version: { type: integer }
                  time: { type: string, format: date-time, description: The game time (GameClock) in UTC }
                  clock_offset: { type: integer, description: Seconds the game clock is ahead of real time (clock:travel, development only; 0 in production) }
                  broadcast:
                    type: object
                    description: Where the test event of POST /health/ping arrives
                    properties:
                      channel: { type: string, example: system }
                      event: { type: string, example: ping }
  /health/ping:
    post:
      tags: [system]
      summary: Broadcast the test event
      description: Sends "ping" on the public "system" channel, so a screen can check live broadcasting end to end. 10 a minute.
      responses:
        '202':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  at: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/Error' }
  /leagues:
    get:
      tags: [leagues]
      summary: My leagues
      description: The leagues I made, coach in, or asked to join (and was not turned down).
      responses:
        '200':
          description: My leagues
          content:
            application/json:
              schema:
                type: object
                required: [leagues, active_teams, max_active_teams]
                properties:
                  leagues: { type: array, items: { $ref: '#/components/schemas/League' } }
                  active_teams: { type: integer }
                  max_active_teams: { type: integer, example: 4 }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [leagues]
      summary: Make a league
      description: |
        Copies the strongest team_count clubs of the template with their players, funds each with the starting
        budget, and gives the owner the club they chose. Every other club is a bot. 10 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, team_count, rounds_per_day, round_times, prep_days, season_end_mode, starts_at, club_id]
              properties:
                name: { type: string, maxLength: 60, nullable: true, description: 'Empty: the template and the code, like "Premier League #K7F2QX9M"' }
                template: { type: string, description: A name from GET /data/templates }
                team_count: { type: integer, minimum: 4, maximum: 20 }
                rounds_per_day: { type: integer, minimum: 1, maximum: 2 }
                round_times: { type: array, items: { type: string, example: '21:00' }, description: One HH:MM per round, Cairo time }
                prep_days: { type: integer, minimum: 1, maximum: 3 }
                season_end_mode: { type: string, enum: [renew, end] }
                starts_at: { type: string, format: date-time, description: From now up to 7 days }
                starting_budget: { type: integer, minimum: 1000000, maximum: 10000000, default: 3000000 }
                fair_league: { type: boolean, default: false, description: Locks spending coins inside this league }
                is_dev: { type: boolean, description: Development league; ignored in production }
                club_id: { type: integer, description: The owner's club, a master club id among the strongest team_count }
      responses:
        '201': { $ref: '#/components/responses/League' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /leagues/join:
    post:
      tags: [leagues]
      summary: Ask to join with a code
      description: Spaces, a "#" and lower case are forgiven. Asking again returns the same request (200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: K7F2QX9M }
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '201': { $ref: '#/components/responses/JoinRequest' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /leagues/{league}:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: One league
      description: For its owner, its coaches, and who asked to join. Anyone else gets 404.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [leagues]
      summary: Change the settings before the start
      description: The owner only, until the league starts (409 after). rounds_per_day and round_times go together. The team count, template and budget are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, nullable: true }
                rounds_per_day: { type: integer, minimum: 1, maximum: 2 }
                round_times: { type: array, items: { type: string } }
                prep_days: { type: integer, minimum: 1, maximum: 3 }
                season_end_mode: { type: string, enum: [renew, end] }
                starts_at: { type: string, format: date-time }
                fair_league: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/start:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [leagues]
      summary: Start now (development only)
      description: The owner's "start now" button. 404 in production; there the scheduler starts each league at its time.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/request:
    parameters: [{ $ref: '#/components/parameters/League' }]
    delete:
      tags: [leagues]
      summary: Take back my waiting request
      responses:
        '200': { description: Cancelled }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/vacation:
    parameters: [{ $ref: '#/components/parameters/League' }]
    post:
      tags: [leagues]
      summary: Start a holiday
      description: 1 to 7 days, once a season. Absence is not counted meanwhile (docs/PLAN.md 2.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 7 }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [leagues]
      summary: Come back early
      description: The holiday ends now and still counts as this season's one.
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/members/{membership}/kick:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: membership, in: path, required: true, schema: { type: integer } }
    post:
      tags: [leagues]
      summary: Send a coach away (owner)
      description: The reason shows to every member. The club goes back to a bot as it is; the coach cannot come back this season.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/League' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/requests:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: Join requests (owner)
      description: Waiting ones first. A request never expires; it waits for the owner.
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/requests/{request}/approve:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/JoinRequest' }]
    post:
      tags: [leagues]
      summary: Approve a request (owner)
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/requests/{request}/reject:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/JoinRequest' }]
    post:
      tags: [leagues]
      summary: Reject a request (owner)
      responses:
        '200': { $ref: '#/components/responses/JoinRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/fixtures:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The season's calendar
      description: Every league round (with the rest, is_bye, when the count is odd) and cup tie, by time. Times are UTC; screens show the device's time (docs/PLAN.md 2.4).
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema:
                type: object
                required: [season, fixtures]
                properties:
                  season: { $ref: '#/components/schemas/SeasonCalendar' }
                  fixtures: { type: array, items: { $ref: '#/components/schemas/Fixture' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/standings:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The league table
      responses:
        '200':
          description: The table, first place first
          content:
            application/json:
              schema:
                type: object
                required: [season, table]
                properties:
                  season: { $ref: '#/components/schemas/SeasonCalendar' }
                  next_round: { type: integer, nullable: true }
                  table:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FixtureClub'
                        - type: object
                          required: [position, played, won, drawn, lost, goals_for, goals_against, goal_difference, points, rests_next]
                          properties:
                            position: { type: integer }
                            played: { type: integer }
                            won: { type: integer }
                            drawn: { type: integer }
                            lost: { type: integer }
                            goals_for: { type: integer }
                            goals_against: { type: integer }
                            goal_difference: { type: integer }
                            points: { type: integer }
                            rests_next: { type: boolean, description: Rests in the next round (odd team count) }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/cup:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: The cup's bracket
      description: Stage by stage (preliminary, r16, qf, sf, final), each on its own day. Sides fill in as winners move on (docs/PLAN.md 2.5).
      responses:
        '200':
          description: The bracket
          content:
            application/json:
              schema:
                type: object
                required: [stages]
                properties:
                  stages:
                    type: array
                    items:
                      type: object
                      required: [stage, scheduled_at, ties]
                      properties:
                        stage: { type: string, enum: [preliminary, r16, qf, sf, final] }
                        scheduled_at: { type: string, format: date-time }
                        ties:
                          type: array
                          items:
                            type: object
                            required: [id, slot, status]
                            properties:
                              id: { type: integer }
                              slot: { type: integer }
                              home: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
                              away: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
                              winner_id: { type: integer, nullable: true }
                              status: { type: string }
                              home_goals: { type: integer, nullable: true }
                              away_goals: { type: integer, nullable: true }
                              next: { type: object, nullable: true, required: [slot, side], properties: { slot: { type: integer }, side: { type: string, enum: [home, away] } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: My club, its squad and its team sheet
      description: 403 without a club in this league.
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/suggestion:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: '"تحسين": the best lineup now (not saved)'
      responses:
        '200':
          description: The suggested lineup
          content:
            application/json:
              schema:
                type: object
                required: [lineup]
                properties:
                  lineup: { $ref: '#/components/schemas/Lineup' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/lineup:
    parameters: [{ $ref: '#/components/parameters/League' }]
    put:
      tags: [team]
      summary: Save my lineup
      description: A formation (a book name or custom:N), 11 player ids in its slot order (the goalkeeper first) and up to 7 on the bench. Every rule is checked here with an Arabic message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formation, starters, bench]
              properties:
                formation: { type: string, example: 4-3-3A }
                starters: { type: array, items: { type: integer }, minItems: 11, maxItems: 11 }
                bench: { type: array, items: { type: integer }, maxItems: 7 }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [team]
      summary: Back to the automatic lineup
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/formations/{number}:
    parameters:
      - $ref: '#/components/parameters/League'
      - { name: number, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    put:
      tags: [team]
      summary: Save one of my own formations (1 to 3)
      description: Ten outfield cells [row, column]; rows def, dm, am, att (the midfield has two rows), columns 1 (right) to 5 (left). Defence 3 to 6, midfield 2 to 6, attack 1 to 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cells]
              properties:
                name: { type: string, maxLength: 30 }
                cells:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items: { type: array, items: { oneOf: [{ type: string, enum: [def, dm, am, att] }, { type: integer, minimum: 1, maximum: 5 }] } }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/team/takers:
    parameters: [{ $ref: '#/components/parameters/League' }]
    put:
      tags: [team]
      summary: Choose the captain and set-piece takers
      description: Starters only; null (or left out) keeps a role automatic. An empty body is "تحسين" for all four.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                captain: { type: integer, nullable: true }
                penalty: { type: integer, nullable: true }
                free_kick: { type: integer, nullable: true }
                corner: { type: integer, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/team/tactics:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: My tactics and tips
      description: Tips explain the engine's mechanisms in Arabic (docs/ENGINE.md 5); they never change a number.
      responses:
        '200': { $ref: '#/components/responses/Tactics' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [team]
      summary: Change my tactics
      description: Any of the keys; 409 from the lock (5 minutes before a match) until it ends.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TacticsSet' }
      responses:
        '200': { $ref: '#/components/responses/Tactics' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leagues/{league}/market:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The market, the pool or the bot clubs, and my players with what the pool pays
      description: |
        Sprint 24. Open from the league's creation until its last quarter (`closed` says why when it is shut). The pool,
        about 300 players from outside the league's clubs renewed in each window, sells at 100% of the value; a bot club
        sells at a fixed 125% and keeps 18 players and 2 keepers; the pool buys back at 70% of the value without training.
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [pool, bots], default: pool } }
        - { name: line, in: query, schema: { type: string, enum: [gk, def, mid, att] } }
        - { name: q, in: query, schema: { type: string }, description: Part of a name }
        - { name: club, in: query, schema: { type: integer }, description: One bot club }
        - { name: max_price, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The market
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Market' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/market/buy:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Buy a player from the pool or a bot club
      description: The same idempotency_key again changes nothing. Two coaches at the same player at once, one gets him.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, idempotency_key], properties: { player_id: { type: integer }, idempotency_key: { type: string, maxLength: 64 } } }
      responses:
        '200':
          description: Bought
          content:
            application/json:
              schema: { type: object, required: [balance], properties: { balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/market/sell:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Sell one of my players to the pool (never below 16 players or 2 keepers)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, idempotency_key], properties: { player_id: { type: integer }, idempotency_key: { type: string, maxLength: 64 } } }
      responses:
        '200':
          description: Sold
          content:
            application/json:
              schema: { type: object, required: [balance], properties: { balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The transfer list, my offers in and out, and the coaches' clubs
      description: |
        Sprint 25. Trades between coaches: club money only, never the premium currency. Limits against collusion: what
        the buyer pays (money and his players' value) between 50% and 200% of what he gets; no player twice between the
        same two clubs in a season; and what one club gives the other beyond value in a season under `pair_cap`. Open
        offers die after 48 hours, or when one of their players leaves.
      responses:
        '200':
          description: The market between coaches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfers' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/listings:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: List one of my players at my price (50% to 200% of his value)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [player_id, price], properties: { player_id: { type: integer }, price: { type: integer } } }
      responses:
        '200': { description: The market between coaches, content: { application/json: { schema: { $ref: '#/components/schemas/Transfers' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/listings/{player}:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: player, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [market]
      summary: Take my player off the list
      responses:
        '200': { description: The market between coaches, content: { application/json: { schema: { $ref: '#/components/schemas/Transfers' } } } }
  /leagues/{league}/transfers/offers:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Offer another coach money, my players or both for his players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OfferTerms'
                - { type: object, required: [to_club_id], properties: { to_club_id: { type: integer } } }
      responses:
        '201':
          description: The offer
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/accept:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: 'Accept (the other coach): everything moves now, or nothing'
      responses:
        '200':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/reject:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Reject (the other coach)
      responses:
        '200':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/cancel:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: Take it back (the coach who offered)
      responses:
        '200':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/transfers/offers/{offer}/counter:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }, { name: offer, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [market]
      summary: 'Answer with my own terms: a new offer the other way'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferTerms' }
      responses:
        '201':
          description: The offer after it
          content:
            application/json:
              schema: { type: object, required: [offer], properties: { offer: { $ref: '#/components/schemas/TransferOffer' }, balance: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/scout:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [market]
      summary: The scout, its cost and time, and my searches with their players
      description: |
        Sprint 26 (docs/features/scout.md). A paid search for players from outside the league's clubs; the report comes
        after a day scaled by the season's length, as a message, coach online or not. Its three players are this club's
        alone to buy at the pool's price (POST /market/buy) until the pool is renewed. None found, the cost comes back.
      responses:
        '200':
          description: The scout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoutView' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [market]
      summary: Ask the scout (one search at a time)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_overall, idempotency_key]
              properties:
                line: { type: string, enum: [gk, def, mid, att] }
                position: { type: string }
                min_overall: { type: integer, minimum: 40, maximum: 99 }
                max_overall: { type: integer, minimum: 40, maximum: 99 }
                max_age: { type: integer }
                nationality: { type: string }
                league: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The scout after asking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoutView' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/stadium:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [team]
      summary: The stadium, its three sections with their stages and effects, and the part being built
      description: |
        Sprint 29 (PLAN 2.9). Seats, pitch and training: three stages of five parts each. The coach starts each part and
        pays for it; it is done in 18 hours scaled by the season's length, coach online or not. One part at a time.
      responses:
        '200':
          description: The stadium
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StadiumView' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [team]
      summary: Start the next part of a section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, idempotency_key]
              properties:
                section: { type: string, enum: [seats, pitch, training] }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The stadium after starting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StadiumView' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/training:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [team]
      summary: Training, its four slots with their bars and next session, and my players
      description: |
        Sprint 27 (PLAN 2.8). One player of each line trains at a time. Every session (8 hours scaled by the season's
        length) costs club money and moves his bar by a random step, coach online or not; at 100% his rating and
        attributes go up by one and the slot empties. No training past his potential. Due sessions run before the answer.
      responses:
        '200':
          description: Training
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingView' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [team]
      summary: Put a player in his line's slot (in place of whoever is there)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_id]
              properties:
                player_id: { type: integer }
      responses:
        '200':
          description: Training after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/training/camp:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [team]
      summary: Send players to the training camp (docs/features/camp.md)
      description: Paid in full when they go. They miss the club's matches until they come back, and train at the level's pace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_ids, level, days, idempotency_key]
              properties:
                player_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 5 }
                level: { type: string, enum: [basic, good, elite] }
                days: { type: integer, minimum: 1, maximum: 3 }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Training after sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/training/secret:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [team]
      summary: Order secret training of one line for the next match (docs/features/secret-training.md)
      description: Until the lock. The line plays that match only with +3 on the rating and every attribute. Never shown to the opponent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string, enum: [gk, def, mid, att] }
      responses:
        '200':
          description: Training after ordering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingView' }
        '409': { $ref: '#/components/responses/Error' }
  /leagues/{league}/training/{line}:
    parameters:
      - { name: league, in: path, required: true, schema: { type: integer } }
      - { name: line, in: path, required: true, schema: { type: string, enum: [gk, def, mid, att] } }
    delete:
      tags: [team]
      summary: Empty a slot (the player keeps his bar)
      responses:
        '200':
          description: Training after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingView' }
  /leagues/{league}/team/finance:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [team]
      summary: My club's money
      description: |
        Sprint 23. The balance (the sum of the movements, never edited), whether the club can spend (not below zero),
        the league rounds in a row below zero and the limit before the dearest player is sold to the pool, the wages
        of a round, the season's totals by kind, the income and expenses of each league round, the last 60 movements
        (a match's ones carry its round, or `cup`), the stadium's gate (seats, attendance, seat price) and each
        sector's sponsor (chosen, or the three offers with what each pays per home match and on a home win).
      responses:
        '200':
          description: The finances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubFinance' }
        '403': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/sponsors:
    parameters: [{ name: league, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [team]
      summary: Sign a sector's sponsor for the season (once per sector)
      description: A sector left unchosen signs the steady sponsor at the club's first home match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector, offer]
              properties:
                sector: { type: string, enum: [main, opposite, north, south] }
                offer: { type: string, enum: [steady, bonus, ambitious] }
      responses:
        '200':
          description: The finances after signing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubFinance' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /leagues/{league}/team/next-match:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [team]
      summary: My next match
      description: |
        When and where, the referee once drawn (30 minutes before), and the opponent. After the lock (5 minutes
        before) the opponent's eleven, formation and only four tactics: tackling, marking, plan and trap.
        Pressing, style, tempo, positions and the defensive shape are never sent (docs/PLAN.md 2.13).
      responses:
        '200':
          description: The next match, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    nullable: true
                    required: [fixture_id, competition, round, venue, scheduled_at, status, referee_at, lock_at, opponent]
                    properties:
                      fixture_id: { type: integer }
                      match_id: { type: integer, nullable: true, description: 'Once it kicks off: watch it at GET /matches/{id}' }
                      competition: { type: string, enum: [league, cup] }
                      round: { type: integer }
                      venue: { type: string, enum: [home, away] }
                      scheduled_at: { type: string, format: date-time }
                      status: { type: string, enum: [scheduled, locked, live] }
                      referee_at: { type: string, format: date-time }
                      lock_at: { type: string, format: date-time }
                      referee: { type: string, nullable: true, enum: [lenient, medium, strict, null] }
                      opponent:
                        type: object
                        required: [id, name, code, strength_cp, crest_url]
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          code: { type: string }
                          strength_cp: { type: integer }
                          crest_url: { type: string }
                          coach: { type: string, nullable: true }
                          sheet:
                            type: object
                            nullable: true
                            description: Only after the lock
                            required: [formation, starters, tactics]
                            properties:
                              formation: { type: string }
                              starters: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string, nullable: true } } } }
                              tactics: { $ref: '#/components/schemas/PublicTactics' }
                      mine:
                        type: object
                        nullable: true
                        description: My frozen sheet after the lock, with who came in for whom
                        properties:
                          formation: { type: string }
                          starters: { type: array, items: { type: integer } }
                          bench: { type: array, items: { type: integer } }
                          tactics: { $ref: '#/components/schemas/TacticsSet' }
                          fixes: { type: array, items: { type: object, properties: { slot: { type: integer }, out: { type: integer, nullable: true }, in: { type: integer }, out_name: { type: string, nullable: true }, in_name: { type: string, nullable: true } } } }
        '403': { $ref: '#/components/responses/Error' }
  /matches/{match}:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: A league match for the viewer
      description: The same shape as the simulator's live match (docs/api/match-events.md). The league's members only (404 otherwise). Each side's tactics reach only its own coach (`you`).
      responses:
        '200': { description: The match, its clubs, teams (tactics only for your side) and the slots of both formations }
        '404': { $ref: '#/components/responses/Error' }
  /matches/{match}/live:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: The minutes made after `since`, with their frames
      description: |
        The server keeps the clock (each minute carries `at`, its start in server ms); minutes are announced on the private
        channel `match.{id}` (event `minute`) and fetched here. No hidden tactics of either side, except your own. Every
        event carries its Arabic commentary line in `text` (the same for everyone). After a gap (the last 20 minutes are
        kept whole), `missed` gives the events of the minutes in between, so nothing is lost. `readings` is the
        assistant's notes to you, the coach (also sent on `club.{id}`, event `reading`); other members get none.
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Like the simulator's live sync, with the missed minutes and your readings
          content:
            application/json:
              schema:
                type: object
                required: [started, finished, tick, server_now, next_at, gap, missed, ticks, readings]
                properties:
                  started: { type: boolean }
                  finished: { type: boolean }
                  tick: { type: integer }
                  server_now: { type: integer }
                  next_at: { type: integer, nullable: true }
                  gap: { type: boolean }
                  missed:
                    type: array
                    items:
                      type: object
                      required: [tick, minute, events]
                      properties:
                        tick: { type: integer }
                        minute: { type: integer, description: The minute as shown (45+2 is 47) }
                        events: { type: array, items: { type: object, additionalProperties: true } }
                  ticks: { type: array, items: { type: object, additionalProperties: true } }
                  readings: { type: array, items: { $ref: '#/components/schemas/MatchReading' } }
                  reactions: { type: array, items: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/Error' }
  /matches/{match}/report:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: Why you won or lost, for a coach of either side
      description: |
        Built when the match ends, from the public events and your own side only: it never reads the other side's hidden
        tactics. The top reasons with their numbers, one thing to improve, the assistant's verdict, the man of the match,
        the ratings, the stats, the thirds and the momentum, the timeline, and the readings he gave you during the match.
      responses:
        '200':
          description: Your report
          content:
            application/json:
              schema:
                type: object
                required: [side, result, score, reasons, verdict, ratings, stats, timeline, readings]
                properties:
                  side: { type: string, enum: [home, away] }
                  result: { type: string, enum: [win, draw, loss] }
                  score: { type: object, additionalProperties: { type: integer } }
                  shootout: { type: object, nullable: true, additionalProperties: { type: integer } }
                  reasons: { type: array, items: { type: object, additionalProperties: true } }
                  improve: { type: object, nullable: true, additionalProperties: true }
                  verdict: { type: array, items: { type: object, additionalProperties: true } }
                  man_of_the_match: { type: object, nullable: true, additionalProperties: true }
                  ratings: { type: object, additionalProperties: true }
                  stats: { type: object, additionalProperties: true }
                  thirds: { type: array, items: { type: integer } }
                  momentum: { type: array, items: { type: integer } }
                  timeline: { type: array, items: { type: object, additionalProperties: true } }
                  readings: { type: array, items: { $ref: '#/components/schemas/MatchReading' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /matches/{match}/actions:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [matches]
      summary: An order from a side's coach while the match is played
      description: |
        A substitution, tactics, or a formation (the 24 or one of the coach's own, `custom:N`). It goes into the next minute
        not yet made (`target_tick`); one that arrives while a minute is being made goes in the one after. The engine checks
        it there, and a rejected order comes back in that minute's `rejected` for its own coach only. The same
        `idempotency_key` again changes nothing (200, `duplicate`). While the coach's screen is away, his assistant manages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, idempotency_key]
              properties:
                type: { type: string, enum: [sub, tactics, formation] }
                out: { type: integer, description: The player going off (sub) }
                in: { type: integer, description: The player coming on (sub) }
                tactics: { type: object, additionalProperties: true, description: The tactics that change (the engine's keys) }
                formation: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchOrderResult' }
        '200':
          description: This key was given already
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchOrderResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /matches/{match}/replay:
    parameters: [{ name: match, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [matches]
      summary: A finished match again
      description: Every minute with its frames, from the seed, the starting state and the orders, while the engine is the same version (`replayable`); a match from an older engine gives its stored events instead. Tactics only for your own side.
      responses:
        '200':
          description: The minutes, or the events
          content:
            application/json:
              schema:
                type: object
                required: [replayable, ticks, events]
                properties:
                  replayable: { type: boolean }
                  ticks: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
                  events: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /matches/live:
    get:
      tags: [matches]
      summary: My matches being played now, in every league
      description: For the viewer's switcher when a coach has more than one live match.
      responses:
        '200':
          description: The live matches of my clubs
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [id, home, away, competition]
                      properties:
                        id: { type: integer }
                        home: { type: string, description: The home club's code }
                        away: { type: string }
                        competition: { type: string, enum: [league, cup] }
  /leagues/{league}/clubs:
    parameters: [{ $ref: '#/components/parameters/League' }]
    get:
      tags: [leagues]
      summary: Every club of the league
      description: For the owner and approved coaches. Clubs with a coach show as taken (bot false).
      responses:
        '200':
          description: The clubs, strongest first
          content:
            application/json:
              schema:
                type: object
                required: [clubs]
                properties:
                  clubs: { type: array, items: { $ref: '#/components/schemas/LeagueClub' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/clubs/{club}:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/Club' }]
    get:
      tags: [leagues]
      summary: One club with its squad
      responses:
        '200':
          description: The club and its players
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LeagueClub'
                  - type: object
                    required: [players]
                    properties:
                      players: { type: array, items: { $ref: '#/components/schemas/LeaguePlayer' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /leagues/{league}/clubs/{club}/claim:
    parameters: [{ $ref: '#/components/parameters/League' }, { $ref: '#/components/parameters/Club' }]
    post:
      tags: [leagues]
      summary: Take a club no coach has
      description: |
        One conditional update: of many coaches at once exactly one gets it, the others get 409 "الفريق أُخذ" and
        go back to the list. Its money is brought between 500,000 and the starting budget.
      responses:
        '201':
          description: The club is mine
          content:
            application/json:
              schema:
                type: object
                properties:
                  club: { $ref: '#/components/schemas/LeagueClub' }
                  joined_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /messages:
    get:
      tags: [messages]
      summary: The account's messages, newest first
      description: |
        What the game tells the coach (Sprint 22): the referee before his match, the absence warning, leaving for absence,
        a kick and its reason, a join request (to the owner) and its answer, a match report ready. The words (title, body)
        and where it leads (link, a web path) are made on the server, so the app shows the same. A new message also
        arrives on the private channel `App.Models.User.{id}` (event `message`, with `unread`), and reads made on another
        screen on the same channel (event `messages-read`, with `ids` and `unread`).
      parameters:
        - { name: before, in: query, schema: { type: integer }, description: Messages older than this id (the next page) }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 50 } }
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, more, unread]
                properties:
                  messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  more: { type: boolean }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
  /messages/unread:
    get:
      tags: [messages]
      summary: How many messages are unread (the badge)
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema: { type: object, required: [unread], properties: { unread: { type: integer } } }
  /messages/{message}/read:
    parameters: [{ name: message, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [messages]
      summary: Mark one message read (on every screen of the account)
      responses:
        '200':
          description: Read
          content:
            application/json:
              schema: { type: object, required: [unread], properties: { unread: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
  /messages/read-all:
    post:
      tags: [messages]
      summary: Mark every message read
      responses:
        '200':
          description: Read
          content:
            application/json:
              schema: { type: object, required: [read, unread], properties: { read: { type: integer }, unread: { type: integer } } }
  /sim/leagues:
    get:
      tags: [simulator]
      summary: Leagues with club counts
      responses:
        '200':
          description: Leagues ordered by their strongest club
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    clubs: { type: integer }
                    top: { type: integer, description: Strongest club strength in hundredths }
  /sim/clubs:
    get:
      tags: [simulator]
      summary: Search clubs
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: league, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Up to 60 clubs, strongest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubSummary' }
  /sim/clubs/{club}:
    get:
      tags: [simulator]
      summary: A club's squad with the automatic best eleven
      parameters:
        - { name: club, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Squad, formation, starters and bench
          content:
            application/json:
              schema:
                type: object
                properties:
                  club: { type: object }
                  formation: { type: string }
                  starters: { type: array, items: { type: integer } }
                  bench: { type: array, items: { type: integer } }
                  players: { type: array, items: { type: object } }
  /sim/matches:
    post:
      tags: [simulator]
      summary: Create a simulator match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [home_id, away_id]
              properties:
                home_id: { type: integer }
                away_id: { type: integer }
                seed: { type: integer, minimum: 1 }
                competition: { type: string, enum: [league, cup] }
                referee: { type: integer, enum: [0, 1, 2], description: 0 soft, 1 medium, 2 strict }
                venue: { type: string, enum: [home, neutral] }
                mode: { type: string, enum: [solo, live], description: 'solo: the client drives the clock. live: two devices, the server keeps the clock and both coaches are "me".' }
                control:
                  type: object
                  properties:
                    home: { type: string, enum: [me, cpu] }
                    away: { type: string, enum: [me, cpu] }
                home: { $ref: '#/components/schemas/TeamSetup' }
                away: { $ref: '#/components/schemas/TeamSetup' }
      responses:
        '201':
          description: The match as the screen needs it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchView' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/matches/{match}:
    get:
      tags: [simulator]
      summary: Current match view
      parameters: [{ $ref: '#/components/parameters/Match' }]
      responses:
        '200':
          description: Match view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchView' }
  /sim/matches/{match}/actions:
    post:
      tags: [simulator]
      summary: Queue a coach order for the next minute. In a live match only the seat of that team may order (403 otherwise)
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, team, idempotency_key]
              properties:
                type: { type: string, enum: [sub, tactics, formation] }
                team: { type: string, enum: [home, away] }
                out: { type: integer, description: Player leaving (sub) }
                in: { type: integer, description: Player coming on (sub) }
                tactics: { $ref: '#/components/schemas/Tactics' }
                formation: { type: string }
                idempotency_key: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_tick: { type: integer }
                  duplicate: { type: boolean }
        '200': { description: Same idempotency key seen before; nothing queued }
        '409': { description: The match has finished }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/matches/{match}/ticks:
    post:
      tags: [simulator]
      summary: Simulate the next minute(s)
      parameters: [{ $ref: '#/components/parameters/Match' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 200, default: 1 }
      responses:
        '409': { description: Live match; the server keeps the clock }
        '200':
          description: One entry per simulated minute (docs/api/match-events.md)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticks: { type: array, items: { type: object } }
  /sim/matches/{match}/start:
    post:
      tags: [simulator]
      summary: Start a live match (kick-off 30 s later, game.match.kickoff_ms); either coach's seat, 403 without one
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      responses:
        '200':
          description: Same body as /live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSync' }
        '409': { description: Not a live match }
  /sim/matches/{match}/live:
    get:
      tags: [simulator]
      summary: Live match poll. Simulates the minutes due by the server clock, returns those after `since`
      parameters:
        - { $ref: '#/components/parameters/Match' }
        - { name: since, in: query, schema: { type: integer, minimum: 0 }, description: Last minute this screen has shown }
        - { $ref: '#/components/parameters/Seat' }
      responses:
        '200':
          description: New minutes with their frames (the last 20 are kept). The other side's tactics are null and its orders carry no tactics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSync' }
        '409': { description: Not a live match }
  /sim/matches/{match}/reactions:
    post:
      tags: [simulator]
      summary: A coach's reaction in a live match (an emoji or a short word); both screens get it on their next /live
      parameters: [{ $ref: '#/components/parameters/Match' }, { $ref: '#/components/parameters/Seat' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, enum: [fire, clap, wow, laugh, angry, pray, unlucky, coming, easy, focus] }
      responses:
        '201': { description: The reaction, content: { application/json: { schema: { $ref: '#/components/schemas/Reaction' } } } }
        '403': { description: No seat }
        '409': { description: Not a live match }
        '422': { description: Unknown key, or too soon after this coach's last one (game.match.reaction_gap_ms) }
  /sim/matches/{match}/report:
    get:
      tags: [simulator]
      summary: Post-match report from one side's view
      parameters:
        - { $ref: '#/components/parameters/Match' }
        - { name: side, in: query, schema: { type: string, enum: [home, away] } }
      responses:
        '200': { description: Reasons, verdict, man of the match, ratings, stats, thirds, momentum, timeline }
        '409': { description: The match has not finished }
  /sim/rooms:
    post:
      tags: [simulator]
      summary: Open a room for a match between two friends (the host picks a name and a club)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, club_id]
              properties:
                name: { type: string, minLength: 2, maxLength: 24 }
                club_id: { type: integer }
      responses:
        '201': { description: The room, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sim/rooms/{room}:
    get:
      tags: [simulator]
      summary: Room status; the host polls it until match_id appears
      parameters: [{ $ref: '#/components/parameters/Room' }]
      responses:
        '200': { description: The room, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
  /sim/rooms/{room}/join:
    post:
      tags: [simulator]
      summary: The friend joins with a name and another club; the live match is made and kicks off 30 s later (game.match.kickoff_ms)
      parameters: [{ $ref: '#/components/parameters/Room' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, club_id]
              properties:
                name: { type: string, minLength: 2, maxLength: 24 }
                club_id: { type: integer, description: Not the host's club }
      responses:
        '200': { description: The room with match_id (the guest manages away), content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '422': { description: Same club as the host, or someone already joined, content: { application/json: { schema: { type: object } } } }
components:
  parameters:
    League:
      name: league
      in: path
      required: true
      schema: { type: integer }
    JoinRequest:
      name: request
      in: path
      required: true
      schema: { type: integer }
    Club:
      name: club
      in: path
      required: true
      schema: { type: integer }
    Match:
      name: match
      in: path
      required: true
      schema: { type: string, description: ULID }
    Room:
      name: room
      in: path
      required: true
      schema: { type: string, description: ULID }
    Seat:
      name: X-Seat
      in: header
      schema: { type: string }
      description: A live match's secret seat (from POST /sim/rooms, /join, or the seats of a live POST /sim/matches). It names the side this device manages.
  securitySchemes:
    session: { type: apiKey, in: cookie, name: legends-session, description: 'The web: Sanctum session cookie, with X-XSRF-TOKEN' }
    token: { type: http, scheme: bearer, description: 'The app: a token from /auth/token or /auth/google/token' }
  responses:
    Tactics:
      description: My tactics, the tips, and the next referee once drawn
      content:
        application/json:
          schema:
            type: object
            required: [tactics, tips]
            properties:
              tactics: { $ref: '#/components/schemas/TacticsSet' }
              tips: { type: array, items: { type: string } }
              referee: { type: string, nullable: true, enum: [lenient, medium, strict, null] }
    Team:
      description: My club and its team sheet
      content:
        application/json:
          schema:
            type: object
            required: [club, squad_value, players, lineup, takers, custom_formations]
            properties:
              club:
                type: object
                required: [id, name, code, strength_cp, balance, crest_url]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  code: { type: string }
                  strength_cp: { type: integer }
                  balance: { type: integer }
                  crest_url: { type: string }
              squad_value: { type: integer }
              players: { type: array, items: { $ref: '#/components/schemas/SquadPlayer' } }
              lineup: { $ref: '#/components/schemas/Lineup' }
              takers:
                type: object
                description: captain, penalty, free_kick, corner
                additionalProperties:
                  type: object
                  required: [auto]
                  properties:
                    player_id: { type: integer, nullable: true }
                    auto: { type: boolean }
              custom_formations:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Formation'
                    - type: object
                      required: [number, cells]
                      properties:
                        number: { type: integer }
                        cells: { type: array, items: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } } }
    League:
      description: The league
      content:
        application/json:
          schema:
            type: object
            required: [league]
            properties:
              league: { $ref: '#/components/schemas/League' }
    JoinRequest:
      description: The join request
      content:
        application/json:
          schema:
            type: object
            required: [request]
            properties:
              request: { $ref: '#/components/schemas/JoinRequest' }
              league: { $ref: '#/components/schemas/League' }
    Account:
      description: The account
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/Account' }
    AccountToken:
      description: The account, and for the app its token
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: '#/components/schemas/Account' }
              token: { type: string, description: Only when device_name was sent (the app) }
              expires_at: { type: string, format: date-time }
    Error:
      description: Any error, in one shape with an Arabic message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed (messages in Arabic)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ScoutView:
      type: object
      required: [cost, hours, balance, options, requests]
      properties:
        cost: { type: integer }
        hours: { type: integer }
        balance: { type: integer }
        options:
          type: object
          required: [leagues, nationalities, positions]
          properties:
            leagues: { type: array, items: { type: string } }
            nationalities: { type: array, items: { type: string } }
            positions: { type: array, items: { type: string } }
        requests:
          type: array
          items:
            type: object
            required: [id, status, cost, criteria, finishes_at, players]
            properties:
              id: { type: integer }
              status: { type: string, enum: [searching, done, empty] }
              cost: { type: integer }
              criteria: { type: object, additionalProperties: true }
              finishes_at: { type: string, format: date-time }
              players:
                type: array
                items:
                  type: object
                  required: [id, name, position, line, age, overall, potential, value, price, state]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    position: { type: string }
                    line: { type: string }
                    age: { type: integer }
                    nationality: { type: string, nullable: true }
                    overall: { type: integer }
                    potential: { type: integer }
                    value: { type: integer }
                    price: { type: integer, nullable: true }
                    state: { type: string, enum: [available, mine, gone] }
    OfferTerms:
      type: object
      required: [in, idempotency_key]
      properties:
        money: { type: integer, minimum: 0, description: From the offering club to the other }
        in: { type: array, items: { type: integer }, minItems: 1, maxItems: 5, description: The other club's players wanted }
        out: { type: array, items: { type: integer }, maxItems: 5, description: The offering club's players given }
        idempotency_key: { type: string, maxLength: 64 }
    TradePlayer:
      type: object
      required: [id, name, position, line, age, overall, value]
      properties: { id: { type: integer }, name: { type: string }, position: { type: string }, line: { type: string }, age: { type: integer }, overall: { type: integer }, value: { type: integer } }
    TransferOffer:
      type: object
      required: [id, status, money, from, to, incoming, counter_of, in, out, expires_at]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, accepted, rejected, countered, cancelled, expired] }
        money: { type: integer }
        from: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        to: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        incoming: { type: boolean, description: True when it is mine to answer }
        counter_of: { type: integer, nullable: true }
        in: { type: array, items: { $ref: '#/components/schemas/TradePlayer' } }
        out: { type: array, items: { $ref: '#/components/schemas/TradePlayer' } }
        expires_at: { type: string, format: date-time }
    Transfers:
      type: object
      required: [closed, fair, pair_cap, listings, offers, clubs]
      properties:
        closed: { type: string, nullable: true }
        fair: { type: object, required: [min_bp, max_bp], properties: { min_bp: { type: integer }, max_bp: { type: integer } } }
        pair_cap: { type: integer }
        listings:
          type: array
          items:
            type: object
            required: [player, price, club, mine]
            properties:
              player: { $ref: '#/components/schemas/TradePlayer' }
              price: { type: integer }
              club: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
              mine: { type: boolean }
        offers: { type: array, items: { $ref: '#/components/schemas/TransferOffer' } }
        clubs: { type: array, items: { type: object, required: [id, name, code], properties: { id: { type: integer }, name: { type: string }, code: { type: string } } } }
    Market:
      type: object
      required: [closed, open_until_round, counts, balance, bots, players, mine]
      properties:
        closed: { type: string, nullable: true }
        open_until_round: { type: integer }
        counts: { type: object, required: [pool, bots], properties: { pool: { type: integer }, bots: { type: integer } } }
        balance: { type: integer }
        bots: { type: array, items: { type: object, required: [id, name, code, players], properties: { id: { type: integer }, name: { type: string }, code: { type: string }, players: { type: integer } } } }
        players:
          type: array
          items:
            type: object
            required: [id, name, position, line, age, overall, potential, value, price, club]
            properties:
              id: { type: integer }
              name: { type: string }
              position: { type: string }
              line: { type: string }
              age: { type: integer }
              overall: { type: integer }
              potential: { type: integer }
              nationality: { type: string, nullable: true }
              value: { type: integer }
              price: { type: integer }
              club: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        mine:
          type: array
          items:
            type: object
            required: [id, name, position, line, overall, value, pool_pays]
            properties: { id: { type: integer }, name: { type: string }, position: { type: string }, line: { type: string }, overall: { type: integer }, value: { type: integer }, pool_pays: { type: integer } }
    ClubFinance:
      type: object
      required: [balance, can_spend, debt_rounds, debt_limit, wages_per_round, season_totals, season_income, season_expenses, rounds, transactions, stadium, sponsors]
      properties:
        balance: { type: integer }
        can_spend: { type: boolean }
        debt_rounds: { type: integer }
        debt_limit: { type: integer }
        wages_per_round: { type: integer }
        season_totals: { type: array, items: { type: object, required: [type, label, total], properties: { type: { type: string }, label: { type: string }, total: { type: integer } } } }
        season_income: { type: integer }
        season_expenses: { type: integer }
        rounds: { type: array, items: { type: object, required: [round, in, out], properties: { round: { type: integer }, in: { type: integer }, out: { type: integer } } } }
        transactions:
          type: array
          items:
            type: object
            required: [id, type, label, amount, balance_after, created_at, round, cup]
            properties:
              id: { type: integer }
              type: { type: string }
              label: { type: string }
              amount: { type: integer }
              balance_after: { type: integer }
              created_at: { type: string, format: date-time }
              round: { type: integer, nullable: true }
              cup: { type: boolean }
        stadium:
          type: object
          required: [capacity, attendance_bp, ticket_price, tickets_per_match]
          properties: { capacity: { type: integer }, attendance_bp: { type: integer }, ticket_price: { type: integer }, tickets_per_match: { type: integer } }
        sponsors:
          type: array
          items:
            type: object
            required: [sector, name, chosen, offers]
            properties:
              sector: { type: string }
              name: { type: string }
              chosen: { type: string, nullable: true }
              offers: { type: array, items: { type: object, required: [offer, name, per_match, per_win], properties: { offer: { type: string }, name: { type: string }, per_match: { type: integer }, per_win: { type: integer } } } }
    Message:
      type: object
      required: [id, type, read, created_at, title, body, link]
      properties:
        id: { type: integer }
        type: { type: string, enum: [referee, absence_warning, left_absent, kicked, join_request, join_approved, join_rejected, match_report] }
        league_id: { type: integer, nullable: true }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true, description: A web path to open (the app maps it to its own screen) }
    MatchReading:
      type: object
      description: The assistant's live note to his coach [ENGINE 8.2], from the public events and his own side only
      required: [minute, kind, text]
      properties:
        id: { type: integer }
        tick: { type: integer }
        minute: { type: integer }
        kind: { type: string, description: 'goal_for, goal_against, red_for, red_against, tired, build_lost, press_won, finishing, danger, counters_for, counters_against, offside, cards, fitness, on_top' }
        text: { type: string }
    MatchOrderResult:
      type: object
      required: [target_tick, duplicate]
      properties:
        target_tick: { type: integer, description: Not before this minute }
        duplicate: { type: boolean }
    League:
      type: object
      required: [id, name, template, team_count, rounds_per_day, round_times, prep_days, season_end_mode, starts_at, starting_budget, fair_league, is_dev, status, locked, is_owner, coaches, members, departures]
      properties:
        id: { type: integer }
        name: { type: string }
        template: { type: string }
        code: { type: string, nullable: true, description: For the owner and approved coaches only }
        team_count: { type: integer }
        rounds_per_day: { type: integer }
        round_times: { type: array, items: { type: string } }
        prep_days: { type: integer }
        season_end_mode: { type: string, enum: [renew, end] }
        starts_at: { type: string, format: date-time }
        starting_budget: { type: integer }
        fair_league: { type: boolean }
        is_dev: { type: boolean }
        status: { type: string, enum: [waiting, running, finished] }
        locked: { type: boolean, description: Settings are locked once the league starts }
        owner: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        is_owner: { type: boolean }
        my_club_id: { type: integer, nullable: true }
        my_request: { type: string, nullable: true, enum: [pending, approved, rejected, null] }
        coaches: { type: integer, description: Clubs with a coach }
        free_clubs: { type: integer, description: Clubs a coach can still take }
        invite_url: { type: string, nullable: true, description: 'The invite link (/join/CODE) with its WhatsApp card; for the owner and approved coaches' }
        me:
          type: object
          nullable: true
          description: My place this season, when I coach here
          required: [membership_id, on_holiday, vacation_used, absence_warning]
          properties:
            membership_id: { type: integer }
            on_holiday: { type: boolean }
            vacation_until: { type: string, format: date-time, nullable: true }
            vacation_used: { type: boolean, description: The season's one holiday is taken }
            absence_warning: { type: boolean, description: 48 hours quiet; cleared by any visit }
            away_deadline: { type: string, format: date-time, nullable: true, description: When the club goes back to a bot if I stay away; null before the season and on holiday }
        members:
          type: array
          description: Coaches this season
          items:
            type: object
            required: [id, user, is_owner, on_holiday, joined_at]
            properties:
              id: { type: integer, description: Membership id (for the kick) }
              user: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
              club: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
              is_owner: { type: boolean }
              on_holiday: { type: boolean }
              joined_at: { type: string, format: date-time }
              last_active_at: { type: string, format: date-time, nullable: true, description: For the owner only }
        departures:
          type: array
          description: Who left this season and why; a kick's reason is shown to every member
          items:
            type: object
            required: [user, reason, left_at]
            properties:
              user: { type: string }
              club: { type: string, nullable: true }
              reason: { type: string, enum: [resigned, absent, kicked, deleted] }
              kick_reason: { type: string, nullable: true }
              left_at: { type: string, format: date-time }
        pending_requests: { type: integer, nullable: true, description: Waiting join requests; for the owner only }
        season:
          type: object
          nullable: true
          properties:
            number: { type: integer }
            status: { type: string, enum: [upcoming, running, finished] }
            rounds: { type: integer }
            rounds_played: { type: integer }
            lock_from_round: { type: integer, description: No new coach from this round on (the last 25%) }
            join_open: { type: boolean }
    TacticsSet:
      type: object
      description: The engine's own keys (docs/ENGINE.md 5)
      properties:
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        tackling: { type: integer, minimum: 0, maximum: 3, description: 0 legal, 1 normal, 2 eager, 3 hard }
        pressing: { type: integer, minimum: 0, maximum: 100 }
        style: { type: integer, minimum: 0, maximum: 100, description: 0 defensive to 100 attacking }
        tempo: { type: integer, minimum: 0, maximum: 100 }
        att: { type: string, enum: [back, support, only] }
        mid: { type: string, enum: [def, stay, push] }
        def: { type: string, enum: [stay, fullbacks, mid] }
        trap: { type: integer, minimum: 0, maximum: 1 }
        marking: { type: string, enum: [zone, man] }
    PublicTactics:
      type: object
      description: The only tactics the opponent ever sees
      required: [tackling, marking, plan, trap]
      properties:
        tackling: { type: integer }
        marking: { type: string, enum: [zone, man] }
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        trap: { type: integer }
    Slot:
      type: object
      required: [role, line, x, y]
      properties:
        role: { type: string, example: CB }
        line: { type: string, enum: [gk, def, mid, att] }
        x: { type: integer, description: Depth towards the opponent's goal, decimetres (0 to 1050) }
        y: { type: integer, description: Across the pitch, decimetres (0 far touchline, 680 near); right-sided roles sit high }
    Formation:
      type: object
      required: [name, label, slots, lines]
      properties:
        name: { type: string, example: 4-3-3A }
        label: { type: string, example: 4-3-3 A }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        lines: { type: object, required: [def, mid, att], properties: { def: { type: integer }, mid: { type: integer }, att: { type: integer } } }
    Lineup:
      type: object
      required: [formation, auto, slots, starters, bench, lines]
      properties:
        formation: { type: string }
        auto: { type: boolean, description: Not saved by the coach; picked automatically ("تحسين") }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        starters: { type: array, items: { type: integer, nullable: true }, description: Player ids in slot order; null when a slot lost its player }
        bench: { type: array, items: { type: integer } }
        lines: { type: object, required: [def, mid, att], properties: { def: { type: integer }, mid: { type: integer }, att: { type: integer } } }
    StadiumView:
      type: object
      required: [balance, now, part_minutes, parts_total, facts, sections, building]
      properties:
        balance: { type: integer }
        now: { type: string, format: date-time, description: The game clock, for the countdown }
        part_minutes: { type: integer }
        parts_total: { type: integer }
        facts:
          type: object
          required: [capacity, home_bp, tickets_per_match, parts_done]
          properties:
            capacity: { type: integer }
            home_bp: { type: integer, description: The home advantage with the pitch (basis points) }
            tickets_per_match: { type: integer }
            parts_done: { type: integer }
        sections:
          type: array
          items:
            type: object
            required: [section, stage, parts, done, effects, next]
            properties:
              section: { type: string, enum: [seats, pitch, training] }
              stage: { type: integer, description: Stages finished, 0 to 3 }
              parts: { type: integer, description: Parts finished of the next stage }
              done: { type: integer, description: Parts finished in all }
              effects: { type: array, items: { type: integer }, description: 'The effect at stage 0 to 3: tickets per match, extra home advantage (bp), or the most training speeds up (bp)' }
              next:
                type: object
                nullable: true
                required: [stage, part, cost]
                properties:
                  stage: { type: integer }
                  part: { type: integer }
                  cost: { type: integer }
        building:
          type: object
          nullable: true
          required: [section, stage, part, ends_at]
          properties:
            section: { type: string, enum: [seats, pitch, training] }
            stage: { type: integer }
            part: { type: integer }
            ends_at: { type: string, format: date-time }
    TrainingPlayer:
      type: object
      required: [id, name, position, line, age, overall, training_bonus, potential, progress, sessions, injured, maxed, in_camp]
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        overall: { type: integer, description: With the training on top }
        training_bonus: { type: integer }
        potential: { type: integer }
        progress: { type: integer, description: The bar, 0 to 100 }
        sessions: { type: integer, description: About how many sessions a +1 takes at his rating }
        injured: { type: boolean }
        maxed: { type: boolean, description: At his potential, training adds nothing }
        in_camp: { type: boolean }
    TrainingView:
      type: object
      required: [cost, balance, interval_minutes, now, slots, players, camp, secret]
      properties:
        cost: { type: integer, description: One session's price }
        balance: { type: integer }
        interval_minutes: { type: integer }
        now: { type: string, format: date-time, description: The game clock, for the countdowns }
        slots:
          type: array
          items:
            type: object
            required: [line, player, sessions_done, next_at]
            properties:
              line: { type: string, enum: [gk, def, mid, att] }
              player: { allOf: [{ $ref: '#/components/schemas/TrainingPlayer' }], nullable: true }
              sessions_done: { type: integer }
              next_at: { type: string, format: date-time, nullable: true }
        players: { type: array, items: { $ref: '#/components/schemas/TrainingPlayer' } }
        camp:
          type: object
          required: [max_players, days, min_left, levels, current]
          properties:
            max_players: { type: integer }
            days: { type: array, items: { type: integer }, description: '[least, most]' }
            min_left: { type: integer }
            levels:
              type: array
              items:
                type: object
                required: [level, gain_bp, day_price]
                properties:
                  level: { type: string, enum: [basic, good, elite] }
                  gain_bp: { type: integer, description: The pace against an ordinary session (10000 = the same) }
                  day_price: { type: integer, description: One player for one day }
            current:
              type: object
              nullable: true
              description: The camp under way, or the last one
              required: [id, level, status, cost, sessions, sessions_done, ends_at, players]
              properties:
                id: { type: integer }
                level: { type: string, enum: [basic, good, elite] }
                status: { type: string, enum: [active, done] }
                cost: { type: integer }
                sessions: { type: integer }
                sessions_done: { type: integer }
                ends_at: { type: string, format: date-time }
                players:
                  type: array
                  items:
                    type: object
                    required: [id, gain]
                    properties:
                      id: { type: integer }
                      gain: { type: integer }
        secret:
          type: object
          required: [cost, boost, per_season, used, fixture]
          properties:
            cost: { type: integer }
            boost: { type: integer }
            per_season: { type: integer }
            used: { type: integer }
            fixture:
              type: object
              nullable: true
              required: [id, competition, round, status, opponent, lock_at, line]
              properties:
                id: { type: integer }
                competition: { type: string }
                round: { type: integer }
                status: { type: string }
                opponent: { type: string }
                lock_at: { type: string, format: date-time }
                line: { type: string, nullable: true, enum: [gk, def, mid, att], description: The line ordered for this match, if any }
    SquadPlayer:
      type: object
      required: [id, name, position, line, age, overall, potential, value, fitness, injured_matches, suspended_matches, available, attributes, role]
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string }
        alt_positions: { type: string, nullable: true }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        nationality: { type: string, nullable: true }
        foot: { type: string, nullable: true }
        overall: { type: integer, description: With the training on top }
        training_bonus: { type: integer, description: Points gained in training this season }
        potential: { type: integer }
        value: { type: integer }
        fitness: { type: integer }
        injured_matches: { type: integer }
        suspended_matches: { type: integer }
        in_camp: { type: boolean, description: At the training camp, so not in the matches }
        available: { type: boolean }
        attributes: { type: object, additionalProperties: { type: integer, nullable: true } }
        role: { type: string, enum: [starter, bench, reserve] }
    FixtureClub:
      type: object
      required: [id, name, code, strength_cp, crest_url]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        strength_cp: { type: integer }
        crest_url: { type: string }
        coach: { type: string, nullable: true }
    Fixture:
      type: object
      required: [id, competition, round, scheduled_at, is_bye, status]
      properties:
        id: { type: integer }
        competition: { type: string, enum: [league, cup] }
        round: { type: integer, description: 'League: the round. Cup: the stage order' }
        stage: { type: string, nullable: true, enum: [preliminary, r16, qf, sf, final, null] }
        scheduled_at: { type: string, format: date-time }
        home: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
        away: { allOf: [{ $ref: '#/components/schemas/FixtureClub' }], nullable: true }
        is_bye: { type: boolean, description: A league rest (only home is set) }
        status: { type: string }
        home_goals: { type: integer, nullable: true }
        away_goals: { type: integer, nullable: true }
    SeasonCalendar:
      type: object
      required: [number, status, rounds, rounds_played, lock_from_round, starts_at, windows]
      properties:
        number: { type: integer }
        status: { type: string }
        rounds: { type: integer }
        rounds_played: { type: integer }
        lock_from_round: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        winter_break_on: { type: string, format: date, nullable: true, description: The day with no matches (Cairo date) }
        timer_scale: { type: integer, nullable: true, description: 'Season length ÷ 37 days, in basis points (docs/PLAN.md 2.10)' }
        windows:
          type: array
          items:
            type: object
            required: [kind, opens_at, closes_at]
            properties:
              kind: { type: string, enum: [summer, winter] }
              opens_at: { type: string, format: date-time }
              closes_at: { type: string, format: date-time }
    JoinRequest:
      type: object
      required: [id, league_id, status]
      properties:
        id: { type: integer }
        league_id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        user: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
    LeagueClub:
      type: object
      required: [id, name, code, colors, crest_url, strength_cp, bot, balance, squad_value, players_count]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        colors: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        crest_url: { type: string }
        strength_cp: { type: integer, description: At the league's making, in hundredths }
        coach: { type: object, nullable: true, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        bot: { type: boolean, description: No coach; a bot runs it and it can be taken }
        balance: { type: integer, description: Club money }
        squad_value: { type: integer }
        players_count: { type: integer }
    LeaguePlayer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        nationality: { type: string, nullable: true }
        overall: { type: integer }
        potential: { type: integer }
        value: { type: integer }
        fitness: { type: integer }
        injured_matches: { type: integer }
        suspended_matches: { type: integer }
    DataClub:
      type: object
      required: [id, name, code, league, strength_cp, colors, crest_url]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string, description: Three letters }
        league: { type: string }
        strength_cp: { type: integer, description: The average of the best 18, in hundredths }
        colors: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        crest_url: { type: string }
    DataPlayer:
      type: object
      required: [id, name, position, line, age, overall, potential, value, attributes]
      properties:
        id: { type: integer }
        name: { type: string }
        position: { type: string, example: CM }
        line: { type: string, enum: [gk, def, mid, att] }
        age: { type: integer }
        nationality: { type: string, nullable: true }
        foot: { type: string, nullable: true }
        overall: { type: integer }
        potential: { type: integer, description: The most training can raise his rating }
        value: { type: integer, description: Club money }
        attributes:
          type: object
          description: pac, sho, pas, dri, def, phy for outfield players; diving, handling, kicking, positioning, reflexes for keepers
          additionalProperties: { type: integer, nullable: true }
    Account:
      type: object
      required: [id, name, email, email_verified, role, has_password, google]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        role: { type: string, enum: [user, admin] }
        has_password: { type: boolean, description: False for an account made with Google only }
        google: { type: boolean, description: Linked to a Google account }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [message, code]
      description: Every API error has this shape (app/Http/Errors/ApiErrors.php).
      properties:
        message: { type: string, description: In Arabic, ready to show, example: غير موجود. }
        code:
          type: string
          description: For the code to act on, never shown
          enum: [bad_request, unauthenticated, forbidden, not_found, method_not_allowed, conflict, gone, too_large, session_expired, validation, update_required, too_many_requests, server_error, unavailable]
        errors:
          type: object
          description: Only when code is validation; each field's messages in Arabic
          additionalProperties: { type: array, items: { type: string } }
    Room:
      type: object
      properties:
        id: { type: string }
        host: { type: object, properties: { name: { type: string }, club: { type: object } } }
        guest: { type: object, nullable: true, properties: { name: { type: string }, club: { type: object } } }
        match_id: { type: string, nullable: true, description: Set once the friend joins; the host manages home, the guest away }
        seat: { type: string, description: 'Only in the answer to POST /sim/rooms (the home seat) and to /join (the away seat): keep it on the device and send it as X-Seat' }
    Reaction:
      type: object
      properties:
        id: { type: integer }
        side: { type: string, enum: [home, away] }
        key: { type: string }
        at: { type: integer, description: Server clock in ms }
    ClubSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        league_name: { type: string }
        strength_cp: { type: integer, description: Average of the best 18 in hundredths }
        color_primary: { type: string }
        color_secondary: { type: string }
    Tactics:
      type: object
      properties:
        plan: { type: string, enum: [counter, long, passing, wings, shots] }
        tackling: { type: integer, minimum: 0, maximum: 3 }
        pressing: { type: integer, minimum: 0, maximum: 100 }
        style: { type: integer, minimum: 0, maximum: 100 }
        tempo: { type: integer, minimum: 0, maximum: 100 }
        att: { type: string, enum: [back, support, only] }
        mid: { type: string, enum: [def, stay, push] }
        def: { type: string, enum: [stay, fullbacks, mid] }
        trap: { type: integer, enum: [0, 1] }
        marking: { type: string, enum: [zone, man] }
    TeamSetup:
      type: object
      properties:
        formation: { type: string, enum: ['4-2-3-1', '4-3-3', '4-4-2', '4-1-4-1', '3-5-2', '5-3-2'] }
        tactics: { $ref: '#/components/schemas/Tactics' }
    MatchView:
      type: object
      properties:
        id: { type: string }
        seed: { type: integer }
        competition: { type: string }
        referee: { type: integer }
        venue: { type: string }
        control: { type: object }
        mode: { type: string, enum: [solo, live] }
        you: { type: [string, 'null'], enum: [home, away, null], description: 'Live: the side the request''s seat manages; null for a viewer. In a live match the other side''s tactics are null' }
        seats: { type: object, description: 'Only in the answer to a live POST /sim/matches: {home, away} seats; the maker keeps home and sends away to the friend' }
        started: { type: boolean, description: Always true for solo matches }
        tick: { type: integer }
        finished: { type: boolean }
        score: { type: object }
        formations: { type: array, items: { type: string } }
        timing: { type: object }
        clubs: { type: object }
        coaches: { type: object, description: "The coaches' names in a match between friends: {home, away}" }
        teams: { type: object }
        slots: { type: object }
    LiveSync:
      type: object
      properties:
        started: { type: boolean }
        finished: { type: boolean }
        tick: { type: integer, description: The minute playing now (minutes made ahead of time do not count yet) }
        server_now: { type: integer, description: Server clock in ms }
        next_at: { type: [integer, 'null'], description: When the next minute is due (ms), null before the start or after the end }
        gap: { type: boolean, description: Some minutes after `since` are no longer kept; jump to the latest }
        ticks: { type: array, items: { type: object }, description: 'Each minute carries at: when it starts on the server clock (ms). It is made game.match.live_lead_ms early, so both screens play it at that instant' }
        reactions: { type: array, items: { $ref: '#/components/schemas/Reaction' }, description: The last few seconds of reactions }
