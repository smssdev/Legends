<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: الملعب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="#" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">الملعب</h1>
<span style="font-size: 12px; color: #A9B6CC">قسم واحد في كل مرة · الجزء 18 ساعة</span>
</div>
</header>

<section aria-label="الملعب الآن" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: linear-gradient(135deg, #12305E 0%, #0D2348 100%); border: 1px solid rgba(245,184,46,0.22)">
<svg viewBox="0 0 360 220" width="128" height="78" role="img" aria-label="رسم للملعب من أعلى" style="flex: none">
<rect x="6" y="6" width="348" height="208" rx="70" fill="#163360"></rect>
<rect x="22" y="22" width="316" height="176" rx="56" fill="#1D3F75"></rect>
<rect x="44" y="40" width="272" height="140" rx="8" fill="#1E9E4A"></rect>
<g fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"><line x1="180" y1="48" x2="180" y2="172"></line><circle cx="180" cy="110" r="18"></circle></g>
<rect x="110" y="8" width="140" height="14" rx="4" fill="#F5B82E"></rect>
<rect x="110" y="198" width="140" height="14" rx="4" fill="#F5B82E"></rect>
</svg>
<div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column"><span style="font-size: 10px; color: #A9B6CC">{{f.k}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: {{f.color}}" dir="ltr">{{f.v}}</span></div>
</sc-for>
</div>
</section>

<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<article style="border-radius: 18px; padding: 12px 14px; background: {{s.bg}}; border: 1.5px solid {{s.border}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(245,184,46,0.14)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#F5B82E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">{{s.title}}</span><span style="font-size: 11px; color: #A9B6CC">{{s.effect}}</span></div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: {{s.nowColor}}" dir="ltr">{{s.now}}</span>
</div>
<div style="display: flex; gap: 3px" aria-label="{{s.count}} أجزاء مكتملة من 15"><sc-for list="{{s.parts}}" as="p" hint-placeholder-count="15"><span style="flex: 1; height: 8px; border-radius: 2px; background: {{p}}"></span></sc-for></div>
<sc-if value="{{s.running}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex: 1; font-size: 12px; color: #C9D2E1">الجزء 4 من المرحلة 2 · <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #6FDC97" dir="ltr">06:48:12</span></span>
<button type="button" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(245,184,46,0.14); color: #F5B82E; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 5px">أنهِ الآن <img src="/_blob/5bd2c4d5326f6c6a577d7a17fa6803e8" alt="" style="width: 16px; height: 16px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px">45</span></button>
</div>
</sc-if>
<sc-if value="{{s.idle}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; color: #7F8FAA">ينتظر انتهاء القسم الحالي · الجزء التالي 120K</span>
</sc-if>
</article>
</sc-for>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const parts = (done, running) => Array.from({ length: 15 }, (_, n) => n < done ? '#F5B82E' : (running && n === done) ? '#2BB673' : 'rgba(247,244,234,0.12)');
return {
  facts: [{ k: 'السعة', v: '38,500', color: '#F7F4EA' }, { k: 'ميزة الأرض', v: '+2%', color: '#6FDC97' }, { k: 'التذاكر للمباراة', v: '118K', color: '#F7F4EA' }, { k: 'المكتمل', v: '20/45', color: '#F5B82E' }],
  sections: [
    { title: 'أرضية الملعب', effect: 'ميزة اللعب على أرضك', icon: 'M3 6h18v12H3zM12 6v12M3 10h3v4H3M21 10h-3v4h3', parts: parts(8, true), count: 8, now: '2%', nowColor: '#6FDC97', running: true, idle: false, bg: 'linear-gradient(160deg, rgba(43,182,115,0.16) 0%, #10284F 70%)', border: 'rgba(43,182,115,0.5)' },
    { title: 'التذاكر والمقاعد', effect: 'دخل أعلى من كل مباراة على أرضك', icon: 'M4 18V9l8-5 8 5v9M8 18v-5h8v5M4 18h16', parts: parts(5, false), count: 5, now: '+8K', nowColor: '#F7F4EA', running: false, idle: true, bg: '#10284F', border: 'transparent' },
    { title: 'تدريب الفريق', effect: 'تقدم أسرع في خانات التدريب', icon: 'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12', parts: parts(7, false), count: 7, now: 'م1', nowColor: '#F7F4EA', running: false, idle: true, bg: '#10284F', border: 'transparent' }
  ],
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html'), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#', true)]
};
}
}
</script>
</body>
</html>
