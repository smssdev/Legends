<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: المباراة الحية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071733}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #071733; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="MobileHome.dc.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<span style="flex: 1; font-size: 13px; color: #A9B6CC">دوري الشلة · الجولة 12</span>
<button type="button" aria-label="كتم صوت المعلق" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #10284F; color: #F7F4EA; display: inline-flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg></button>
</header>

<section aria-label="النتيجة" style="border-radius: 20px; background: linear-gradient(180deg, #12305E 0%, #0D2348 100%); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 50px; border-radius: 12px 12px 24px 24px; background: #C8102E; border: 2px solid #F6C343; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">LIV</span>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 13px">ليفربول</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 52px; line-height: 1" dir="ltr">2 <span style="color: #A9B6CC">–</span> 1</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(239,68,68,0.16); color: #FF8A8A; font-weight: 600; font-size: 12px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #EF4444"></span>67'</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 50px; border-radius: 12px 12px 24px 24px; background: #FFFFFF; border: 2px solid #DB0007; color: #DB0007; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">ARS</span>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 13px">آرسنال</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px" dir="ltr">54%</span>
<div style="flex: 1; height: 6px; border-radius: 6px; background: #F7F4EA; overflow: hidden; display: flex"><div style="width: 54%; background: #C8102E"></div></div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px" dir="ltr">46%</span>
</div>
</section>

<section aria-label="الملعب" dir="ltr" style="position: relative; height: 222px; border-radius: 18px; overflow: hidden; background: repeating-linear-gradient(90deg, #1A8A42 0px, #1A8A42 9.5%, #1E9E4A 9.5%, #1E9E4A 19%); border: 1px solid rgba(247,244,234,0.12)">
<svg viewBox="0 0 105 64" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0"><g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.4"><rect x="2" y="2" width="101" height="60"></rect><line x1="52.5" y1="2" x2="52.5" y2="62"></line><circle cx="52.5" cy="32" r="8"></circle><rect x="2" y="16" width="15" height="32"></rect><rect x="88" y="16" width="15" height="32"></rect></g></svg>
<sc-for list="{{home}}" as="d" hint-placeholder-count="11"><span style="position: absolute; left: {{d.left}}%; top: {{d.top}}%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #C8102E; border: 1.5px solid #FFFFFF"></span></sc-for>
<sc-for list="{{away}}" as="d" hint-placeholder-count="11"><span style="position: absolute; left: {{d.left}}%; top: {{d.top}}%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #DB0007"></span></sc-for>
<span style="position: absolute; left: 74.3%; top: 40.6%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #F5B82E; border: 1.5px solid #0A1F42; box-shadow: 0 0 0 5px rgba(245,184,46,0.25)"></span>
<div dir="rtl" style="position: absolute; bottom: 10px; right: 10px; left: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(7,23,51,0.9); font-size: 13px; font-weight: 600">فيرتز يسدد من حدود المنطقة... بجانب القائم!</div>
</section>

<div role="tablist" aria-label="أقسام المباراة" style="display: flex; padding: 4px; border-radius: 12px; background: #10284F">
<button type="button" role="tab" aria-selected="true" style="flex: 1; height: 36px; border-radius: 9px; border: 0; background: #F5B82E; color: #0A1F42; font-size: 13px; font-weight: 700">المجريات</button>
<button type="button" role="tab" aria-selected="false" style="flex: 1; height: 36px; border-radius: 9px; border: 0; background: transparent; color: #C9D2E1; font-size: 13px">الإحصائيات</button>
<button type="button" role="tab" aria-selected="false" style="flex: 1; height: 36px; border-radius: 9px; border: 0; background: transparent; color: #C9D2E1; font-size: 13px">التشكيلتان</button>
</div>

<section aria-label="مجريات المباراة" style="display: flex; flex-direction: column">
<sc-for list="{{feed}}" as="e" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid rgba(247,244,234,0.06)">
<span style="flex: none; width: 30px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: {{e.color}}">{{e.min}}'</span>
<span style="font-size: 13px; line-height: 1.6; font-weight: {{e.weight}}">{{e.text}}</span>
</div>
</sc-for>
</section>

</div>

<section aria-label="اقتراح المساعد" style="position: absolute; bottom: 92px; left: 14px; right: 14px; border-radius: 16px; background: #1A2F55; border: 1px solid rgba(245,184,46,0.45); box-shadow: 0 10px 30px rgba(0,0,0,0.45); padding: 12px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; color: #F5B82E">اقتراح المساعد</span>
<span style="font-size: 13px">بدّل خرافنبيرخ (لياقة 34%) بـ إندو</span>
</div>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 13px">نفّذ</button>
<button type="button" aria-label="تجاهل الاقتراح" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(247,244,234,0.08); color: #F7F4EA; display: inline-flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</section>

<nav aria-label="أوامر المدرب" style="position: absolute; bottom: 0; left: 0; right: 0; height: 84px; box-sizing: border-box; padding: 10px 14px 22px; background: rgba(8,26,56,0.97); border-top: 1px solid rgba(247,244,234,0.08); display: flex; gap: 10px">
<button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">تبديل <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px" dir="ltr">1/3</span></button>
<button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid rgba(245,184,46,0.55); background: transparent; color: #F5B82E; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">التكتيك</button>
<button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid rgba(245,184,46,0.55); background: transparent; color: #F5B82E; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">التشكيلة</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pts = (arr) => arr.map(([x, y]) => ({ left: Math.round(x / 105 * 1000) / 10, top: Math.round(y / 64 * 1000) / 10 }));
return {
  home: pts([[6, 32], [24, 12], [22, 26], [22, 38], [26, 52], [44, 30], [62, 22], [56, 42], [80, 14], [84, 32], [74, 48]]),
  away: pts([[99, 32], [86, 20], [88, 30], [88, 40], [84, 50], [72, 26], [70, 38], [66, 50], [52, 16], [48, 34], [54, 52]]),
  feed: [
    { min: 67, color: '#F5B82E', weight: 400, text: 'ضغط متواصل من ليفربول، وفيرتز يحاول من حدود المنطقة.' },
    { min: 64, color: '#F5B82E', weight: 400, text: 'بطاقة صفراء لرايس بعد تدخل متأخر. الحكم الصارم لا يتهاون.' },
    { min: 51, color: '#2BB673', weight: 700, text: 'هدف! إيساك يرتقي لعرضية فريمبونغ. ليفربول يتقدم 2-1!' }
  ]
};
}
}
</script>
</body>
</html>
