<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: بطاقة اللاعب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="MobileSquad.dc.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 18px">بطاقة اللاعب</h1>
<span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(43,182,115,0.14); color: #6FDC97; font-size: 12px; font-weight: 600">أساسي</span>
</header>

<section style="position: relative; overflow: hidden; border-radius: 24px; padding: 18px; background: linear-gradient(160deg, #1A3C72 0%, #10284F 55%, #0D2348 100%); border: 1px solid rgba(245,184,46,0.3); display: flex; flex-direction: column; gap: 16px">
<svg viewBox="0 0 200 200" width="200" height="200" aria-hidden="true" style="position: absolute; left: -50px; top: -50px; opacity: 0.07"><circle cx="100" cy="100" r="90" fill="none" stroke="#F7F4EA" stroke-width="3"></circle><circle cx="100" cy="100" r="40" fill="none" stroke="#F7F4EA" stroke-width="3"></circle></svg>
<div style="display: flex; align-items: center; gap: 14px; position: relative">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 54px; line-height: 0.9; color: #F5B82E">91</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 22px; border-radius: 6px; background: #F2994A; color: #2A1300; font-weight: 700; font-size: 11px">هـ</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 22px">محمد صلاح</h2>
<span style="font-size: 13px; color: #C9D2E1">جناح أيمن · مصر</span>
<span style="font-size: 12px; color: #A9B6CC">33 سنة · القدم اليسرى · 175 سم</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; position: relative">
<sc-for list="{{attrs}}" as="a" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #C9D2E1">{{a.label}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: {{a.color}}">{{a.v}}</span></div>
<span style="height: 4px; border-radius: 4px; background: rgba(247,244,234,0.1)"><span style="display: block; height: 4px; border-radius: 4px; width: {{a.v}}%; background: {{a.color}}"></span></span>
</div>
</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
<div style="padding: 10px; border-radius: 14px; background: #10284F; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A9B6CC">{{f.k}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: {{f.color}}" dir="ltr">{{f.v}}</span></div>
</sc-for>
</div>

<section aria-label="هذا الموسم" style="border-radius: 18px; background: #10284F; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">هذا الموسم</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center">
<sc-for list="{{season}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">{{s.v}}</span><span style="font-size: 11px; color: #A9B6CC">{{s.k}}</span></div>
</sc-for>
</div>
</section>

</div>

<div style="position: absolute; bottom: 0; left: 0; right: 0; box-sizing: border-box; padding: 12px 16px 24px; background: rgba(8,26,56,0.97); border-top: 1px solid rgba(247,244,234,0.08); display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 50px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 16px">أضفه للتدريب</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid rgba(245,184,46,0.5); background: transparent; color: #F5B82E; font-weight: 700; font-size: 14px">اعرضه للبيع</button>
<button type="button" style="height: 44px; border-radius: 12px; border: 0; background: rgba(247,244,234,0.08); color: #F7F4EA; font-size: 14px">بيع للسوق · <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px" dir="ltr">1.02M</span></button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const attrColor = (v) => v >= 85 ? '#2BB673' : v >= 70 ? '#F5B82E' : '#F2994A';
return {
  attrs: [['السرعة', 89], ['التسديد', 88], ['التمرير', 86], ['المراوغة', 90], ['الدفاع', 45], ['البدنية', 76]].map(([label, v]) => ({ label, v, color: attrColor(v) })),
  facts: [{ k: 'اللياقة', v: '92%', color: '#2BB673' }, { k: 'سقف التطور', v: '92', color: '#F7F4EA' }, { k: 'القيمة', v: '1.45M', color: '#F7F4EA' }],
  season: [{ k: 'مباريات', v: 11 }, { k: 'أهداف', v: 9 }, { k: 'صناعة', v: 5 }, { k: 'التقييم', v: '7.8' }]
};
}
}
</script>
</body>
</html>
