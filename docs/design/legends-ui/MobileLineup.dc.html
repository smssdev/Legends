<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: التشكيلة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="MobileHome.dc.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">التشكيلة</h1>
<span style="font-size: 12px; color: #A9B6CC">يُقفل بعد <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #F5B82E" dir="ltr">02:09:36</span></span>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">حفظ</button>
</header>

<div style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{formations}}" as="f" hint-placeholder-count="5">
<button type="button" dir="ltr" style="flex: none; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 6px">
<sc-for list="{{counters}}" as="c" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: 8px; background: #10284F; font-size: 12px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{c.color}}"></span>{{c.label}} <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700">{{c.n}}</span></span>
</sc-for>
</div>
<button type="button" style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(245,184,46,0.5); background: transparent; color: #F5B82E; font-size: 12px; font-weight: 600">تحسين</button>
</div>

<div dir="ltr" style="position: relative; height: 430px; border-radius: 20px; overflow: hidden; background: repeating-linear-gradient(180deg, #1A8A42 0px, #1A8A42 43px, #1E9E4A 43px, #1E9E4A 86px); border: 1px solid rgba(247,244,234,0.12)">
<svg viewBox="0 0 100 140" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0"><g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.5"><rect x="4" y="3" width="92" height="134"></rect><line x1="4" y1="70" x2="96" y2="70"></line><circle cx="50" cy="70" r="11"></circle><rect x="24" y="3" width="52" height="20"></rect><rect x="24" y="117" width="52" height="20"></rect></g></svg>
<sc-for list="{{xi}}" as="p" hint-placeholder-count="11">
<div style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 76px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: #0A1F42; border: 3px solid {{p.ring}}; box-shadow: 0 4px 10px rgba(0,0,0,0.35); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: #F7F4EA">{{p.ovr}}</span>
<span dir="rtl" style="max-width: 76px; padding: 1px 6px; border-radius: 6px; background: rgba(8,26,56,0.85); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="width: 40px; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.25)"><span style="display: block; height: 3px; border-radius: 3px; width: {{p.fit}}%; background: {{p.fitColor}}"></span></span>
</div>
</sc-for>
</div>

<section aria-label="الاحتياط" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">الاحتياط</span><span style="font-size: 11px; color: #A9B6CC">اسحب للملعب</span></div>
<div style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{bench}}" as="b" hint-placeholder-count="5">
<div style="flex: none; width: 92px; padding: 8px; box-sizing: border-box; border-radius: 12px; background: #10284F; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 20px; border-radius: 6px; background: {{b.posBg}}; color: {{b.posFg}}; font-weight: 700; font-size: 11px">{{b.pos}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; color: #F5B82E">{{b.ovr}}</span></div>
<span style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.name}}</span>
</div>
</sc-for>
</div>
</section>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const fitColor = (f) => f >= 80 ? '#2BB673' : f >= 60 ? '#F5B82E' : '#F2994A';
const ring = { GK: '#F5B82E', D: '#2F6FDB', M: '#1E9E4A', A: '#F2994A' };
const xi = [
  ['أليسون', 'GK', 89, 95, 50, 91],
  ['فريمبونغ', 'D', 83, 88, 86, 70], ['غوميز', 'D', 79, 90, 63, 74], ['فان دايك', 'D', 90, 68, 37, 74], ['كيركيز', 'D', 82, 58, 14, 70],
  ['خرافنبيرخ', 'M', 85, 41, 50, 54], ['فيرتز', 'M', 89, 86, 76, 42], ['ماك أليستر', 'M', 87, 80, 24, 42],
  ['صلاح', 'A', 91, 92, 84, 18], ['إيساك', 'A', 88, 88, 50, 12], ['خاكبو', 'A', 84, 84, 16, 18]
].map(([name, line, ovr, fit, x, y]) => ({ name, ovr, fit, x, y, ring: ring[line], fitColor: fitColor(fit) }));
const P = { 'ح': ['#F5B82E', '#0A1F42'], 'د': ['#2F6FDB', '#FFFFFF'], 'و': ['#1E9E4A', '#FFFFFF'], 'هـ': ['#F2994A', '#2A1300'] };
const bench = [['و', 'سوبوسلاي', 83], ['و', 'إندو', 79], ['د', 'روبرتسون', 82], ['هـ', 'إيكيتيكي', 84], ['هـ', 'كييزا', 81]]
  .map(([pos, name, ovr]) => ({ pos, name, ovr, posBg: P[pos][0], posFg: P[pos][1] }));
return {
  xi, bench,
  formations: ['4-3-3 A', '4-2-3-1', '4-4-2 B', '3-5-2', 'مخصصة'].map((label, i) => ({
    label, bg: i === 0 ? 'rgba(245,184,46,0.14)' : '#10284F', fg: i === 0 ? '#F5B82E' : '#D9DFEA', border: i === 0 ? 'rgba(245,184,46,0.6)' : 'transparent'
  })),
  counters: [
    { label: 'دفاع', n: 4, color: '#2F6FDB' }, { label: 'وسط', n: 3, color: '#1E9E4A' }, { label: 'هجوم', n: 3, color: '#F2994A' }
  ],
  tabs: [
    tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', '#', true), tab('المباراة', 'ball', 'MobileMatch.dc.html'),
    tab('السوق', 'market', '#'), tab('المزيد', 'more', '#')
  ]
};
}
}
</script>
</body>
</html>
