<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: الدوري والكأس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 22px">دوري الشلة</h1>
<span style="font-size: 12px; color: #A9B6CC">الجولة 12 من 30 · منطقة القفل من الجولة 23</span>
</header>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #10284F" role="tablist" aria-label="أقسام الدوري">
<sc-for list="{{tabsTop}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="height: 38px; border-radius: 9px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 600">{{t.label}}</button>
</sc-for>
</div>

<section aria-label="جدول الترتيب" style="border-radius: 18px; background: #10284F; padding: 6px 10px">
<div style="display: grid; grid-template-columns: 24px 1fr 32px 40px 36px; gap: 6px; padding: 8px 4px; font-size: 11px; color: #A9B6CC">
<span>#</span><span>النادي</span><span style="text-align: center">لعب</span><span style="text-align: center">+/-</span><span style="text-align: center">نقاط</span>
</div>
<sc-for list="{{table}}" as="r" hint-placeholder-count="12">
<div style="display: grid; grid-template-columns: 24px 1fr 32px 40px 36px; gap: 6px; align-items: center; padding: 7px 4px; border-radius: 10px; background: {{r.bg}}">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: {{r.posColor}}">{{r.pos}}</span>
<span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 26px; border-radius: 7px 7px 12px 12px; background: {{r.cbg}}; color: {{r.cfg}}; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700">{{r.code}}</span><span style="font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 11px; color: #7F8FAA">{{r.coach}}</span></span>
<span style="text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 15px">{{r.p}}</span>
<span style="text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 15px" dir="ltr">{{r.gd}}</span>
<span style="text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; color: #F5B82E">{{r.pts}}</span>
</div>
</sc-for>
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 13px; font-weight: 700; text-decoration: none">الجدول كاملاً · 16 فريقاً</a>
</section>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const C = {
  ARS: ['آرسنال', '#FFFFFF', '#DB0007'], LIV: ['ليفربول', '#C8102E', '#FFFFFF'], MCI: ['مان سيتي', '#6CABDD', '#0A1F42'], CHE: ['تشيلسي', '#034694', '#FFFFFF'],
  NEW: ['نيوكاسل', '#241F20', '#FFFFFF'], TOT: ['توتنهام', '#FFFFFF', '#132257'], MUN: ['مان يونايتد', '#DA291C', '#FBE122'], AVL: ['أستون فيلا', '#670E36', '#95BFE5'],
  BHA: ['برايتون', '#0057B8', '#FFFFFF'], NFO: ['نوتنغهام', '#DD0000', '#FFFFFF'], CRY: ['كريستال بالاس', '#1B458F', '#C4122E'], FUL: ['فولهام', '#FFFFFF', '#000000']
};
const rows = [['ARS', 'حمزة', '+14', 26], ['LIV', 'أنت', '+12', 25], ['MCI', '', '+11', 23], ['CHE', 'يوسف', '+7', 21], ['NEW', '', '+5', 20], ['TOT', '', '+3', 18], ['MUN', 'أحمد', '+2', 16], ['AVL', '', '-1', 16], ['BHA', '', '0', 13], ['NFO', '', '-2', 12], ['CRY', '', '-5', 11], ['FUL', '', '-6', 10]];
return {
  table: rows.map(([code, coach, gd, pts], i) => ({ pos: i + 1, code, name: C[code][0], cbg: C[code][1], cfg: C[code][2], coach, p: 11, gd, pts, bg: code === 'LIV' ? 'rgba(245,184,46,0.12)' : 'transparent', posColor: i === 0 ? '#F5B82E' : '#A9B6CC' })),
  tabsTop: ['الترتيب', 'المباريات', 'الكأس'].map((label, i) => ({ label, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#F5B82E' : 'transparent', fg: i === 0 ? '#0A1F42' : '#C9D2E1' })),
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html'), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#', true)]
};
}
}
</script>
</body>
</html>
