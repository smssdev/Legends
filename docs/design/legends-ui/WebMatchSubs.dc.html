<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends: التبديل أثناء المباراة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071733}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; min-height: 1000px; overflow: hidden; background: #071733; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">
<dc-import name="WebMatch" hint-size="100%,1000px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,12,30,0.62)"></div>

<aside aria-label="التبديل" style="position: absolute; top: 0; right: 0; bottom: 0; width: min(620px, 100%); box-sizing: border-box; background: #0B1E40; border-left: 1px solid rgba(247,244,234,0.10); box-shadow: -20px 0 60px rgba(0,0,0,0.5); display: flex; flex-direction: column">

<div style="padding: 18px 20px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(247,244,234,0.08)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">التبديل</h2>
<span style="font-size: 13px; color: #A9B6CC">استخدمت <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #F7F4EA" dir="ltr">1/3</span> · الدقيقة <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #F5B82E">67</span></span>
</div>
<a href="WebMatch.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 12px; background: #163360; color: #F7F4EA; display: inline-flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">

<section aria-label="اقتراح المساعد" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(245,184,46,0.10); border: 1px solid rgba(245,184,46,0.4)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; font-weight: 700; color: #F5B82E">اقتراح المساعد</span>
<span style="font-size: 14px; line-height: 1.6">خرافنبيرخ لياقته 54% مع الضغط العالي. <strong>إندو</strong> يحمي الوسط في آخر 20 دقيقة.</span>
</div>
<button type="button" onClick="{{takeSuggestion}}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">اختره</button>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<section aria-label="في الملعب" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #C9D2E1">في الملعب · الأقل لياقة أولاً</span>
<sc-for list="{{onPitch}}" as="p" hint-placeholder-count="10">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: #F7F4EA; font-family: inherit; text-align: right">
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; border-radius: 7px; background: {{p.posBg}}; color: {{p.posFg}}; font-size: 11px; font-weight: 700">{{p.pos}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 13px; font-weight: 600">{{p.name}}</span><span style="height: 4px; border-radius: 4px; background: rgba(247,244,234,0.10)"><span style="display: block; height: 4px; border-radius: 4px; width: {{p.fit}}%; background: {{p.color}}"></span></span></span>
<sc-if value="{{p.yellow}}" hint-placeholder-val="{{ false }}"><span aria-label="بطاقة صفراء" style="width: 10px; height: 14px; border-radius: 2px; background: #F5D90A"></span></sc-if>
<span style="width: 34px; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: {{p.color}}" dir="ltr">{{p.fit}}%</span>
</button>
</sc-for>
</section>
<section aria-label="البدلاء" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #C9D2E1">البدلاء</span>
<sc-for list="{{bench}}" as="b" hint-placeholder-count="7">
<button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid {{b.border}}; background: {{b.bg}}; color: #F7F4EA; font-family: inherit; text-align: right">
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; border-radius: 7px; background: {{b.posBg}}; color: {{b.posFg}}; font-size: 11px; font-weight: 700">{{b.pos}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">{{b.name}}</span><span style="font-size: 11px; color: #A9B6CC">{{b.attr}}</span></span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: #F5B82E">{{b.ovr}}</span>
</button>
</sc-for>
</section>
</div>

<section aria-label="معاينة التبديل" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #10284F">
<div style="display: flex; align-items: center; gap: 12px; font-size: 15px">
<span style="display: inline-flex; align-items: center; gap: 6px; color: #F2994A"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg><strong>{{outName}}</strong></span>
<span style="color: #A9B6CC">يخرج، ويدخل</span>
<span style="display: inline-flex; align-items: center; gap: 6px; color: #2BB673"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg><strong>{{inName}}</strong></span>
</div>
<span style="font-size: 13px; color: {{fitNoteColor}}">{{fitNote}}</span>
</section>

<section aria-label="تبديلات معلقة" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #C9D2E1">سجل التبديلات</span>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #10284F; font-size: 13px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #A9B6CC">58'</span><span style="flex: 1">خاكبو بدلاً من كييزا</span><span style="color: #2BB673">طُبّق</span></div>
</section>
</div>

<div style="padding: 14px 20px 18px; border-top: 1px solid rgba(247,244,234,0.08); display: flex; gap: 10px">
<a href="WebMatch.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #F5B82E; color: #0A1F42; text-decoration: none; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 16px">بدّل في الدقيقة <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px">68</span></a>
<a href="WebMatch.dc.html" style="display: inline-flex; align-items: center; height: 54px; padding: 0 16px; border-radius: 14px; background: #163360; color: #F7F4EA; text-decoration: none; font-size: 14px">إلغاء</a>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { out: 38, inn: 3 }; }
  renderVals() {
    const st = this.state || {};
    const pos = { 'ح': ['#F5B82E', '#0A1F42'], 'د': ['#2F6FDB', '#FFFFFF'], 'و': ['#1E9E4A', '#FFFFFF'], 'هـ': ['#F2994A', '#2A1300'] };
    const col = (v) => v >= 75 ? '#2BB673' : v >= 60 ? '#F5B82E' : '#F2994A';
    const pitch = [[38, 'و', 'رايان خرافنبيرخ', 54, true], [10, 'و', 'أليكسيس ماك أليستر', 61], [30, 'د', 'جيريمي فريمبونغ', 63], [6, 'د', 'ميلوش كيركيز', 66], [11, 'هـ', 'محمد صلاح', 70], [7, 'و', 'فلوريان فيرتز', 72], [9, 'هـ', 'ألكسندر إيساك', 74], [18, 'هـ', 'كودي خاكبو', 76], [5, 'د', 'إبراهيما كوناتي', 79], [4, 'د', 'فيرجيل فان دايك', 81], [1, 'ح', 'أليسون', 95]];
    const benchL = [[3, 'و', 'واتارو إندو', 'وسط دفاعي · دفاع 79', 79], [8, 'و', 'دومينيك سوبوسلاي', 'وسط هجومي · تمرير 84', 83], [22, 'هـ', 'هوغو إيكيتيكي', 'مهاجم · سرعة 86', 83], [26, 'د', 'آندي روبرتسون', 'ظهير أيسر · تمرير 80', 82], [17, 'و', 'كيرتس جونز', 'وسط · مراوغة 82', 80], [2, 'د', 'جو غوميز', 'قلب دفاع · دفاع 79', 79], [25, 'ح', 'ماماردشفيلي', 'حارس', 84]];
    const onPitch = pitch.map(([no, p, name, fit, yellow]) => { const on = st.out === no; return { pos: p, posBg: pos[p][0], posFg: pos[p][1], name, fit, color: col(fit), yellow: !!yellow, on, pick: () => this.setState({ out: no }), bg: on ? 'rgba(242,153,74,0.14)' : '#10284F', border: on ? '#F2994A' : 'transparent' }; });
    const bench = benchL.map(([no, p, name, attr, ovr]) => { const on = st.inn === no; return { pos: p, posBg: pos[p][0], posFg: pos[p][1], name, attr, ovr, on, pick: () => this.setState({ inn: no }), bg: on ? 'rgba(43,182,115,0.14)' : '#10284F', border: on ? '#2BB673' : 'transparent' }; });
    const o = pitch.find((r) => r[0] === st.out) || pitch[0];
    const i = benchL.find((r) => r[0] === st.inn) || benchL[0];
    const same = o[1] === i[1];
    return {
      onPitch, bench, outName: o[2], inName: i[2],
      fitNote: same ? 'نفس الخط: الطريقة لا تتغير، ولياقة البديل 100%.' : 'خط مختلف: سيلعب خارج مركزه بعقوبة، أو غيّر الطريقة بعد التبديل.',
      fitNoteColor: same ? '#2BB673' : '#F2994A',
      takeSuggestion: () => this.setState({ out: 38, inn: 3 })
    };
  }
}
</script>
</body>
</html>
