<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: الرئيسية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="height: 756px; overflow: hidden; box-sizing: border-box; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; gap: 10px">
<img src="/_blob/3db7f68e0ee8f757e178e4c66bed01da" alt="Legends" style="width: 38px; height: 38px; border-radius: 10px">
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 16px">ليفربول</span>
<span style="font-size: 12px; color: #A9B6CC">دوري الشلة · المركز 2</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 10px; background: #10284F"><img src="/_blob/5bd2c4d5326f6c6a577d7a17fa6803e8" alt="العملة المميزة" style="width: 18px; height: 18px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px" dir="ltr">1,250</span></span>
<button type="button" aria-label="الإشعارات" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #10284F; color: #F7F4EA; display: inline-flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 9px; left: 10px; width: 8px; height: 8px; border-radius: 50%; background: #EF4444"></span></button>
</header>

<section aria-label="المباراة القادمة" style="border-radius: 22px; padding: 18px; background: linear-gradient(150deg, #12305E 0%, #0D2348 70%); border: 1px solid rgba(245,184,46,0.22); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; font-weight: 600; color: #F5B82E">الجولة 12 · الليلة 21:00</span>
<span style="font-size: 12px; color: #D9DFEA; background: rgba(247,244,234,0.08); padding: 3px 10px; border-radius: 999px">الحكم: صارم</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 90px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 60px; border-radius: 14px 14px 28px 28px; background: #C8102E; border: 2px solid #F6C343; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px">LIV</span>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">ليفربول</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: #F5B82E" dir="ltr">02:14:36</span>
<span style="font-size: 11px; color: #A9B6CC">على أرضك</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 90px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 60px; border-radius: 14px 14px 28px 28px; background: #FFFFFF; border: 2px solid #DB0007; color: #DB0007; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px">ARS</span>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">آرسنال</span>
</div>
</div>
<a href="MobileLineup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: #F5B82E; color: #0A1F42; text-decoration: none; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">جهّز التشكيلة</a>
</section>

<section aria-label="اختصارات" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 74px; border-radius: 16px; background: #10284F; text-decoration: none; color: #F7F4EA; position: relative">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#F5B82E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg>
<span style="font-size: 12px; font-weight: 600">{{q.label}}</span>
<sc-if value="{{q.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 10px; left: 12px; width: 8px; height: 8px; border-radius: 50%; background: #2BB673"></span></sc-if>
</a>
</sc-for>
</section>

<section aria-label="الترتيب" style="border-radius: 20px; background: #10284F; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px"><h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-size: 15px; font-weight: 700">الترتيب</h2><a href="#" style="font-size: 12px; text-decoration: none">الكل</a></div>
<sc-for list="{{table}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: 10px; background: {{r.bg}}">
<span style="width: 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #F5B82E">{{r.pos}}</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 26px; border-radius: 7px 7px 12px 12px; background: {{r.cbg}}; color: {{r.cfg}}; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700">{{r.code}}</span>
<span style="flex: 1; font-weight: 600; font-size: 14px">{{r.name}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #A9B6CC; width: 30px; text-align: center" dir="ltr">{{r.gd}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; width: 26px; text-align: center">{{r.pts}}</span>
</div>
</sc-for>
</section>

<section aria-label="الرسائل" style="border-radius: 20px; background: #10284F; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-size: 15px; font-weight: 700">الرسائل</h2><span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #EF4444; border-radius: 999px; padding: 1px 8px">3</span></div>
<sc-for list="{{inbox}}" as="m" hint-placeholder-count="2">
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; background: #0D2348">
<span style="flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: {{m.dot}}"></span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 13px">{{m.title}}</span><span style="font-size: 12px; color: #A9B6CC">{{m.body}}</span></div>
</div>
</sc-for>
</section>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  lineup: 'M3 5h18v14H3zM12 5v14M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5',
  tactics: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',
  training: 'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
return {
  quick: [
    { label: 'التشكيلة', icon: I.lineup, dot: false }, { label: 'التكتيك', icon: I.tactics, dot: false },
    { label: 'التدريب', icon: I.training, dot: true }, { label: 'السوق', icon: I.market, dot: false }
  ],
  table: [
    [1, 'آرسنال', 'ARS', '#FFFFFF', '#DB0007', '+14', 26],
    [2, 'ليفربول', 'LIV', '#C8102E', '#FFFFFF', '+12', 25],
    [3, 'مان سيتي', 'MCI', '#6CABDD', '#0A1F42', '+11', 23]
  ].map(([pos, name, code, cbg, cfg, gd, pts]) => ({ pos, name, code, cbg, cfg, gd, pts, bg: name === 'ليفربول' ? 'rgba(245,184,46,0.10)' : 'transparent' })),
  inbox: [
    { dot: '#F5B82E', title: 'عرض من آرسنال', body: 'حمزة يعرض 48 مليون على كودي خاكبو' },
    { dot: '#2F6FDB', title: 'تقرير الكشاف جاهز', body: '3 لاعبين وسط تحت 23 سنة' }
  ],
  tabs: [
    tab('الرئيسية', 'home', '#', true), tab('الفريق', 'team', 'MobileLineup.dc.html'), tab('المباراة', 'ball', 'MobileMatch.dc.html'),
    tab('السوق', 'market', '#'), tab('المزيد', 'more', '#')
  ]
};
}
}
</script>
</body>
</html>
