<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: الفريق</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 22px">الفريق</h1>
<span style="font-size: 12px; color: #A9B6CC">28 لاعباً · القوة <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #F5B82E">84.8</span> · القيمة <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px" dir="ltr">18.6M</span></span>
</div>
<a href="MobileLineup.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(245,184,46,0.14); text-decoration: none; font-size: 13px; font-weight: 700">التشكيلة</a>
</header>

<div style="display: flex; gap: 6px" role="group" aria-label="تصفية حسب الخط">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" style="flex: none; height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{squad}}" as="p" hint-placeholder-count="10">
<a href="{{p.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border-radius: 14px; background: {{p.bg}}; border: 1px solid {{p.border}}; text-decoration: none; color: #F7F4EA">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 22px; border-radius: 6px; background: {{p.posBg}}; color: {{p.posFg}}; font-weight: 700; font-size: 11px">{{p.pos}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 44px; height: 4px; border-radius: 4px; background: rgba(247,244,234,0.12)"><span style="display: block; height: 4px; border-radius: 4px; width: {{p.fit}}%; background: {{p.fitColor}}"></span></span><span style="font-size: 11px; color: {{p.stFg}}">{{p.status}}</span></div>
</div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #A9B6CC" dir="ltr">{{p.value}}</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #163360; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: {{p.ovrColor}}">{{p.ovr}}</span>
</a>
</sc-for>
</div>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const P = { 'ح': ['#F5B82E', '#0A1F42'], 'د': ['#2F6FDB', '#FFFFFF'], 'و': ['#1E9E4A', '#FFFFFF'], 'هـ': ['#F2994A', '#2A1300'] };
const fitColor = (f) => f >= 80 ? '#2BB673' : f >= 60 ? '#F5B82E' : '#F2994A';
const ST = { ok: ['أساسي', '#6FDC97'], bench: ['احتياط', '#A9B6CC'], cap: ['القائد', '#F5B82E'], inj: ['مصاب · مباراتان', '#FF8A8A'], train: ['في التدريب', '#9CC0FF'], tired: ['مرهق', '#FFB877'], sale: ['معروض للبيع', '#FFB877'] };
const rows = [
  ['ح', 'أليسون', 89, 95, 'ok', '980K'],
  ['د', 'فيرجيل فان دايك', 90, 68, 'cap', '940K'],
  ['د', 'إبراهيما كوناتي', 86, 75, 'inj', '1.02M'],
  ['د', 'جيريمي فريمبونغ', 83, 88, 'ok', '860K'],
  ['د', 'ميلوش كيركيز', 82, 58, 'train', '840K'],
  ['و', 'فلوريان فيرتز', 89, 86, 'ok', '1.38M'],
  ['و', 'أليكسيس ماك أليستر', 87, 80, 'ok', '1.16M'],
  ['و', 'رايان خرافنبيرخ', 85, 41, 'tired', '1.04M'],
  ['هـ', 'محمد صلاح', 91, 92, 'ok', '1.45M', true],
  ['هـ', 'ألكسندر إيساك', 88, 88, 'ok', '1.26M']
];
return {
  squad: rows.map(([pos, name, ovr, fit, st, value, sel]) => ({
    pos, name, ovr, fit, value, href: sel ? 'MobilePlayer.dc.html' : '#',
    posBg: P[pos][0], posFg: P[pos][1], fitColor: fitColor(fit), status: ST[st][0], stFg: ST[st][1],
    ovrColor: ovr >= 88 ? '#F5B82E' : '#F7F4EA', bg: sel ? 'rgba(245,184,46,0.10)' : '#10284F', border: sel ? 'rgba(245,184,46,0.5)' : 'transparent'
  })),
  filters: ['الكل 28', 'حراس 4', 'دفاع 10', 'وسط 8', 'هجوم 6'].map((label, i) => ({ label, bg: i === 0 ? '#F5B82E' : '#10284F', fg: i === 0 ? '#0A1F42' : '#C9D2E1' })),
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html', true), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#')]
};
}
}
</script>
</body>
</html>
