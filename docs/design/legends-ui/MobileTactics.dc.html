<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: التكتيك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="MobileHome.dc.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">التكتيك</h1>
<span style="font-size: 12px; color: #A9B6CC">الحكم: صارم · لا يراه الخصم</span>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">حفظ</button>
</header>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(160deg, #12305E 0%, #0D2348 100%); border: 1px solid rgba(43,182,115,0.35)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #A9B6CC">تناسق التكتيك</span>
<div dir="ltr" style="position: relative; height: 6px; border-radius: 6px; background: linear-gradient(90deg, #EF4444 0%, #F2994A 40%, #F5B82E 60%, #2BB673 100%)"><span style="position: absolute; left: 84%; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: #FFFFFF; box-shadow: 0 0 0 2px #0A1F42"></span></div>
</div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: #2BB673" dir="ltr">+2.4%</span>
</div>

<section aria-label="خطة اللعب" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600; font-size: 13px">خطة اللعب</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="5">
<button type="button" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 600">{{p.label}}</button>
</sc-for>
</div>
</section>

<section aria-label="الشدة والإيقاع" style="border-radius: 16px; background: #10284F; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{sliders}}" as="s" hint-placeholder-count="3">
<label style="display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 600; font-size: 13px">{{s.label}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; color: #F5B82E">{{s.v}}</span></span>
<input type="range" min="0" max="100" value="{{s.v}}" style="width: 100%; height: 24px; margin: 0; accent-color: #F5B82E">
<span style="display: flex; justify-content: space-between; font-size: 11px; color: #A9B6CC"><span>{{s.lo}}</span><span>{{s.hi}}</span></span>
</label>
</sc-for>
</section>

<section aria-label="قطع الكرة" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600; font-size: 13px">قطع الكرة</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: #10284F" role="group" aria-label="قطع الكرة">
<sc-for list="{{tackling}}" as="t" hint-placeholder-count="4">
<button type="button" style="height: 38px; border-radius: 9px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 600">{{t.label}}</button>
</sc-for>
</div>
</section>

<section aria-label="التمركز" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600; font-size: 13px">التمركز</span>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; width: 64px; font-size: 12px; color: #C9D2E1"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{l.color}}"></span>{{l.label}}</span>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 10px; background: #10284F" role="group" aria-label="{{l.label}}">
<sc-for list="{{l.opts}}" as="o" hint-placeholder-count="3">
<button type="button" style="height: 36px; padding: 0 2px; border-radius: 8px; border: 0; background: {{o.bg}}; color: {{o.fg}}; font-size: 11px; font-weight: 600">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
</section>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const seg = (labels, sel) => labels.map((label, i) => ({ label, bg: i === sel ? '#F5B82E' : 'transparent', fg: i === sel ? '#0A1F42' : '#C9D2E1' }));
return {
  plans: ['هجوم مرتد', 'تسديد عن بعد', 'كرات طويلة', 'تمريرات', 'لعب على الأجنحة'].map((label, i) => ({ label, bg: i === 3 ? 'rgba(245,184,46,0.12)' : '#10284F', border: i === 3 ? '#F5B82E' : 'transparent', fg: i === 3 ? '#F5B82E' : '#D9DFEA' })),
  sliders: [
    { label: 'الضغط على الخصم', v: 60, lo: 'منخفض', hi: 'عالٍ' },
    { label: 'الأسلوب', v: 65, lo: 'دفاعي', hi: 'هجومي' },
    { label: 'إيقاع اللعب', v: 55, lo: 'هادئ', hi: 'سريع' }
  ],
  tackling: seg(['قانوني', 'عادي', 'حماس', 'خشونة'], 1),
  lines: [
    { label: 'الهجوم', color: '#F2994A', opts: seg(['ارتداد', 'مساندة الوسط', 'هجوم فقط'], 1) },
    { label: 'الوسط', color: '#1E9E4A', opts: seg(['مساندة الدفاع', 'بقاء', 'اندفاع'], 1) },
    { label: 'الدفاع', color: '#2F6FDB', opts: seg(['بقاء', 'هجوم الظهيرين', 'مساندة الوسط'], 1) }
  ],
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html', true), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#')]
};
}
}
</script>
</body>
</html>
