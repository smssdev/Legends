<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: التدريب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="MobileHome.dc.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">التدريب</h1>
<span style="font-size: 12px; color: #A9B6CC">جلسة كل 8 ساعات · 100% = قوة +1</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; background: #10284F"><img src="/_blob/5bd2c4d5326f6c6a577d7a17fa6803e8" alt="العملة المميزة" style="width: 18px; height: 18px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px" dir="ltr">1,250</span></span>
</header>

<section aria-label="خانات التدريب" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
<article style="border-radius: 18px; padding: 12px; background: {{s.cardBg}}; border: 1.5px solid {{s.border}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 20px; border-radius: 6px; background: {{s.posBg}}; color: {{s.posFg}}; font-weight: 700; font-size: 11px">{{s.pos}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: {{s.timeColor}}" dir="ltr">{{s.time}}</span>
</div>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{s.ovr}}</span>
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="{{s.bar}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: {{s.bar}}">{{s.next}}</span>
</div>
<div style="display: flex; align-items: center; gap: 6px"><span style="flex: 1; height: 8px; border-radius: 8px; background: rgba(247,244,234,0.1)"><span style="display: block; height: 8px; border-radius: 8px; width: {{s.pct}}%; background: {{s.bar}}"></span></span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: {{s.bar}}" dir="ltr">{{s.pct}}%</span></div>
<sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #2BB673; color: #062B17; font-weight: 700; font-size: 13px">لاعب جديد</button>
</sc-if>
<sc-if value="{{s.running}}" hint-placeholder-val="{{ true }}">
<button type="button" style="height: 44px; border-radius: 12px; border: 0; background: rgba(245,184,46,0.14); color: #F5B82E; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px">أنهِ الآن <img src="/_blob/5bd2c4d5326f6c6a577d7a17fa6803e8" alt="" style="width: 16px; height: 16px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px">{{s.coins}}</span></button>
</sc-if>
</article>
</sc-for>
</section>

<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #10284F; text-decoration: none; color: #F7F4EA">
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">منشأة التدريب</span><span style="color: #A9B6CC">المرحلة 1 من 3</span></span><span style="display: flex; gap: 3px"><sc-for list="{{facility}}" as="f" hint-placeholder-count="15"><span style="flex: 1; height: 6px; border-radius: 2px; background: {{f}}"></span></sc-for></span></span>
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#A9B6CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{extras}}" as="e" hint-placeholder-count="2">
<a href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: linear-gradient(160deg, #12305E 0%, #0D2348 100%); border: 1px solid rgba(245,184,46,0.22); text-decoration: none; color: #F7F4EA">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(245,184,46,0.14)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#F5B82E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.icon}}"></path></svg></span>
<span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">{{e.title}}</span>
<span style="font-size: 12px; color: #A9B6CC; line-height: 1.5">{{e.body}}</span>
</a>
</sc-for>
</div>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const P = { 'ح': ['#F5B82E', '#0A1F42'], 'د': ['#2F6FDB', '#FFFFFF'], 'و': ['#1E9E4A', '#FFFFFF'], 'هـ': ['#F2994A', '#2A1300'] };
const slots = [
  ['ح', 'مامارداشفيلي', 84, 64, '03:12:40', 20],
  ['د', 'ميلوش كيركيز', 82, 82, '05:40:05', 30],
  ['و', 'كيرتس جونز', 80, 31, '07:55:18', 35],
  ['هـ', 'هوغو إيكيتيكي', 83, 100, 'اكتمل', 0]
].map(([pos, name, ovr, pct, time, coins]) => {
  const done = pct >= 100;
  return {
    pos, name, ovr, next: ovr + 1, pct, time, coins, done, running: !done, posBg: P[pos][0], posFg: P[pos][1],
    bar: done ? '#2BB673' : '#F5B82E', timeColor: done ? '#6FDC97' : '#A9B6CC',
    cardBg: done ? 'linear-gradient(160deg, rgba(43,182,115,0.18) 0%, #10284F 70%)' : '#10284F', border: done ? 'rgba(43,182,115,0.55)' : 'transparent'
  };
});
return {
  slots,
  facility: Array.from({ length: 15 }, (_, i) => i < 5 ? '#F5B82E' : i < 7 ? 'rgba(245,184,46,0.4)' : 'rgba(247,244,234,0.12)'),
  extras: [
    { title: 'معسكر التدريب', body: 'تقدم مكثف لمجموعة لاعبين', icon: 'M3 20l9-15 9 15zM9 20l3-5 3 5' },
    { title: 'التدريب السري', body: 'دفعة لخط واحد قبل المباراة', icon: 'M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5zM12 15v2' }
  ],
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html', true), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#')]
};
}
}
</script>
</body>
</html>
