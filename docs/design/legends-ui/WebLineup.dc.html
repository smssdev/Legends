<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends: التشكيلة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="min-height: 1000px; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="القائمة الرئيسية" style="flex: 1 1 248px; max-width: 280px; box-sizing: border-box; padding: 24px 16px; background: #081A38; border-left: 1px solid rgba(247,244,234,0.06); display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<img src="/_blob/3db7f68e0ee8f757e178e4c66bed01da" alt="" style="width: 44px; height: 44px; border-radius: 12px">
<span style="font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 1.5px; color: #F5B82E" dir="ltr">LEGENDS</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="11">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.weight}}; font-size: 15px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
</a>
</sc-for>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 260px">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 28px">التشكيلة</h1>
<span style="font-size: 14px; color: #A9B6CC">ليفربول ضد آرسنال · يُقفل التعديل بعد <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #F5B82E" dir="ltr">02:09:36</span></span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid rgba(245,184,46,0.5); background: transparent; color: #F5B82E; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">تحسين تلقائي</button>
<button type="button" style="height: 44px; padding: 0 22px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 15px">احفظ التشكيلة</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<sc-for list="{{formations}}" as="f" hint-placeholder-count="6">
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section aria-label="الملعب" style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 8px">
<sc-for list="{{counters}}" as="c" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; background: #10284F; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.color}}"></span>{{c.label}} <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700" dir="ltr">{{c.n}}</span><span style="color: #A9B6CC; font-size: 12px">({{c.range}})</span></span>
</sc-for>
</div>
<div style="display: flex; padding: 4px; border-radius: 12px; background: #10284F" role="group" aria-label="ما يظهر فوق اللاعبين">
<sc-for list="{{views}}" as="v" hint-placeholder-count="4">
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 9px; border: 0; background: {{v.bg}}; color: {{v.fg}}; font-size: 13px; font-weight: 600">{{v.label}}</button>
</sc-for>
</div>
</div>
<div dir="ltr" style="position: relative; height: 720px; border-radius: 22px; overflow: hidden; background: repeating-linear-gradient(180deg, #1A8A42 0px, #1A8A42 60px, #1E9E4A 60px, #1E9E4A 120px); border: 1px solid rgba(247,244,234,0.12)">
<svg viewBox="0 0 100 140" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0"><g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.4"><rect x="4" y="3" width="92" height="134"></rect><line x1="4" y1="70" x2="96" y2="70"></line><circle cx="50" cy="70" r="11"></circle><rect x="24" y="3" width="52" height="20"></rect><rect x="38" y="3" width="24" height="7"></rect><rect x="24" y="117" width="52" height="20"></rect><rect x="38" y="130" width="24" height="7"></rect></g></svg>
<sc-for list="{{xi}}" as="p" hint-placeholder-count="11">
<div style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: 104px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: #0A1F42; border: 3px solid {{p.ring}}; box-shadow: 0 6px 16px rgba(0,0,0,0.35); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #F7F4EA">{{p.ovr}}</span>
<span dir="rtl" style="max-width: 104px; padding: 2px 8px; border-radius: 8px; background: rgba(8,26,56,0.85); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
<span style="width: 60px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25)"><span style="display: block; height: 4px; border-radius: 4px; width: {{p.fit}}%; background: {{p.fitColor}}"></span></span>
</div>
</sc-for>
</div>
</section>

<aside style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<section aria-label="الاحتياط" style="border-radius: 20px; background: #10284F; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-size: 17px; font-weight: 700">الاحتياط والبدلاء</h2>
<span style="font-size: 12px; color: #A9B6CC">اسحب لاعباً إلى الملعب</span>
</div>
<sc-for list="{{bench}}" as="b" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; background: #0D2348">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 26px; border-radius: 8px; background: {{b.posBg}}; color: {{b.posFg}}; font-weight: 700; font-size: 12px">{{b.pos}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; font-size: 14px">{{b.name}}</span>
<span style="font-size: 12px; color: {{b.noteColor}}">{{b.note}}</span>
</div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: {{b.fitColor}}" dir="ltr">{{b.fit}}%</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: #163360; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; color: #F5B82E">{{b.ovr}}</span>
</div>
</sc-for>
</section>

<section aria-label="منفذو الكرات الثابتة" style="border-radius: 20px; background: #10284F; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-size: 17px; font-weight: 700">منفذو الكرات الثابتة</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{setPieces}}" as="s" hint-placeholder-count="4">
<div style="padding: 10px 12px; border-radius: 12px; background: #0D2348; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #A9B6CC">{{s.role}}</span>
<span style="font-weight: 600; font-size: 14px">{{s.name}}</span>
</div>
</sc-for>
</div>
</section>

</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  lineup: 'M3 5h18v14H3zM12 5v14M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5',
  tactics: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',
  training: 'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  scout: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
  stadium: 'M3 10c0-2 4-4 9-4s9 2 9 4v6c0 2-4 4-9 4s-9-2-9-4zM3 10c0 2 4 4 9 4s9-2 9-4',
  finance: 'M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l3-3h11M16 13h2',
  league: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3',
  mail: 'M3 6h18v12H3zM3 7l9 6 9-6'
};
const nav = [
  ['الرئيسية', 'home', 'WebHome.dc.html'], ['الفريق', 'team'], ['التشكيلة', 'lineup', '#', true], ['التكتيك', 'tactics'],
  ['التدريب', 'training'], ['السوق', 'market'], ['الكشاف', 'scout'], ['الملعب', 'stadium'],
  ['المالية', 'finance'], ['الدوري والكأس', 'league'], ['المباراة الحية', 'league', 'WebMatch.dc.html']
].map(([label, k, href, active]) => ({
  label, icon: I[k], href: href || '#',
  bg: active ? 'rgba(245,184,46,0.14)' : 'transparent', fg: active ? '#F5B82E' : '#C9D2E1', weight: active ? 600 : 400
}));
const fitColor = (f) => f >= 80 ? '#2BB673' : f >= 60 ? '#F5B82E' : '#F2994A';
const ring = { GK: '#F5B82E', D: '#2F6FDB', M: '#1E9E4A', A: '#F2994A' };
const xi = [
  ['أليسون', 'GK', 89, 95, 50, 89],
  ['فريمبونغ', 'D', 83, 88, 84, 70], ['غوميز', 'D', 79, 90, 62, 76], ['فان دايك', 'D', 90, 68, 38, 76], ['كيركيز', 'D', 82, 58, 16, 70],
  ['خرافنبيرخ', 'M', 85, 41, 50, 57], ['فيرتز', 'M', 89, 86, 72, 45], ['ماك أليستر', 'M', 87, 80, 28, 45],
  ['صلاح', 'A', 91, 92, 82, 20], ['إيساك', 'A', 88, 88, 50, 14], ['خاكبو', 'A', 84, 84, 18, 20]
].map(([name, line, ovr, fit, x, y]) => ({ name, ovr, fit, x, y, ring: ring[line], fitColor: fitColor(fit) }));
const P = { 'ح': ['#F5B82E', '#0A1F42'], 'د': ['#2F6FDB', '#FFFFFF'], 'و': ['#1E9E4A', '#FFFFFF'], 'هـ': ['#F2994A', '#2A1300'] };
const bench = [
  ['ح', 'جورجي مامارداشفيلي', 84, 100, 'احتياط', '#A9B6CC'],
  ['د', 'أندي روبرتسون', 82, 97, 'احتياط', '#A9B6CC'],
  ['و', 'دومينيك سوبوسلاي', 83, 94, 'احتياط', '#A9B6CC'],
  ['و', 'واتارو إندو', 79, 99, 'احتياط', '#A9B6CC'],
  ['هـ', 'فيديريكو كييزا', 81, 96, 'احتياط', '#A9B6CC'],
  ['هـ', 'هوغو إيكيتيكي', 84, 91, 'احتياط · تدرب +1', '#6FDC97'],
  ['د', 'إبراهيما كوناتي', 86, 75, 'مصاب · مباراتان', '#FF8A8A'],
  ['و', 'كيرتس جونز', 80, 88, 'خارج القائمة', '#A9B6CC']
].map(([pos, name, ovr, fit, note, noteColor]) => ({ pos, name, ovr, fit, note, noteColor, posBg: P[pos][0], posFg: P[pos][1], fitColor: fitColor(fit) }));
return {
  nav, xi, bench,
  formations: ['4-3-3 A', '4-2-3-1', '4-4-2 B', '3-5-2', '5-3-2', 'مخصصة 1'].map((label, i) => ({
    label, bg: i === 0 ? 'rgba(245,184,46,0.14)' : '#10284F', fg: i === 0 ? '#F5B82E' : '#D9DFEA', border: i === 0 ? 'rgba(245,184,46,0.6)' : 'transparent'
  })),
  counters: [
    { label: 'دفاع', n: 4, range: '3-6', color: '#2F6FDB' },
    { label: 'وسط', n: 3, range: '2-6', color: '#1E9E4A' },
    { label: 'هجوم', n: 3, range: '1-5', color: '#F2994A' }
  ],
  views: ['اللياقة', 'القوة', 'الأهداف', 'السن'].map((label, i) => ({ label, bg: i === 0 ? '#F5B82E' : 'transparent', fg: i === 0 ? '#0A1F42' : '#C9D2E1' })),
  setPieces: [
    { role: 'القائد', name: 'فيرجيل فان دايك' }, { role: 'ركلات الجزاء', name: 'محمد صلاح' },
    { role: 'الضربات الحرة', name: 'فلوريان فيرتز' }, { role: 'الركنيات', name: 'أليكسيس ماك أليستر' }
  ]
};
}
}
</script>
</body>
</html>
