<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Legends موبايل: المالية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="#" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">المالية</h1>
</header>

<section aria-label="الرصيد" style="border-radius: 20px; padding: 16px; background: linear-gradient(160deg, #12305E 0%, #0D2348 100%); border: 1px solid rgba(245,184,46,0.3); display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: #A9B6CC">أموال النادي</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; color: #F5B82E" dir="ltr">3,240,000</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="padding: 8px 10px; border-radius: 12px; background: rgba(8,26,56,0.6); display: flex; flex-direction: column"><span style="font-size: 11px; color: #A9B6CC">دخل الموسم</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; color: #6FDC97" dir="ltr">+1.86M</span></div>
<div style="padding: 8px 10px; border-radius: 12px; background: rgba(8,26,56,0.6); display: flex; flex-direction: column"><span style="font-size: 11px; color: #A9B6CC">مصاريف الموسم</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; color: #FFB877" dir="ltr">−1.62M</span></div>
</div>
</section>

<section aria-label="رعاة القطاعات" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">رعاة القطاعات</span><span style="font-size: 11px; color: #A9B6CC">لكل مباراة على أرضك</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sponsors}}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: #10284F; border: 1px dashed {{s.dash}}">
<span style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: {{s.markBg}}; color: {{s.markFg}}; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 14px">{{s.mark}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A9B6CC">{{s.stand}}</span><span style="font-size: 12px; font-weight: 600; color: {{s.fg}}" dir="{{s.dir}}">{{s.line}}</span></div>
</div>
</sc-for>
</div>
</section>

<section aria-label="آخر الحركات" style="border-radius: 18px; background: #10284F; padding: 10px 12px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0 6px"><span style="font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">آخر الحركات</span><a href="#" style="display: inline-flex; align-items: center; height: 36px; font-size: 12px; font-weight: 700; text-decoration: none">السجل كاملاً</a></div>
<sc-for list="{{ledger}}" as="l" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(247,244,234,0.06)">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.desc}}</span><span style="font-size: 11px; color: #A9B6CC">ج{{l.r}} · {{l.type}}</span></div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: {{l.color}}" dir="ltr">{{l.amount}}</span>
</div>
</sc-for>
</section>

</div>

<nav aria-label="التنقل" style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; box-sizing: border-box; padding: 8px 12px 20px; background: rgba(8,26,56,0.96); border-top: 1px solid rgba(247,244,234,0.08); display: flex; align-items: center; justify-content: space-around">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; height: 56px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: {{t.weight}}">{{t.label}}</span>
</a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  team: 'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8',
  market: 'M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',
  ball: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z',
  more: 'M5 12h.01M12 12h.01M19 12h.01'
};
const tab = (label, k, href, active) => ({ label, icon: I[k], href, fg: active ? '#F5B82E' : '#A9B6CC', bg: active ? 'rgba(245,184,46,0.12)' : 'transparent', weight: active ? 700 : 500 });
const fmt = (n) => n.toLocaleString('en-US');
return {
  sponsors: [
    ['الشمالي', 'ص', '#2F6FDB', '#FFFFFF', '+28K'], ['الجنوبي', 'أ', '#F5B82E', '#0A1F42', '+24K'],
    ['الشرقي', 'ر', '#1E9E4A', '#FFFFFF', '+20K'], ['الغربي', '+', 'rgba(247,244,234,0.08)', '#A9B6CC', null]
  ].map(([stand, mark, markBg, markFg, inc]) => ({
    stand: 'المدرج ' + stand, mark, markBg, markFg, line: inc || 'اختر عقداً', fg: inc ? '#6FDC97' : '#F5B82E', dir: inc ? 'ltr' : 'rtl', dash: inc ? 'transparent' : 'rgba(245,184,46,0.45)'
  })),
  ledger: [
    [11, 'رواتب', 'رواتب الجولة 11', -96000], [11, 'رعاة', '3 قطاعات · على أرضك', 72000], [11, 'تذاكر', 'ليفربول 2-1 نيوكاسل', 118000],
    [11, 'مكافأة', 'فوز', 50000], [10, 'تدريب', 'جلسة · ميلوش كيركيز', -25000]
  ].map(([r, type, desc, amt]) => ({ r, type, desc, amount: (amt > 0 ? '+' : '−') + fmt(Math.abs(amt)), color: amt > 0 ? '#6FDC97' : '#FFB877' })),
  tabs: [tab('الرئيسية', 'home', 'MobileHome.dc.html'), tab('الفريق', 'team', 'MobileSquad.dc.html'), tab('المباراة', 'ball', 'MobileMatch.dc.html'), tab('السوق', 'market', 'MobileMarket.dc.html'), tab('المزيد', 'more', '#', true)]
};
}
}
</script>
</body>
</html>
