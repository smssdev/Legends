<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legends: تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
input::placeholder{color:#7F8DA8}
</style>
</head>
<body>
<div dir="rtl" style="min-height: 900px; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-wrap: wrap">

<section aria-label="عن Legends" style="flex: 1 1 480px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px; background: radial-gradient(120% 90% at 80% 10%, #163A70 0%, #0D2348 45%, #071733 100%); display: flex; flex-direction: column; justify-content: center; gap: 32px">
<svg viewBox="0 0 105 68" width="900" height="583" aria-hidden="true" style="position: absolute; left: -260px; bottom: -160px; opacity: 0.07"><g fill="none" stroke="#F7F4EA" stroke-width="0.5"><rect x="1" y="1" width="103" height="66"></rect><line x1="52.5" y1="1" x2="52.5" y2="67"></line><circle cx="52.5" cy="34" r="9"></circle><rect x="1" y="17" width="16" height="34"></rect><rect x="88" y="17" width="16" height="34"></rect></g></svg>
<img src="assets/logo-512.png" alt="Legends" style="width: 220px; height: 220px; border-radius: 32px; position: relative">
<div style="display: flex; flex-direction: column; gap: 14px; position: relative; max-width: 520px">
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.25">دوريك. فريقك. <span style="color: #F5B82E">أسطورتك.</span></h1>
<p style="margin: 0; font-size: 18px; line-height: 1.8; color: #C9D2E1">درّب ناديك المفضل ضد أصحابك، وعِش كل مباراة لحظة بلحظة.</p>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; position: relative">

<li style="display: flex; align-items: center; gap: 12px; font-size: 16px"><span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(245,184,46,0.14); color: #F5B82E"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7l4 3-1.5 4.5h-5L8 10z"></path></svg></span>مباراة حية: تبدّل وتغيّر تكتيكك لحظياً</li>

<li style="display: flex; align-items: center; gap: 12px; font-size: 16px"><span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(245,184,46,0.14); color: #F5B82E"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-2a4 4 0 0 0-3-3.9"></path></svg></span>دوريات خاصة بكود مع أصحابك</li>

<li style="display: flex; align-items: center; gap: 12px; font-size: 16px"><span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(245,184,46,0.14); color: #F5B82E"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path></svg></span>أندية ولاعبون حقيقيون، ودوري وكأس كل موسم</li>

</ul>
</section>

<section aria-label="تسجيل الدخول" style="flex: 1 1 420px; box-sizing: border-box; padding: 56px 24px; display: flex; align-items: center; justify-content: center">
<form style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 30px">أهلاً بعودتك</h2>
<p style="margin: 0; font-size: 15px; color: #A9B6CC">ادخل لتكمل موسمك</p>
</div>
<button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #FFFFFF; color: #1F2937; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 12px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #4285F4">G</span>المتابعة بحساب Google</button>
<div style="display: flex; align-items: center; gap: 12px; color: #7F8DA8; font-size: 13px"><span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span>أو بالبريد<span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">البريد الإلكتروني
<input type="email" dir="ltr" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">
<span style="display: flex; justify-content: space-between">كلمة المرور<a href="#" style="font-weight: 500; font-size: 13px; text-decoration: none">نسيت كلمة المرور؟</a></span>
<input type="password" dir="ltr" value="password1" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(245,184,46,0.6); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #C9D2E1"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #F5B82E">تذكرني على هذا الجهاز</label>
<button type="submit" style="height: 54px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 17px">دخول</button>
<p style="margin: 0; text-align: center; font-size: 14px; color: #A9B6CC">ليس لديك حساب؟ <a href="WebRegister.html" style="font-weight: 600; text-decoration: none">أنشئ حساباً</a></p>
</form>
</section>

</div>
</body>
</html>
