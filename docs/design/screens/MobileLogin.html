<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legends موبايل: تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
input::placeholder{color:#7F8DA8}
</style>
</head>
<body>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 40px 22px 28px; background: radial-gradient(120% 60% at 50% 0%, #163A70 0%, #0A1F42 60%); color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<img src="assets/logo-512.png" alt="Legends" style="width: 150px; height: 150px; border-radius: 28px">
<h1 style="margin: 4px 0 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 26px">أهلاً بعودتك</h1>
<p style="margin: 0; font-size: 14px; color: #A9B6CC">ادخل لتكمل موسمك</p>
</div>
<button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #FFFFFF; color: #1F2937; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; color: #4285F4">G</span>المتابعة بحساب Google</button>
<div style="display: flex; align-items: center; gap: 10px; color: #7F8DA8; font-size: 12px"><span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span>أو بالبريد<span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">البريد الإلكتروني
<input type="email" dir="ltr" placeholder="you@example.com" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
<span style="display: flex; justify-content: space-between">كلمة المرور<a href="#" style="font-weight: 500; font-size: 12px; text-decoration: none">نسيتها؟</a></span>
<input type="password" dir="ltr" value="password1" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(245,184,46,0.6); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
</label>
<button type="submit" style="height: 54px; margin-top: 4px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 17px">دخول</button>
<div style="flex: 1"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #A9B6CC">ليس لديك حساب؟ <a href="MobileRegister.html" style="font-weight: 600; text-decoration: none">أنشئ حساباً</a></p>
</div>
</body>
</html>
