<!doctype html>

<span style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 50px; border-radius: 10px; background: #10284F; border: 1.5px solid rgba(245,184,46,0.55); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 25px; color: #F5B82E">9</span>

<div style="padding: 8px 10px; border-radius: 10px; background: #0D2348; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A9B6CC">الميزانية</span><span style="font-weight: 600; font-size: 13px">3 ملايين</span></div>

<span style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(245,184,46,0.12)"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#F5B82E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"></path></svg></span>
<h2 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 19px">طلبك وصل لسليمان</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #C9D2E1">سنرسل لك إشعاراً فور الموافقة، وبعدها تختار فريقك.</p>
</section>
<div style="flex: 1"></div>
<button type="button" style="height: 50px; border-radius: 14px; border: 0; background: rgba(247,244,234,0.08); color: #F7F4EA; font-size: 15px">إلغاء الطلب</button>
