<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">

<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 14px">حفظ</button>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(160deg, #12305E 0%, #0D2348 100%); border: 1px solid rgba(43,182,115,0.35)">

<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: #2BB673" dir="ltr">+2.4%</span>

<button type="button" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid transparent; background: #10284F; color: #D9DFEA; font-size: 13px; font-weight: 600">هجوم مرتد</button>

<button type="button" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #F5B82E; background: rgba(245,184,46,0.12); color: #F5B82E; font-size: 13px; font-weight: 600">تمريرات</button>
