<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>

<body>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 20px 22px 24px; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<a href="MobileLogin.html" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<img src="assets/icon-512.png" alt="" style="width: 36px; height: 36px; border-radius: 10px">
<span style="font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 1.5px; color: #F5B82E" dir="ltr">LEGENDS</span>
</div>
<div style="padding: 12px 14px; border-radius: 14px; background: rgba(245,184,46,0.10); border: 1px solid rgba(245,184,46,0.35); display: flex; align-items: center; gap: 12px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 800">س</span>
<div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">سليمان دعاك إلى «دوري الشلة»</span><span style="font-size: 12px; color: #C9D2E1">الدوري الإنجليزي · يبدأ السبت</span></div>
</div>
<h1 style="margin: 4px 0 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 24px">أنشئ حسابك</h1>
<button type="button" style="height: 50px; border-radius: 14px; border: 0; background: #FFFFFF; color: #1F2937; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; color: #4285F4">G</span>التسجيل بحساب Google</button>
<div style="display: flex; align-items: center; gap: 10px; color: #7F8DA8; font-size: 12px"><span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span>أو بالبريد<span style="flex: 1; height: 1px; background: rgba(247,244,234,0.12)"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">اسمك في اللعبة
<input type="text" placeholder="مثلاً: كوتش حمزة" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; color: #F7F4EA; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">البريد الإلكتروني
<input type="email" dir="ltr" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">كلمة المرور
<input type="password" dir="ltr" value="legends2026" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; color: #F7F4EA; font-size: 16px; text-align: left">
<span style="display: flex; gap: 5px"><span style="flex: 1; height: 4px; border-radius: 4px; background: #2BB673"></span><span style="flex: 1; height: 4px; border-radius: 4px; background: #2BB673"></span><span style="flex: 1; height: 4px; border-radius: 4px; background: #2BB673"></span><span style="flex: 1; height: 4px; border-radius: 4px; background: rgba(247,244,234,0.12)"></span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #C9D2E1; line-height: 1.6"><input type="checkbox" checked style="width: 18px; height: 18px; margin-top: 2px; accent-color: #F5B82E">أوافق على <a href="#" style="text-decoration: none">الشروط</a> و<a href="#" style="text-decoration: none">سياسة الخصوصية</a></label>
<div style="flex: 1"></div>
<button type="submit" style="height: 54px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 17px">إنشاء الحساب</button>
<p style="margin: 0; text-align: center; font-size: 13px; color: #A9B6CC">عندك حساب؟ <a href="MobileLogin.html" style="font-weight: 600; text-decoration: none">سجّل الدخول</a></p>
</div>
