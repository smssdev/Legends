<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legends موبايل: إنشاء دوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1F42}
a{color:#F5B82E}a:hover{color:#FFD36B}
</style>
</head>
<body>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1F42; color: #F7F4EA; font-family: 'IBM Plex Sans Arabic', sans-serif">
<div style="box-sizing: border-box; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<a href="#" aria-label="رجوع" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #10284F; color: #F7F4EA"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 20px">أنشئ دوريك</h1>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">اسم الدوري
<span style="display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; font-weight: 500; font-size: 16px">دوري الشلة</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">القالب
<span style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(247,244,234,0.14); background: #10284F; font-weight: 500; font-size: 15px">الدوري الإنجليزي<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#A9B6CC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</label>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #10284F">
<span style="flex: 1; font-size: 13px; font-weight: 600">عدد الفرق</span>
<button type="button" aria-label="أقل" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0D2348; color: #F7F4EA; font-size: 20px">−</button>
<span style="width: 40px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #F5B82E">16</span>
<button type="button" aria-label="أكثر" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0D2348; color: #F7F4EA; font-size: 20px">+</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 10px 12px; border-radius: 14px; background: #10284F; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A9B6CC">البداية</span><span style="font-weight: 600; font-size: 14px">السبت · 21:00</span></div>
<div style="padding: 10px 12px; border-radius: 14px; background: #10284F; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A9B6CC">الإعداد</span><span style="font-weight: 600; font-size: 14px">يومان</span></div>
<div style="padding: 10px 12px; border-radius: 14px; background: #10284F; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A9B6CC">الجولات</span><span style="font-weight: 600; font-size: 14px">جولة يومياً</span></div>
<div style="padding: 10px 12px; border-radius: 14px; background: #10284F; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A9B6CC">الميزانية</span><span style="font-weight: 600; font-size: 14px">3 ملايين</span></div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #10284F">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">دوري نزيه</span><span style="font-size: 12px; color: #A9B6CC">بلا عملة مميزة داخله</span></div>
<span role="switch" aria-checked="true" aria-label="دوري نزيه" style="display: inline-flex; align-items: center; width: 52px; height: 30px; padding: 3px; box-sizing: border-box; border-radius: 999px; background: #2BB673"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: rgba(245,184,46,0.08); border: 1px solid rgba(245,184,46,0.3)">
<span style="font-size: 12px; font-weight: 700; color: #F5B82E">ملخص الموسم</span>
<span style="font-size: 13px; color: #D9DFEA">30 جولة · كأس من دور 16 · حوالي 37 يوماً</span>
<span style="font-size: 12px; color: #A9B6CC">الإعدادات تُقفل عند بداية الموسم</span>
</div>
</div>
<div style="position: absolute; bottom: 0; left: 0; right: 0; box-sizing: border-box; padding: 14px 16px 24px; background: rgba(8,26,56,0.97); border-top: 1px solid rgba(247,244,234,0.08)">
<button type="button" style="width: 100%; height: 54px; border-radius: 14px; border: 0; background: #F5B82E; color: #0A1F42; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 17px">أنشئ الدوري واختر فريقك</button>
</div>
</div>
</body>
</html>
