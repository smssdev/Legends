# [Sprint 51 B5] The game's site in CloudPanel (Sites → gamelegendmanager.online → Vhost), kept here so it is never only
# on the server. CloudPanel's reverse-proxy template adds its own security headers (X-Frame-Options, X-XSS-Protection,
# Referrer-Policy "same-origin", X-Permitted-Cross-Domain-Policies...): the game now sends its own on every answer
# (App\Http\Security\SecurityPolicy, from Laravel and from deploy/docker/router.php), so the template's are removed
# below and each header leaves once. Paste the server blocks into the Vhost editor (keep CloudPanel's certificate lines
# as they are), save, and check: curl -sI https://gamelegendmanager.online/ | sort
# Sprint 52 changes this file again (Nginx serves the built files itself).

server {
  listen 80;
  listen [::]:80;
  server_name gamelegendmanager.online www.gamelegendmanager.online srv2100776.hstgr.cloud;
  return 301 https://gamelegendmanager.online$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name gamelegendmanager.online www.gamelegendmanager.online srv2100776.hstgr.cloud;
  # {{ssl_certificate_key}} and {{ssl_certificate}}: CloudPanel's own lines, unchanged.

  # No security headers here: the game sends them (one copy each). Nor "server_tokens": off hides nginx's version.
  server_tokens off;
  client_max_body_size 20m;

  # Reverb's WebSocket (/app, and /apps for its HTTP API).
  location ~ ^/apps?/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    # The game compresses its own files (Brotli and gzip made at build time): no second pass.
    proxy_buffering on;
    proxy_read_timeout 60s;
    # Hide what PHP or a library might still add.
    proxy_hide_header X-Powered-By;
  }
}
