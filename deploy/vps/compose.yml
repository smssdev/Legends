# [X48] The game on our own server (Hostinger KVM 1, docs/PLAN.md 8.3): the same image as Render, beside its own
# PostgreSQL. CloudPanel's nginx gives HTTPS and passes the requests to 127.0.0.1:8000.
# Run by deploy/vps/deploy.sh, with the secrets in /opt/legends/.env on the server (never in the repository).
name: legends
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: legends
      POSTGRES_DB: legends
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in /opt/legends/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legends -d legends"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../..
    image: legends:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: /opt/legends/.env
    environment:
      DATABASE_URL: postgresql://legends:${DB_PASSWORD}@db:5432/legends
      DB_SSLMODE: disable
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The copies before each deploy's migrations (db:backup), kept across deploys.
      - backups:/app/backend/database/backups

volumes:
  pgdata:
  backups:
