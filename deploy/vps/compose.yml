# [X48] The game on our own server (Hostinger KVM 1, README.md): the game's image (Dockerfile), beside its own
# PostgreSQL. CloudPanel's nginx gives HTTPS and passes the requests to 127.0.0.1:8000 (the site and the API) and
# 127.0.0.1:8080 (/app: Reverb's WebSocket).
# Run by deploy/vps/deploy.sh, with the secrets in /opt/legends/.env on the server (never in the repository).
#
# [Sprint 52 B4, B5] A service per job, all from the one image (ROLE in deploy/docker/start.sh): `app` is the site and
# the API (and the only one that migrates; its container keeps the name legends-app-1 that the scripts and the docs
# use), `queue`, `scheduler`, `matches` (the live matches' runner) and `reverb`. Redis keeps the cache, the sessions
# and the queue in memory for all of them. One that stops is restarted by Docker alone, and a deploy rebuilds the image
# once for all of them.
name: legends
# [Sprint 21 E8.7] Docker keeps each container's output in files on the disk: five of 10 MB at most, then the oldest goes.
x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# What every game service shares: the image, the secrets, the database, Redis and Reverb's address.
x-game: &game
  image: legends:latest
  # Built once by `app` (its build: below), never pulled from a registry.
  pull_policy: never
  restart: unless-stopped
  logging: *logs
  env_file: /opt/legends/.env
  networks: [glm]
  # The FrankenPHP image checks Caddy's admin port, closed here; `app` checks the game's health instead (below), and
  # the others have no web server to ask.
  healthcheck:
    disable: true
  environment: &game-env
    DATABASE_URL: postgresql://legends:${DB_PASSWORD}@db:5432/legends
    DB_SSLMODE: disable
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD in /opt/legends/.env (deploy.sh makes it)}
    # [Sprint 52 B8] The server's nginx reaches the containers through this network's gateway: its X-Forwarded-*
    # headers are trusted, nobody else's.
    TRUSTED_PROXIES: 172.28.0.0/16,127.0.0.1
    # Live updates: the web connects to wss://<site>/app with the key built into it (web/src/lib/echo.ts, public by
    # design); the secret is made on the server (deploy.sh). The services publish to the reverb service.
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: legends
    REVERB_APP_KEY: legends-dev-key
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logs
    networks: [glm]
    environment:
      POSTGRES_USER: legends
      POSTGRES_DB: legends
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in /opt/legends/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legends -d legends"]
      interval: 5s
      timeout: 5s
      retries: 20

  # [Sprint 52 B4] In memory, with a copy on the disk (appendonly) so the queued jobs and the sessions survive a
  # restart. No port outside Docker's network, and a password.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logs
    networks: [glm]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "300mb", "--maxmemory-policy", "noeviction", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    <<: *game
    # Built here (deploy.sh passes --build); never pulled. legends-set's `up -d` reuses the image as it is.
    pull_policy: missing
    build:
      context: ../..
      # [Sprint 39 B3] The site's address for the web build (canonical links, sitemap): the domain is one setting.
      args:
        PUBLIC_URL: ${PUBLIC_URL:-https://gamelegendmanager.online}
    environment:
      <<: *game-env
      ROLE: web
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The copies before each deploy's migrations (db:backup), kept across deploys.
      - backups:/app/backend/database/backups
      # [Sprint 15 D1] The app's files to download from the site (the admin uploads them), kept across deploys.
      - downloads:/app/backend/storage/app/downloads
    # Healthy once it has migrated and answers: the other services start after it.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  queue:
    <<: *game
    environment: { <<: *game-env, ROLE: queue }
    depends_on: { app: { condition: service_healthy } }

  scheduler:
    <<: *game
    environment: { <<: *game-env, ROLE: scheduler }
    depends_on: { app: { condition: service_healthy } }
    volumes:
      # db:backup (scheduled) writes its copies here too.
      - backups:/app/backend/database/backups

  matches:
    <<: *game
    environment: { <<: *game-env, ROLE: matches }
    depends_on: { app: { condition: service_healthy } }
    # The runner stops at its next minute when asked, so a restart never cuts a minute in half.
    stop_grace_period: 30s

  reverb:
    <<: *game
    environment: { <<: *game-env, ROLE: reverb, REVERB_SERVER_HOST: 0.0.0.0, REVERB_SERVER_PORT: 8080 }
    depends_on: { app: { condition: service_healthy } }
    ports:
      - "127.0.0.1:8080:8080"

networks:
  glm:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  backups:
  downloads:
  redisdata:
