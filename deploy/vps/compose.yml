# [X48] The game on our own server (Hostinger KVM 1, README.md): the game's image (Dockerfile), beside its own
# PostgreSQL. CloudPanel's nginx gives HTTPS and passes the requests to 127.0.0.1:8000.
# Run by deploy/vps/deploy.sh, with the secrets in /opt/legends/.env on the server (never in the repository).
name: legends
# [Sprint 21 E8.7] Docker keeps each container's output in files on the disk: five of 10 MB at most, then the oldest goes.
x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: legends
      POSTGRES_DB: legends
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in /opt/legends/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legends -d legends"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../..
      # [Sprint 39 B3] The site's address for the web build (canonical links, sitemap): the domain is one setting.
      args:
        PUBLIC_URL: ${PUBLIC_URL:-https://nesr.site}
    image: legends:latest
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    env_file: /opt/legends/.env
    environment:
      DATABASE_URL: postgresql://legends:${DB_PASSWORD}@db:5432/legends
      DB_SSLMODE: disable
      # Live updates: Reverb in this container. The web connects to wss://<site>/app with the key built into it
      # (web/src/lib/echo.ts, public by design); the secret is made on the server (deploy.sh).
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: legends
      REVERB_APP_KEY: legends-dev-key
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    volumes:
      # The copies before each deploy's migrations (db:backup), kept across deploys.
      - backups:/app/backend/database/backups

volumes:
  pgdata:
  backups:
