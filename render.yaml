# Render Blueprint: one free web service from the Dockerfile.
# Deploy: https://render.com/deploy?repo=https://github.com/smssdev/Legends
services:
  - type: web
    name: legends
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/sim/leagues
    autoDeploy: true
    # Optional, set in the service's Environment (deploy/render/start.sh): real emails through Gmail, and Google sign-in.
    envVars:
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
