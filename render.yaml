# Render Blueprint: one free web service from the Dockerfile.
# Deploy: https://render.com/deploy?repo=https://github.com/smssdev/Legends
services:
  - type: web
    name: legends
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/sim/leagues
    # Off on purpose [X33]: Render starts the new version while the old one still serves, so whatever is done in
    # that minute stays in the old copy. Deploy by hand (Manual Deploy) when no match is live (docs/PLAN.md 8.1).
    autoDeploy: false
    # Optional, set in the service's Environment (deploy/render/start.sh): real emails through Gmail, and Google sign-in.
    envVars:
      # One key for every deploy, so sign-ins and encrypted values survive it (start.sh).
      - key: APP_KEY_SEED
        generateValue: true
      # [X43] The game in Supabase (free PostgreSQL): its connection string (Connect → Session pooler). With it nothing
      # is lost on a restart; the first start moves the league from B2 into it once.
      - key: DATABASE_URL
        sync: false
      # The saved game in Backblaze B2 (free up to 10 GB): without these the data is wiped on every restart.
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: OWNER_HAMZA_EMAIL
        sync: false
      - key: OWNER_SOLIMAN_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: SUPPORT_TELEGRAM
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
