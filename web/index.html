<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1A2C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="المدرب الأسطورة" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The game's font, Amin (Sprint 20 S2), from our own files; Barlow Condensed for the scores and counters. -->
    <link rel="preload" href="/fonts/amin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/amin-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
    <!-- [X56] The day look before the first paint (src/lib/theme.ts keeps it after), so the page never flashes. -->
    <script>
      try {
        var t = localStorage.getItem('legends.theme');
        if (t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EFEADF');
        }
      } catch (e) {}
    </script>
    <!-- seo: each public page's tags (src/content/seo.ts); the build writes them, src/lib/seo.ts keeps them as the coach moves -->
    <title>المدرب الأسطورة · لعبة إدارة كرة القدم أونلاين مع أصحابك</title>
    <meta name="description" content="المدرب الأسطورة لعبة عربية مجانية لإدارة كرة القدم أونلاين: اختر ناديك، وكوّن دورياً خاصاً مع أصحابك، وأدر المباراة حية." />
    <!-- [X61] Every other link (an invite /join/CODE shared on WhatsApp) still shows a card: the game's own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="المدرب الأسطورة" />
    <meta property="og:title" content="المدرب الأسطورة · العب معي في دوري خاص" />
    <meta property="og:description" content="لعبة عربية مجانية لإدارة كرة القدم أونلاين: اختر ناديك، وكوّن دورياً خاصاً مع أصحابك، وأدر المباراة حية." />
    <meta property="og:image" content="https://nesr.site/brand/og-invite.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "المدرب الأسطورة",
            "alternateName": ["لعبة المدرب الأسطورة", "Game Legend Manager", "GLM"],
            "url": "https://nesr.site/",
            "inLanguage": ["ar", "en"]
          },
          {
            "@type": "VideoGame",
            "name": "المدرب الأسطورة",
            "alternateName": "Game Legend Manager",
            "description": "لعبة عربية مجانية لإدارة كرة القدم أونلاين: دوريات خاصة مع الأصدقاء، ومباريات تُدار حية بالتكتيك والتبديلات، وسوق وتدريب وملعب.",
            "url": "https://nesr.site/",
            "image": "https://nesr.site/icon-512.png",
            "genre": ["Sports", "Football manager", "Simulation"],
            "gamePlatform": ["Web browser", "Android"],
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "playMode": "MultiPlayer",
            "inLanguage": ["ar", "en"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
