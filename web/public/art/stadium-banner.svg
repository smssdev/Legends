<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <!-- Legends' stadium for wide banners [X29]: floodlights on both sides, the stands, the pitch under the lights. -->
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061430"/>
      <stop offset="0.6" stop-color="#0C2753"/>
      <stop offset="1" stop-color="#0A1F42"/>
    </linearGradient>
    <radialGradient id="bbeamL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 70) rotate(28) scale(1000 230)">
      <stop offset="0" stop-color="#FFEFC2" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#F5B82E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bbeamR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1450 70) rotate(152) scale(1000 230)">
      <stop offset="0" stop-color="#FFEFC2" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#F5B82E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bglow" cx="800" cy="420" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BB673" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1E9E4A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1E9E4A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bcrowd" width="12" height="9" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#C9D2E1" fill-opacity="0.22"/>
      <circle cx="9" cy="6.5" r="1.5" fill="#F5B82E" fill-opacity="0.18"/>
    </pattern>
    <pattern id="bstripe" width="120" height="420" patternUnits="userSpaceOnUse">
      <rect width="60" height="420" fill="#1E9E4A" fill-opacity="0.18"/>
    </pattern>
    <g id="bmast">
      <path d="M-3 0 L3 0 L6 330 L-6 330 Z" fill="#10284F"/>
      <circle cx="0" cy="-12" r="70" fill="url(#bhalo)"/>
      <rect x="-40" y="-28" width="80" height="34" rx="5" fill="#1B3B6E"/>
      <g fill="#FFF8E1">
        <circle cx="-26" cy="-18" r="4.5"/><circle cx="-13" cy="-18" r="4.5"/><circle cx="0" cy="-18" r="4.5"/><circle cx="13" cy="-18" r="4.5"/><circle cx="26" cy="-18" r="4.5"/>
        <circle cx="-26" cy="-5" r="4.5"/><circle cx="-13" cy="-5" r="4.5"/><circle cx="0" cy="-5" r="4.5"/><circle cx="13" cy="-5" r="4.5"/><circle cx="26" cy="-5" r="4.5"/>
      </g>
    </g>
  </defs>
  <rect width="1600" height="420" fill="url(#bsky)"/>
  <g fill="#F7F4EA" fill-opacity="0.55">
    <circle cx="480" cy="40" r="1.3"/><circle cx="610" cy="85" r="1"/><circle cx="730" cy="30" r="1.4"/><circle cx="880" cy="70" r="1"/>
    <circle cx="1010" cy="35" r="1.2"/><circle cx="1130" cy="90" r="0.9"/><circle cx="560" cy="120" r="0.8"/><circle cx="960" cy="125" r="0.8"/>
  </g>
  <!-- the stands: a far roof line, two tiers of crowd -->
  <path d="M0 210 Q800 120 1600 210 L1600 420 L0 420 Z" fill="#132E5B"/>
  <path d="M0 210 Q800 120 1600 210" fill="none" stroke="#2F6FDB" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M0 222 Q800 135 1600 222 L1600 270 Q800 185 0 270 Z" fill="url(#bcrowd)"/>
  <path d="M0 270 Q800 190 1600 270 L1600 420 L0 420 Z" fill="#0F2649"/>
  <path d="M0 280 Q800 200 1600 280 L1600 318 Q800 240 0 318 Z" fill="url(#bcrowd)"/>
  <path d="M0 318 Q800 240 1600 318" fill="none" stroke="#F5B82E" stroke-opacity="0.45" stroke-width="2"/>
  <!-- the beams over everything -->
  <path d="M150 70 L1150 420 L520 420 Z" fill="url(#bbeamL)"/>
  <path d="M1450 70 L450 420 L1080 420 Z" fill="url(#bbeamR)"/>
  <use href="#bmast" x="150" y="70"/>
  <use href="#bmast" x="1450" y="70"/>
  <!-- the pitch -->
  <path d="M230 420 L470 330 L1130 330 L1370 420 Z" fill="#1A8A42"/>
  <path d="M230 420 L470 330 L1130 330 L1370 420 Z" fill="url(#bstripe)"/>
  <ellipse cx="800" cy="420" rx="760" ry="140" fill="url(#bglow)"/>
  <g fill="none" stroke="#F7F4EA" stroke-opacity="0.55" stroke-width="2">
    <path d="M230 420 L470 330 L1130 330 L1370 420"/>
    <path d="M800 330 L800 420"/>
    <ellipse cx="800" cy="385" rx="110" ry="30"/>
  </g>
</svg>
