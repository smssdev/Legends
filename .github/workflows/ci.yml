name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.3 exercises App\Database\ImmediatePdo; 8.4 uses Laravel's own transaction_mode.
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      # No package with a known security hole [E1.5].
      - run: composer audit --no-interaction
      - run: php artisan test

  postgres:
    # [X43] The game runs on Supabase (PostgreSQL): every test there too. Supabase is PostgreSQL 15 and up.
    name: Backend on PostgreSQL (Supabase)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: legends, POSTGRES_PASSWORD: legends, POSTGRES_DB: legends_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_URL: pgsql://legends:legends@127.0.0.1:5432/legends_test
      DB_QUEUE_CONNECTION: pgsql
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, mbstring, intl, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-8.4-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  engine:
    name: Engine balance (short run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-8.4-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate && php artisan migrate --force && php artisan data:import
      # README.md 4.5: the same targets as the nightly 5000-match run, on fixed seeds and a short sample
      # (each target allows two standard errors of the sample). The full runs are nightly on the home server.
      - run: php artisan sim:balance --n=760 --favourite=300
      - run: php artisan sim:knobs --n=300
      - run: php artisan sim:matrix --n=100
      - run: php artisan sim:golden
      - run: php artisan sim:training
      - run: php artisan sim:bots --n=100

  arm:
    name: Engine on ARM (golden matches)
    # The repository is private, so no hosted ARM runner: the official arm64 PHP image under QEMU.
    # The same golden matches as x86, minute for minute (sprints/01-foundation.md 1.5). Only the golden test runs: it is quick.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Golden matches on arm64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/backend:/app" -w /app php:8.4-cli \
            sh -c 'uname -m && php vendor/bin/phpunit tests/Unit/EngineGoldenTest.php'

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # No package with a known high or critical security hole [E1.5].
      - run: npm audit --audit-level=high --omit=dev
      # The TypeScript client comes from docs/api/openapi.yaml: this fails on an invalid contract,
      # or when a route changed without `npm run api` in the same PR (CLAUDE.md: the API contract).
      - name: API client matches the contract
        run: npm run api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run build

  # [Sprint 30 G8] The critical path in a real browser (sign-up → league → lineup → match → report) and an
  # accessibility check (axe) of the first screens: the API on SQLite with the game's data, the web from Vite.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd, intl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: cp .env.example .env && sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=log/' .env && echo 'ADMIN_TWO_FACTOR=false' >> .env && php artisan key:generate && touch database/legends.sqlite database/database.sqlite && php artisan migrate --force && php artisan data:import
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: web/test-results

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t legends .
      - name: Smoke test
        run: |
          docker run -d --name legends -p 8000:8000 legends
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/sim/leagues > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/sim | grep -q '<div id="app">'
          curl -sf http://127.0.0.1:8000/api/v1/sim/leagues | grep -q 'Premier League'
          id=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"home_id":1,"away_id":2,"control":{"home":"cpu","away":"cpu"}}' http://127.0.0.1:8000/api/v1/sim/matches | sed -E 's/.*"id":"([^"]+)".*/\1/')
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"count":5}' "http://127.0.0.1:8000/api/v1/sim/matches/$id/ticks" | grep -q '"moment"'
      - if: failure()
        run: docker logs legends || true
      # [X43, X48] The same image on PostgreSQL, as on our server: an empty database gets the game's tables and the club data at start.
      - name: Smoke test on PostgreSQL
        run: |
          docker rm -f legends
          docker run -d --name pg --network host -e POSTGRES_PASSWORD=pg postgres:15
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          docker run -d --name legends-pg --network host -e DATABASE_URL=postgresql://postgres:pg@127.0.0.1:5432/postgres -e DB_SSLMODE=disable legends
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/sim/leagues > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/v1/sim/leagues | grep -q 'Premier League'
          docker exec pg psql -U postgres -tAc 'select count(*) from master_clubs' | grep -qv '^0$'
      - if: failure()
        run: docker logs legends-pg || true

  scripts:
    name: Unity scripts (PowerShell parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem unity/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 }
