name: Mobile

# [Sprint 15 X1] The Flutter app (mobile/): its tokens current with docs/design/tokens.json, the analyzer, the tests,
# and an APK to install, kept as the run's artifact.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'docs/design/tokens.json', 'docs/design/nav.json', 'docs/api/openapi.yaml', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'docs/design/tokens.json', 'docs/design/nav.json', 'docs/api/openapi.yaml', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter (analyze, test, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tokens current with docs/design/tokens.json
        run: dart run tool/tokens.dart && git diff --exit-code lib/ui/tokens.g.dart
      - run: flutter gen-l10n
      # [Sprint 59 F1] The models current with docs/api/openapi.yaml (as npm run api for the web).
      - name: Models from the contract
        run: dart run tool/api.dart && git diff --exit-code lib/api/gen/models.g.dart
      # [Sprint 60 F1] The dock's sections current with docs/design/nav.json (the site's web/scripts/nav.mjs too).
      - name: Frame from nav.json
        run: dart run tool/nav.dart && git diff --exit-code lib/l10n/nav.g.dart
      # [Sprint 54 F4] No colour or font size of a screen's own outside lib/ui/ (the baseline only shrinks).
      - name: Design system binds
        run: dart run tool/design.dart
      # [Sprint 59 F9] No Arabic word in the code outside lib/l10n/.
      - name: Words in the arb files
        run: dart run tool/arabic.dart
      # [Sprint 59 F3] The code formatted at 140 (analysis_options.yaml).
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      # [Sprint 59 F8] The screenshots against their references in test/shots/goldens/ (a change meant to be is
      # written with --update-goldens in the same PR, after looking at it); a difference keeps its pictures below.
      - name: Screenshots
        run: flutter test test/shots --tags shots --run-skipped
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: mobile/test/shots/failures/
      # Phones only (arm64 and arm32: every Android phone), not the emulators' x86_64: a smaller download.
      # One APK per phone type (arm64 for nearly every phone, armeabi-v7a for old ones), obfuscated: about 22 MB, not 46.
      # [Sprint 62 F1] The game's one fixed key (README section 8): written from GitHub Secrets for the release, so each
      # version installs over the last and the invitation links open the app. Without the secrets (a fork, a PR from
      # outside) build.gradle.kts falls back to the debug key.
      - name: The release key from the secrets
        env:
          KEYSTORE_B64: ${{ secrets.GLM_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/glm-release.jks"
          echo "GLM_KEYSTORE=$RUNNER_TEMP/glm-release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          GLM_KEYSTORE_PASSWORD: ${{ secrets.GLM_KEYSTORE_PASSWORD }}
          GLM_KEY_ALIAS: ${{ secrets.GLM_KEY_ALIAS }}
          GLM_KEY_PASSWORD: ${{ secrets.GLM_KEY_PASSWORD }}
      # [Sprint 62 F7] The download stays light: each phone type's APK under 25 MB.
      - name: APK size under 25 MB
        run: |
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$f"); echo "$f: $((size / 1048576)) MB"
            if [ "$size" -gt 26214400 ]; then echo "::error::$f is over 25 MB"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: glm-apk
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
