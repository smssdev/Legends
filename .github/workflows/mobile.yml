name: Mobile

# [Sprint 15 X1] The Flutter app (mobile/): its tokens current with docs/design/tokens.json, the analyzer, the tests,
# and an APK to install, kept as the run's artifact.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'docs/design/tokens.json', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'docs/design/tokens.json', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter (analyze, test, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tokens current with docs/design/tokens.json
        run: dart run tool/tokens.dart && git diff --exit-code lib/ui/tokens.g.dart
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glm-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
